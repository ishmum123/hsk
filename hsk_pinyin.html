<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK pinyin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0ED;--ink:#1B2321;--mute:#5C6B67;--line:#D6DAD7;--card:#FFFFFF;
    --ok:#2F7A5B;--ok-bg:#E4F1EB;--bad:#B4483F;--bad-bg:#FBEAE8;
    --t1:#3B6E99;--t2:#3E8B5C;--t3:#9C6B2E;--t4:#B33F3F;--t5:#8A8378;
    --font: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --zh: "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
      --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
      --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
    --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
    --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
  body{padding-bottom:calc(64px + var(--safe-b))}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 24px;min-height:calc(100dvh - 64px - var(--safe-b));display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex:0 0 auto}
  h1{font-size:18px;font-weight:600;margin:0}
  .score{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .themebtn{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:16px;color:var(--ink);flex:0 0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;flex:1 1 auto;display:flex;flex-direction:column}
  #panel > .done{display:flex;flex-direction:column;flex:1 1 auto}
  .next:last-child, .primary:last-child, .done .next{margin-top:auto}
  /* Explicit pin for screens where the trailing action isn't reliably the DOM
     last-child (e.g. a hidden-until-answered Next button, or a landing screen
     whose action is a button plus a row of secondary options after it). */
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  .q{color:var(--mute);font-size:15px;margin:0 0 10px}
  /* v2's .big/.med stimuli are pinyin or English, not characters — the Chinese font
     only belongs on elements that actually render a word's `w` field (see charSpan()
     and its "zh" class rules below). */
  .big{font-size:52px;line-height:1.3;text-align:center;margin:6px 0 16px;font-weight:500}
  .med{font-size:22px;line-height:1.5;margin:2px 0 14px}
  .en{color:var(--mute);font-size:15px;text-align:center;margin-top:-8px;margin-bottom:14px}
  .opts{display:grid;gap:8px}
  .opts button{width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:17px;color:var(--ink);line-height:1.35;min-height:48px;font-family:var(--font)}
  .opts button b.num{color:var(--mute);font-weight:500;margin-right:8px;font-size:14px}
  .opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  /* Drill hero: the meaning choices are the main event on every meaning-centred item
     (hear/read/recall), so they get more room and weight than a plain option list. */
  .opts-hero button{font-size:18px;padding:18px 18px;min-height:58px;font-weight:500}
  .hear-stage{display:flex;justify-content:center;margin:14px 0 22px}
  .speaker{width:92px;height:92px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:36px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  @keyframes speakerPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .speaker.speaking{animation:speakerPulse 0.9s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .speaker.speaking{animation:none} }
  .reveal{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:none;font-size:15px}
  .reveal .py{font-size:20px;margin-bottom:4px}
  .next,.primary{margin-top:14px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;min-height:48px;font-family:var(--font)}
  .ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;min-height:44px;font-family:var(--font)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .row button, .chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;color:var(--ink);min-height:44px;font-family:var(--font)}
  .row button.on, .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .replay{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:17px;color:var(--ink);flex:0 0 auto}
  .listen-stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0}
  .contour{display:inline-block}
  .t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t5{color:var(--t5)}
  input[type=text]{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;font-size:19px;background:var(--card);color:var(--ink);font-family:var(--font)}
  input[type=text]:focus{outline:3px solid #7AA7D9;outline-offset:1px}
  .diff{font-size:15px;margin-top:6px}
  .diff span{display:inline-block;margin-right:6px;padding:2px 6px;border-radius:6px}
  .diff .hit{background:var(--ok-bg);color:var(--ok)}
  .diff .miss{background:var(--bad-bg);color:var(--bad)}
  .wl{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:flex-start;gap:12px}
  .wl .zh{font-size:24px;font-family:var(--zh);flex:0 0 auto;width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wl .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .wl .py{font-size:17px;display:block}
  .wl .en{color:var(--mute);font-size:14px;text-align:left;display:block}
  table.stats{width:100%;border-collapse:collapse;font-size:15px}
  table.stats td{padding:8px 0;border-bottom:1px solid var(--line)}
  table.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--ink)}
  .path{display:flex;gap:6px;align-items:center;margin-bottom:14px}
  .path .seg{flex:1;text-align:center;font-size:11px;color:var(--mute)}
  .stmt{font-size:15px;line-height:1.5;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .warn{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .done h2{font-size:22px;margin:0 0 10px;font-weight:600}
  .done ul{padding-left:20px;font-size:15px;margin:8px 0}
  .card-teach{margin-bottom:14px}
  .card-teach h3{font-size:17px;margin:0 0 8px;font-weight:600}
  .card-teach p{font-size:15px;color:var(--mute);margin:0 0 10px}
  .rowset{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
  .rowset .zh{font-family:var(--zh);font-size:18px;flex:0 0 auto;width:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowset .py{flex:1;min-width:0}
  .rowset .en{color:var(--mute);font-size:14px;text-align:right;flex:0 1 auto;min-width:0}
  .taplist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .taplist button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:15px;min-height:48px}
  .plist button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;font-size:16px;color:var(--ink);min-height:48px;align-items:center}
  .plist .tick{color:var(--ok);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--card);color:var(--ink);font-family:var(--font)}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:5}
  .tabs button{flex:1;background:transparent;border:none;padding:10px 4px 8px;font-size:12px;color:var(--mute);min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font)}
  .tabs button .ic{font-size:20px;line-height:1}
  .tabs button.on{color:var(--ink);font-weight:600}
  button{cursor:pointer}
  button:focus-visible, .opts button:focus-visible, [tabindex]:focus-visible{outline:3px solid #7AA7D9;outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .reveal{transition:opacity 0.15s ease}
  @media (prefers-reduced-motion: reduce){ .reveal{transition:none} }
  /* Desktop: keep the same phone-shaped column but stop the tab bar and empty
     grey margins from spanning the whole viewport — center a wider column and
     constrain the tab bar to it, so the app reads as a real desktop layout
     rather than a stretched phone screen. Phone layout above is unchanged. */
  @media (min-width: 900px){
    .wrap{max-width:640px}
    .tabs{left:50%;transform:translateX(-50%);width:640px;max-width:100vw;border-left:1px solid var(--line);border-right:1px solid var(--line);border-radius:16px 16px 0 0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="htitle">HSK pinyin</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="score" id="score"></span>
      <button class="themebtn" id="themebtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <div id="panel" class="card"></div>
  <div id="live" aria-live="polite" class="sr-only"></div>
</div>
<nav class="tabs" id="tabs">
  <button data-t="today" class="on"><span class="ic">◷</span>Today</button>
  <button data-t="words"><span class="ic">字</span>Words</button>
  <button data-t="sounds"><span class="ic">〜</span>Sounds</button>
  <button data-t="test"><span class="ic">✓</span>Test</button>
  <button data-t="progress"><span class="ic">◔</span>Progress</button>
</nav>

<script>
// pinyin_core.js — pinyin helpers shared by the trainer app and the node checks.
// No DOM dependency (works under Node for tests); exports via window or module.exports.
(function(root){
"use strict";

// ---------------------------------------------------------------- tone marks
const TONE_CHARS = {
  a: ["a","ā","á","ǎ","à"],
  e: ["e","ē","é","ě","è"],
  i: ["i","ī","í","ǐ","ì"],
  o: ["o","ō","ó","ǒ","ò"],
  u: ["u","ū","ú","ǔ","ù"],
  "ü": ["ü","ǖ","ǘ","ǚ","ǜ"]
};
const BASE_OF = {};
Object.keys(TONE_CHARS).forEach(base=>{ TONE_CHARS[base].forEach(ch=>{ BASE_OF[ch]=base; }); });

function toneMarkChar(baseLetter, tone){
  const arr = TONE_CHARS[baseLetter];
  if(!arr) return baseLetter;
  if(!tone || tone===0 || tone===5) return baseLetter;
  return arr[tone] || baseLetter;
}

// Standard placement rule: a > e > o > last of i/u/ü.
function markVowelIndex(letters){
  const lower = letters.toLowerCase();
  let idx = lower.indexOf("a"); if(idx>=0) return idx;
  idx = lower.indexOf("e"); if(idx>=0) return idx;
  idx = lower.indexOf("o"); if(idx>=0) return idx;
  for(let i=lower.length-1;i>=0;i--){ if("iuü".indexOf(lower[i])>=0) return i; }
  return -1;
}

function markSyllable(letters, tone){
  const idx = markVowelIndex(letters);
  if(idx<0) return letters;
  const ch = letters[idx];
  const base = BASE_OF[ch.toLowerCase()] || ch.toLowerCase();
  const marked = toneMarkChar(base, +tone);
  const isUpper = ch === ch.toUpperCase() && ch !== ch.toLowerCase();
  const out = isUpper ? marked.toUpperCase() : marked;
  return letters.slice(0,idx) + out + letters.slice(idx+1);
}

// ------------------------------------------------------------- syllable split
const SYLL_RE = /[a-zA-Zü]+[0-5]/g;
function syll(n){ return String(n).match(SYLL_RE) || []; }
function tones(n){ return syll(n).map(s=>s.slice(-1)).join("-"); }
function startsAOE(chunk){ return /^[aeoüAEOÜ]/.test(chunk); }

function markOne(chunk){ return markSyllable(chunk.slice(0,-1), chunk.slice(-1)); }

// numbered -> marked, with the a/o/e syllable-boundary apostrophe rule (Xi'an, nǚ'ér)
function mark(n){
  const chunks = syll(n);
  let out = "";
  chunks.forEach((c,i)=>{
    if(i>0 && startsAOE(c)) out += "'";
    out += markOne(c);
  });
  return out;
}

function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// Render-time guard: an `en` gloss should never contain a Chinese character (the
// data pipeline's sanitize_gloss in tools/build_vocab.py handles this at the
// source), but every render site that shows a word's meaning goes through this one
// function, so a future data regression can't leak a character past the "show
// characters" toggle the way a handful of un-sanitized glosses did before.
const CJK_TEST_RE = /[一-鿿㐀-䶿]/;
function gloss(entry){
  const en = String((entry && entry.en) || "");
  if(!CJK_TEST_RE.test(en)) return en;
  return en.replace(/[一-鿿㐀-䶿]+/g, "").replace(/\s+/g, " ").replace(/\(\s*\)/g, "").trim();
}

// tone-coloured pinyin renderer: each syllable in <span class="t1".."t5">
function pyHTML(n){
  const chunks = syll(n);
  let out = "";
  chunks.forEach((c,i)=>{
    const tone = +c.slice(-1) || 5;
    if(i>0 && startsAOE(c)) out += "'";
    out += `<span class="t${tone}">${escapeHtml(markOne(c))}</span>`;
  });
  return out;
}

// marked pinyin -> toneless (keeps apostrophes/case/ü, only strips tone diacritics)
function strip(py){
  let out = "";
  for(const ch of String(py)){
    const lower = ch.toLowerCase();
    if(BASE_OF[lower] !== undefined){
      const base = BASE_OF[lower];
      const isUpper = ch === ch.toUpperCase() && ch !== ch.toLowerCase();
      out += isUpper ? base.toUpperCase() : base;
    } else out += ch;
  }
  return out;
}

// ------------------------------------------------------- valid syllable table
// Standard Mandarin initial x final grid, spelled as actually written
// (zero-initial uses y/w forms; j/q/x drop the ü dots).
const INITIAL_FINALS = {
  "b": ["a","ai","an","ang","ao","o","ei","en","eng","i","ie","iao","ian","in","iang","ing","u"],
  "p": ["a","ai","an","ang","ao","o","ei","en","eng","ou","i","ie","iao","ian","in","iang","ing","u"],
  "m": ["a","ai","an","ang","ao","o","ei","en","eng","ou","i","ie","iao","iu","ian","in","iang","ing","u"],
  "f": ["a","an","ang","ei","en","eng","ou","u","o"],
  "d": ["a","ai","an","ang","ao","e","ei","en","eng","ong","i","ia","ie","iao","iu","ian","ing","ou","u","uo","ui","uan","un"],
  "t": ["a","ai","an","ang","ao","e","eng","ong","i","ian","iao","ie","ing","ou","u","uo","ui","uan","un"],
  "n": ["a","ai","an","ang","ao","e","ei","en","eng","i","ian","iang","iao","ie","in","ing","iu","ong","ou","u","uan","uo","ü","üe"],
  "l": ["a","ai","an","ang","ao","e","ei","eng","i","ia","ian","iang","iao","ie","in","ing","iu","ong","ou","u","uan","un","uo","ü","üe","o"],
  "g": ["a","ai","an","ang","ao","e","ei","en","eng","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "k": ["a","ai","an","ang","ao","e","ei","en","eng","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "h": ["a","ai","an","ang","ao","e","ei","en","eng","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "j": ["i","ia","ian","iang","iao","ie","in","ing","iong","iu","u","uan","ue","un"],
  "q": ["i","ia","ian","iang","iao","ie","in","ing","iong","iu","u","uan","ue","un"],
  "x": ["i","ia","ian","iang","iao","ie","in","ing","iong","iu","u","uan","ue","un"],
  "zh":["a","ai","an","ang","ao","e","ei","en","eng","i","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "ch":["a","ai","an","ang","ao","e","en","eng","i","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "sh":["a","ai","an","ang","ao","e","ei","en","eng","i","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "r": ["an","ang","ao","e","en","eng","i","ong","ou","u","ua","uan","ui","un","uo"],
  "z": ["a","ai","an","ang","ao","e","ei","en","eng","i","ong","ou","u","uan","ui","un","uo"],
  "c": ["a","ai","an","ang","ao","e","en","eng","i","ong","ou","u","uan","ui","un","uo"],
  "s": ["a","ai","an","ang","ao","e","en","eng","i","ong","ou","u","uan","ui","un","uo"],
  "": ["a","o","e","ai","ei","ao","ou","an","en","ang","eng","er",
       "yi","ya","ye","yao","you","yan","yin","yang","ying","yong",
       "wu","wa","wo","wai","wei","wan","wen","wang","weng",
       "yu","yue","yuan","yun","yo"]
};
const INITIALS_BY_LEN = Object.keys(INITIAL_FINALS).filter(k=>k).sort((a,b)=>b.length-a.length);

const VALID_SYLLABLES = new Set();
Object.keys(INITIAL_FINALS).forEach(init=>{
  INITIAL_FINALS[init].forEach(fin=>VALID_SYLLABLES.add(init+fin));
});

function splitSyllable(toneless){
  const s = toneless.toLowerCase();
  for(const init of INITIALS_BY_LEN){
    if(s.indexOf(init)===0){
      const rest = s.slice(init.length);
      if(INITIAL_FINALS[init].indexOf(rest)>=0) return {initial:init, final:rest};
    }
  }
  if(INITIAL_FINALS[""].indexOf(s)>=0) return {initial:"", final:s};
  return null;
}

// ------------------------------------------------------------- type checking
function pipeline(s){
  return String(s).toLowerCase()
    .replace(/u:/g,"v")
    .replace(/ü/g,"v")
    .replace(/['\-\s]/g,"");
}

// all numbered forms a learner might legitimately type: the exact number
// string, plus neutral tone (digit "5") written as "0" or omitted per syllable.
function numberedCandidates(n){
  const chunks = syll(n);
  const perChunk = chunks.map(c=>{
    const letters = c.slice(0,-1), digit = c.slice(-1);
    return digit==="5" ? [letters+"5", letters+"0", letters] : [c];
  });
  let combos = [""];
  perChunk.forEach(opts=>{
    const next = [];
    combos.forEach(prefix=>opts.forEach(o=>next.push(prefix+o)));
    combos = next;
  });
  return combos.map(pipeline);
}

function normType(input){ return pipeline(input); }

function acceptTypeAnswer(input, entry){
  const target = new Set(numberedCandidates(entry.n));
  target.add(pipeline(entry.py));
  return target.has(normType(input));
}

// ------------------------------------------------------------- distractors
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const INITIAL_PAIRS = [["b","p"],["d","t"],["g","k"],["j","q"],["zh","ch"],["z","c"],["zh","z"],["ch","c"],["sh","s"],["j","zh"],["q","ch"],["x","sh"],["n","l"],["r","l"],["f","h"]];
const FINAL_PAIRS = [["an","ang"],["en","eng"],["in","ing"],["ian","iang"],["uan","uang"],["ao","ou"],["ai","ei"],["e","o"]];

function confusablesFor(list, item){
  const out = [];
  list.forEach(p=>{ if(p[0]===item) out.push(p[1]); if(p[1]===item) out.push(p[0]); });
  return out;
}

// entry: {n,...}; pool: VOCAB array (for the same-syllable-count fallback).
function distractors(entry, pool){
  const chunks = syll(entry.n);
  const results = [];
  const seen = new Set([pipeline(entry.n)]);

  function tryAdd(candChunks){
    if(results.length>=3) return;
    const candN = candChunks.join("");
    const key = pipeline(candN);
    if(seen.has(key)) return;
    const ok = candChunks.every(c=>{
      const letters = c.slice(0,-1).toLowerCase();
      // A chunk whose letters are exactly "r" (e.g. the last syllable of yi4hui4r5,
      // 一会儿) is the retroflex erhua suffix on the preceding syllable, not a
      // standalone syllable — it will never appear in VALID_SYLLABLES, so it's
      // exempted from that check here rather than always sitting at the end.
      return letters==="r" || VALID_SYLLABLES.has(letters);
    });
    if(!ok) return;
    seen.add(key);
    results.push({n:candN, py:mark(candN)});
  }

  // 1. same syllables, one tone changed
  for(let i=0;i<chunks.length && results.length<3;i++){
    const letters = chunks[i].slice(0,-1), origTone = chunks[i].slice(-1);
    // neutral tone (5) never occurs on the first syllable of a word in real Mandarin,
    // so it's a trivially-eliminable distractor there — exclude it.
    const toneChoices = ["1","2","3","4","5"].filter(t=>t!==origTone && !(i===0 && t==="5"));
    shuffle(toneChoices).forEach(t=>{
      if(results.length<3) tryAdd(chunks.map((c,j)=>j===i?letters+t:c));
    });
  }
  // 2. confusable initial swap
  for(let i=0;i<chunks.length && results.length<3;i++){
    const letters = chunks[i].slice(0,-1), tone = chunks[i].slice(-1);
    const sp = splitSyllable(letters);
    if(!sp || !sp.initial) continue;
    shuffle(confusablesFor(INITIAL_PAIRS, sp.initial)).forEach(alt=>{
      if(results.length>=3) return;
      if(INITIAL_FINALS[alt] && INITIAL_FINALS[alt].indexOf(sp.final)>=0){
        tryAdd(chunks.map((c,j)=>j===i?(alt+sp.final+tone):c));
      }
    });
  }
  // 3. confusable final swap
  for(let i=0;i<chunks.length && results.length<3;i++){
    const letters = chunks[i].slice(0,-1), tone = chunks[i].slice(-1);
    const sp = splitSyllable(letters);
    if(!sp) continue;
    const alts = confusablesFor(FINAL_PAIRS, sp.final);
    if(sp.final==="u" && (sp.initial==="n"||sp.initial==="l")) alts.push("ü");
    if(sp.final==="ü" && (sp.initial==="n"||sp.initial==="l")) alts.push("u");
    shuffle(alts).forEach(alt=>{
      if(results.length>=3) return;
      if(INITIAL_FINALS[sp.initial] && INITIAL_FINALS[sp.initial].indexOf(alt)>=0){
        tryAdd(chunks.map((c,j)=>j===i?(sp.initial+alt+tone):c));
      }
    });
  }
  // 4. another vocab word, same syllable count
  if(results.length<3 && pool && pool.length){
    shuffle(pool.filter(v=>v.n!==entry.n && syll(v.n).length===chunks.length)).forEach(v=>{
      if(results.length<3) tryAdd(syll(v.n));
    });
  }
  return results.slice(0,3);
}

// ------------------------------------------------- meaning-centred distractors
// first two whitespace-separated words of a gloss, lowercased and stripped of
// punctuation — used to reject near-synonym distractors (two "to eat"-ish glosses).
function firstTwoWords(en){
  return String(en).toLowerCase().replace(/[^a-z\s]/g,"").trim().split(/\s+/).slice(0,2).join(" ");
}

// entry: {en,lv,w,...}; pool: VOCAB array. Returns up to 3 other VOCAB entries whose
// gloss is a plausible wrong answer: never the same gloss, never sharing the first two
// gloss words with the answer or with each other, same level preferred over other levels.
function meaningOpts(entry, pool){
  const ansKey = String(entry.en).trim().toLowerCase();
  const ansFirst2 = firstTwoWords(entry.en);
  const candidates = (pool||[]).filter(v=>v.w!==entry.w && String(v.en).trim().toLowerCase()!==ansKey);
  const bySame = shuffle(candidates.filter(v=>v.lv===entry.lv));
  const byOther = shuffle(candidates.filter(v=>v.lv!==entry.lv));
  const ordered = [...bySame, ...byOther];

  function pass(strict){
    const chosen = []; const usedFirst2 = new Set([ansFirst2]);
    ordered.forEach(v=>{
      if(chosen.length>=3) return;
      const f2 = firstTwoWords(v.en);
      if(strict && usedFirst2.has(f2)) return;
      chosen.push(v); usedFirst2.add(f2);
    });
    return chosen;
  }
  let chosen = pass(true);
  if(chosen.length<3) chosen = pass(false); // small-pool fallback: keep "not the answer" only
  return chosen.slice(0,3);
}

// entry: {n,lv,...}; pool: VOCAB array. Returns up to 3 other VOCAB entries with the
// same syllable count as entry, same level preferred. Not phonetic near-misses (that
// generator is `distractors()` above, kept only for the Extras tone/type items) —
// meaning-recall distractors should be plausible words, not confusable spellings.
function pinyinOpts(entry, pool){
  const n = syll(entry.n).length;
  const ansKey = String(entry.en).trim().toLowerCase();
  const seen = new Set([pipeline(entry.n)]);
  const rank = v => Math.abs(syll(v.n).length - n);
  // Exclude gloss-twins (e.g. 经历/经验, both "experience; to experience") — with the
  // meaning shown and two pinyin options for words that mean the same thing, either
  // would be a "correct" answer, so the item would be ambiguous rather than hard.
  const candidates = (pool||[]).filter(v=>pipeline(v.n)!==pipeline(entry.n) && String(v.en).trim().toLowerCase()!==ansKey);
  const exact = candidates.filter(v=>rank(v)===0);
  const bySame = shuffle(exact.filter(v=>v.lv===entry.lv));
  const byOther = shuffle(exact.filter(v=>v.lv!==entry.lv));
  const chosen = [];
  function addFrom(list){
    list.forEach(v=>{
      if(chosen.length>=3) return;
      const key = pipeline(v.n);
      if(seen.has(key)) return;
      seen.add(key); chosen.push(v);
    });
  }
  addFrom(bySame); addFrom(byOther);
  if(chosen.length<3){
    // Extremely rare (a syllable count with fewer than 3 other words in the whole
    // corpus — e.g. "公共汽车" is the only 4-syllable HSK 1-4 word) — widen to the
    // closest syllable counts rather than leaving the drill item short of 4 options.
    const rest = shuffle(candidates.filter(v=>rank(v)>0)).sort((a,b)=>rank(a)-rank(b));
    addFrom(rest);
  }
  return chosen.slice(0,3);
}

// --------------------------------------------------------------- placement
// Splits a vocab pool into placement buckets: bucketSpec = [[level, bucketCount], ...].
// Default matches the spec: HSK1x3, HSK2x3, HSK3x4, HSK4x6 (16 buckets).
function strata(pool, bucketSpec){
  const spec = bucketSpec || [[1,3],[2,3],[3,4],[4,6]];
  const out = [];
  spec.forEach(([lv,nb])=>{
    const list = pool.filter(v=>v.lv===lv);
    const nsets = Math.ceil(list.length/10);
    const per = nsets/nb;
    for(let b=0;b<nb;b++){
      const s0 = Math.floor(b*per), s1 = Math.max(s0+1, Math.floor((b+1)*per));
      out.push({lv, s0, s1, words: list.slice(s0*10, s1*10)});
    }
  });
  return out;
}

// Decides where placement stops, given per-bucket results res=[{r,n},...] in bucket order.
// A single bucket's raw accuracy is noisy at 2-3 items (1 miss = 50-67%), so passing is
// judged on a rolling window of up to 3 buckets (the current one plus its two predecessors):
// bucket i passes if that window's combined accuracy is >=75% AND bucket i itself has
// at least 1 right answer (so an all-wrong bucket can never pass on a good window alone).
// Returns the index of the first failing bucket, or null if every bucket passed.
function placementStopIndex(res){
  for(let i=0;i<res.length;i++){
    const lo = Math.max(0, i-2);
    let wr = 0, wn = 0;
    for(let j=lo;j<=i;j++){ wr += res[j].r; wn += res[j].n; }
    const windowAcc = wn ? wr/wn : 1;
    const bucketOk = res[i].r >= 1;
    if(!(windowAcc >= 0.75 && bucketOk)) return i;
  }
  return null;
}

// Validates the shape of imported progress JSON before it replaces the live prog object.
// Returns {ok:true, data} or {ok:false, reason}.
function validateProgShape(data){
  if(!data || typeof data !== "object" || Array.isArray(data)) return {ok:false, reason:"not a JSON object"};
  if(data.v !== undefined && data.v !== 1 && data.v !== 2) return {ok:false, reason:`unknown progress version ${data.v}`};
  if(data.w !== undefined){
    if(!data.w || typeof data.w !== "object" || Array.isArray(data.w)) return {ok:false, reason:"w must be an object"};
    for(const k of Object.keys(data.w)){
      const p = data.w[k];
      if(!p || typeof p !== "object" || Array.isArray(p)) return {ok:false, reason:`w.${k} must be an object`};
      for(const f of ["r","w","s"]) if(p[f] !== undefined && typeof p[f] !== "number") return {ok:false, reason:`w.${k}.${f} must be a number`};
      if(p.prov !== undefined && typeof p.prov !== "number" && typeof p.prov !== "boolean") return {ok:false, reason:`w.${k}.prov must be a number or boolean`};
      if(p.d !== undefined && typeof p.d !== "number" && typeof p.d !== "boolean") return {ok:false, reason:`w.${k}.d must be a number or boolean`};
    }
  }
  if(data.sets !== undefined){
    if(!data.sets || typeof data.sets !== "object" || Array.isArray(data.sets)) return {ok:false, reason:"sets must be an object"};
    for(const k of Object.keys(data.sets)){
      if(!["1","2","3","4"].includes(k)) return {ok:false, reason:`sets has unknown level "${k}"`};
      if(typeof data.sets[k] !== "number") return {ok:false, reason:`sets.${k} must be a number`};
    }
  }
  if(data.lessons !== undefined && (!data.lessons || typeof data.lessons !== "object" || Array.isArray(data.lessons))) return {ok:false, reason:"lessons must be an object"};
  if(data.sessions !== undefined && typeof data.sessions !== "number") return {ok:false, reason:"sessions must be a number"};
  if(data.showChars !== undefined && typeof data.showChars !== "boolean") return {ok:false, reason:"showChars must be a boolean"};
  if(data.dismissedSoundsHint !== undefined && typeof data.dismissedSoundsHint !== "boolean" && typeof data.dismissedSoundsHint !== "number") return {ok:false, reason:"dismissedSoundsHint must be a boolean or number"};
  return {ok:true, data};
}

// Merges any validated progress data (v1 or v2 shaped) onto full v2 defaults and forces
// v:2, so a v1 export (or a v1 localStorage record at boot) migrates to a well-formed v2
// progress object. Word/set/lesson data is unchanged between versions — only `v` and the
// new `showChars` field (default false) differ. Shared by the app's import handler and
// its boot-time migration so there is exactly one place that knows the v1->v2 shape.
function migrateProg(data){
  const base = { v:2, w:{}, sets:{1:0,2:0,3:0,4:0}, lessons:{}, sessions:0, theme:null, showChars:false };
  const merged = Object.assign({}, base, data||{}, {v:2});
  if(merged.showChars === undefined) merged.showChars = false;
  return merged;
}

// ------------------------------------------------------------------- export
const API = { syll, mark, tones, strip, pyHTML, normType, acceptTypeAnswer, distractors, strata,
  placementStopIndex, validateProgShape, migrateProg, meaningOpts, pinyinOpts, firstTwoWords, gloss, escapeHtml,
  VALID_SYLLABLES, INITIAL_FINALS, splitSyllable, pipeline, numberedCandidates, markSyllable };
if(typeof module!=="undefined" && module.exports) module.exports = API;
if(root) root.PinyinCore = API;
})(typeof window!=="undefined" ? window : (typeof globalThis!=="undefined" ? globalThis : null));
</script>
<script>
"use strict";
const PC = window.PinyinCore;
const $ = id => document.getElementById(id);
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a,n) => shuffle(a.slice()).slice(0,n);
const escapeHtml = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ===================== progress =====================
let prog = { v:2, w:{}, sets:{1:0,2:0,3:0,4:0}, lessons:{}, sessions:0, theme:null, showChars:false };
const store = {
  async load(){
    try{ if(window.storage){ const r = await window.storage.get("hsk_pinyin"); if(r) prog = Object.assign(prog, JSON.parse(r.value)); return; } }catch(e){}
    try{ const v = localStorage.getItem("hsk_pinyin"); if(v) prog = Object.assign(prog, JSON.parse(v)); }catch(e){}
  },
  async save(){
    const s = JSON.stringify(prog);
    try{ if(window.storage){ await window.storage.set("hsk_pinyin", s); return; } }catch(e){}
    try{ localStorage.setItem("hsk_pinyin", s); }catch(e){}
  }
};

function markWord(w, ok){
  const p = prog.w[w] || {r:0,w:0,s:0};
  if(ok){ p.r++; p.s++; } else { p.w++; p.s=0; }
  if(p.prov && (p.s>=3 || !ok)) delete p.prov;
  prog.w[w] = p; store.save();
}
const mastered = w => (prog.w[w]||{}).s >= 3;
const weakScore = w => { const p = prog.w[w]||{r:0,w:0,s:0}; return p.w*3 - p.s; };
function weakFirst(list, n){
  return list.slice().sort((a,b)=>(weakScore(b.w)-weakScore(a.w)) + (Math.random()-0.5)).slice(0,n);
}
function provPick(list, n){ return shuffle(list.filter(x=>(prog.w[x.w]||{}).prov && !mastered(x.w))).slice(0,n); }
// Characters are hidden unless the learner opted in (Progress / Words toggle). Every
// render site that shows a VOCAB word's `w` (character) field goes through this.
function charSpan(w, cls){ return prog.showChars ? `<span class="${cls}">${escapeHtml(w.w)}</span>` : ""; }

function levelList(lv){ return VOCAB.filter(v=>v.lv===lv); }
function nSets(lv){ return Math.ceil(levelList(lv).length/10); }
function learnedWords(){
  // Words from completed sets, plus any word explicitly flagged `d` (drilled ahead of
  // its set via the Words-tab pager). Only the `d` flag counts here — not just "has a
  // prog.w entry" — so that placement's retake re-baseline (which deletes `d`-flagged
  // and placement-only-provisional entries) actually shrinks the pool instead of every
  // leftover prog.w record resurrecting a word outside the freshly placed range.
  const out = [];
  [1,2,3,4].forEach(lv=>{ out.push(...levelList(lv).slice(0, (prog.sets[lv]||0)*10)); });
  const seen = new Set(out.map(w=>w.w));
  VOCAB.forEach(v=>{ if(!seen.has(v.w) && prog.w[v.w] && prog.w[v.w].d){ out.push(v); seen.add(v.w); } });
  return out;
}
// validateProgShape() and placementStopIndex() live in pinyin_core.js (PC.validateProgShape,
// PC.placementStopIndex) so the app and the node checks share one definition.
function nextNewSet(){
  for(const lv of [1,2,3,4]){ if((prog.sets[lv]||0) < nSets(lv)) return {lv, set: prog.sets[lv]||0}; }
  return null;
}

// ===================== speech =====================
const SS = window.speechSynthesis || null;
const hasSpeech = !!(SS && window.SpeechSynthesisUtterance);
let zhVoice = null, noticeShown = false;
if(hasSpeech){
  const pv = () => { const v = SS.getVoices(); zhVoice = v.find(x=>/^zh(-|_)?(CN|Hans)?/i.test(x.lang)) || v.find(x=>/zh/i.test(x.lang)) || null; };
  pv(); SS.onvoiceschanged = pv;
}
function say(t){
  if(!hasSpeech) return;
  try{ SS.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang="zh-CN"; if(zhVoice) u.voice=zhVoice; u.rate=0.85; SS.speak(u); }catch(e){}
}
// Like say(), but toggles a "speaking" class on the given button for the duration of
// the utterance, so the big speaker glyph on hear items can pulse while it talks.
function playWithPulse(t, btn){
  if(!hasSpeech) return;
  try{
    SS.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang="zh-CN"; if(zhVoice) u.voice=zhVoice; u.rate=0.85;
    if(btn){
      u.onstart = () => btn.classList.add("speaking");
      u.onend = () => btn.classList.remove("speaking");
      u.onerror = () => btn.classList.remove("speaking");
    }
    SS.speak(u);
  }catch(e){}
}
function speechNotice(){
  if(hasSpeech || noticeShown) return "";
  noticeShown = true;
  return `<div class="warn">This browser has no Chinese text-to-speech voice, so listening items show the word instead of playing audio.</div>`;
}

// ===================== tone contour glyph =====================
const CONTOUR = {
  1: `<svg class="contour" width="22" height="14" viewBox="0 0 22 14"><path d="M2 4 L20 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  2: `<svg class="contour" width="22" height="14" viewBox="0 0 22 14"><path d="M2 11 L20 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  3: `<svg class="contour" width="22" height="14" viewBox="0 0 22 14"><path d="M2 5 Q9 13 11 13 Q13 13 20 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  4: `<svg class="contour" width="22" height="14" viewBox="0 0 22 14"><path d="M2 2 L20 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  5: `<svg class="contour" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="2.4" fill="currentColor"/></svg>`
};
function contourFor(n){
  const tt = PC.syll(n).map(c=>+c.slice(-1)||5);
  const last = tt[tt.length-1] || 1;
  return `<span class="t${last}">${CONTOUR[last]}</span>`;
}

// ===================== generic drill runner =====================
// item: {kind:'mc'|'type', label, html, opts?, a?, reveal, onAnswer?, mount?, check?}
let D = null;
function drill(items, onDone, summary){ D = { q: shuffle(items.slice()), right:0, seen:0, miss:[], onDone, summary }; dnext(); }
function setScore(r,s,left){ $("score").textContent = s ? `${r} / ${s}` + (left!=null ? `  ·  ${left} left` : "") : ""; }
function announce(html){
  const el = $("live"); if(!el) return;
  const tmp = document.createElement("div"); tmp.innerHTML = html || "";
  el.textContent = tmp.textContent || "";
}
function showReveal(html){
  const rv = $("rv"); if(!rv) return;
  rv.innerHTML = html;
  rv.style.display = html ? "block" : "none";
  if(html){ rv.style.opacity = "0"; requestAnimationFrame(()=>{ rv.style.opacity = "1"; }); }
  announce(html);
}

function dnext(){
  if(!D) return;
  const P = $("panel");
  setScore(D.right, D.seen, D.q.length);
  if(!D.q.length){
    const { right, seen, miss, onDone, summary } = D;
    P.innerHTML = `<div class="done"><h2>${right} / ${seen}</h2>${summary ? summary(miss) : ""}<button class="next" id="ok">Continue</button></div>`;
    // Drill is finished: clear state now, before handing control back, so a stray
    // keystroke or the previous screen's stale handler can't act on an empty queue.
    D = null; drillKeyHandler = null;
    $("ok").onclick = onDone;
    return;
  }
  const it = D.q.shift();
  if(it.kind === "type"){ renderTypeItem(it); }
  else { renderMcItem(it); }
}

function renderMcItem(it){
  const P = $("panel");
  P.innerHTML = `<p class="q">${escapeHtml(it.label)}</p>${it.html||""}<div class="opts ${it.optsClass||""}" id="o"></div><div class="reveal" id="rv"></div><div class="actions"><button class="next" id="nx" style="display:none">Next</button></div>`;
  if(it.mount) it.mount();
  const opts = shuffle(it.opts.slice());
  const container = $("o");
  let answered = false;
  opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.innerHTML = `<b class="num">${i+1}</b>${escapeHtml(o)}`;
    b.onclick = () => {
      if(answered) return; answered = true;
      [...container.children].forEach(x=>{ x.disabled = true; if(x.dataset.v === it.a) x.classList.add("ok"); });
      const ok = o === it.a;
      if(!ok) b.classList.add("bad");
      D.seen++; if(ok) D.right++; else { D.miss.push(it); D.q.push(it); }
      if(it.onAnswer) it.onAnswer(ok);
      showReveal(it.reveal || "");
      $("nx").style.display = "block"; setScore(D.right, D.seen, D.q.length);
    };
    b.dataset.v = o;
    container.appendChild(b);
  });
  $("nx").onclick = dnext;
  drillKeyHandler = e => {
    if(!D) return;
    const nx = $("nx");
    if(e.key >= "1" && e.key <= String(opts.length) && !answered){ container.children[+e.key-1].click(); }
    else if(e.key === "Enter" && nx && nx.style.display !== "none"){ dnext(); }
    else if(e.key === "Escape"){ quitDrill(); }
  };
}

function renderTypeItem(it){
  const P = $("panel");
  P.innerHTML = `<p class="q">${escapeHtml(it.label)}</p>${it.html||""}
    <input type="text" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type pinyin…">
    <button class="next" id="submit">Check</button>
    <div class="reveal" id="rv"></div><div class="actions"><button class="next" id="nx" style="display:none">Next</button></div>`;
  if(it.mount) it.mount();
  const input = $("tin"); input.focus();
  let answered = false;
  function submit(){
    if(answered) return; if(!input.value.trim()) return;
    answered = true; input.disabled = true; $("submit").style.display = "none";
    const ok = it.check(input.value);
    D.seen++; if(ok) D.right++; else { D.miss.push(it); D.q.push(it); }
    if(it.onAnswer) it.onAnswer(ok);
    showReveal((ok ? "" : `<div class="diff">you typed: ${escapeHtml(input.value)}</div>`) + (it.reveal||""));
    $("nx").style.display = "block"; setScore(D.right, D.seen, D.q.length);
  }
  $("submit").onclick = submit;
  $("nx").onclick = dnext;
  drillKeyHandler = e => {
    if(!D) return;
    if(e.key === "Enter"){ answered ? dnext() : submit(); }
    else if(e.key === "Escape"){
      // Escape while the input is focused blurs it first; a second Escape then quits.
      // This stops a learner mid-word-typing from losing the whole drill on one stray key.
      if(document.activeElement === input){ input.blur(); return; }
      quitDrill();
    }
  };
}

let drillKeyHandler = null;
document.addEventListener("keydown", e => { if(drillKeyHandler) drillKeyHandler(e); });
function quitDrill(){ D = null; drillKeyHandler = null; render(); }

// ===================== vocab drill item builders (meaning-centred) =====================
// Reveal block shared by hear/read/recall: tone-coloured pinyin + meaning, characters
// only when the learner has opted in — never the only cue even when shown.
function revealBlock(entry){
  const chars = prog.showChars ? `<div style="font-family:var(--zh);font-size:20px;margin-top:2px">${escapeHtml(entry.w)}</div>` : "";
  return `<div class="py">${PC.pyHTML(entry.n)}</div><div style="color:var(--mute)">${escapeHtml(PC.gloss(entry))}</div>${chars}`;
}
// hear — TTS plays the word; pick the meaning. No text stimulus (falls back to pinyin,
// never characters, if this browser has no zh voice).
function hearItem(entry){
  const ds = PC.meaningOpts(entry, VOCAB);
  const opts = [PC.gloss(entry), ...ds.map(d=>PC.gloss(d))];
  const rv = `<div class="q">You heard:</div>${revealBlock(entry)}`;
  return { kind:"mc", label:"What does it mean?", optsClass:"opts-hero",
    html: speechNotice() + (hasSpeech
      ? `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`
      : `<div class="big">${PC.pyHTML(entry.n)}</div>`),
    opts, a: PC.gloss(entry), reveal: rv, onAnswer: ok=>markWord(entry.w, ok),
    mount: () => { if(hasSpeech){ const btn = $("sp"); playWithPulse(entry.w, btn); btn.onclick = ()=>playWithPulse(entry.w, btn); } } };
}
// read — pinyin shown (tone-coloured); pick the meaning. Audio auto-plays.
function readItem(entry){
  const ds = PC.meaningOpts(entry, VOCAB);
  const opts = [PC.gloss(entry), ...ds.map(d=>PC.gloss(d))];
  const rv = revealBlock(entry);
  return { kind:"mc", label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="big">${PC.pyHTML(entry.n)}</div>`,
    opts, a: PC.gloss(entry), reveal: rv, onAnswer: ok=>markWord(entry.w, ok),
    mount: () => { if(hasSpeech) say(entry.w); } };
}
// recall — meaning shown; pick the pinyin. Distractors are other real words with the
// same syllable count (not phonetic near-misses — those confuse rather than teach meaning).
function recallItem(entry){
  const ds = PC.pinyinOpts(entry, VOCAB);
  const opts = [PC.mark(entry.n), ...ds.map(d=>PC.mark(d.n))];
  const rv = revealBlock(entry);
  return { kind:"mc", label:"Which word is this?", optsClass:"opts-hero",
    html: `<div class="med" style="text-align:center">${escapeHtml(PC.gloss(entry))}</div>`,
    opts, a: PC.mark(entry.n), reveal: rv, onAnswer: ok=>markWord(entry.w, ok) };
}

// ===================== Extras-only pronunciation items (tone pattern / typed pinyin) =====================
// Retired from Today/Review/Placement/Listen/Recall in v2; kept only for Test > Extras.
// Never show characters when showChars is off — fall back to audio + toneless pinyin
// (already the "en" line) instead of the character stimulus.
function toneItem(entry){
  const chunks = PC.syll(entry.n);
  const answer = PC.tones(entry.n);
  const toneless = chunks.map(c=>c.slice(0,-1)).join(" ");
  const opts = new Set([answer]);
  let guard = 0;
  while(opts.size < 4 && guard++ < 40){
    const cand = chunks.map(c => Math.random()<0.6 ? (c.slice(0,-1)+ (1+Math.floor(Math.random()*5))) : c);
    opts.add(cand.map(c=>c.slice(-1)).join("-"));
  }
  const rv = `<div class="py">${PC.pyHTML(entry.n)} ${contourFor(entry.n)}</div><div style="color:var(--mute)">${escapeHtml(entry.en)}</div>`;
  const stimulus = prog.showChars ? `<div class="big" style="font-family:var(--zh)">${escapeHtml(entry.w)}</div>` : "";
  return { kind:"mc", label:"Which tone pattern?",
    html: stimulus + `<div class="en">${escapeHtml(toneless)}</div>` + (!prog.showChars && hasSpeech ? `<div class="listen-stage"><button class="replay" id="rpTone" aria-label="Replay">▶</button></div>` : ""),
    mount: () => { if(!prog.showChars && hasSpeech){ say(entry.w); $("rpTone").onclick = ()=>say(entry.w); } },
    opts:[...opts], a: answer, reveal: rv, onAnswer: ok=>markWord(entry.w, ok) };
}
function typeItem(entry){
  const rv = `<div class="py">${PC.pyHTML(entry.n)} ${contourFor(entry.n)}</div>`;
  const stimulus = prog.showChars
    ? `<div class="big" style="font-family:var(--zh)">${escapeHtml(entry.w)}</div><div class="en">${escapeHtml(entry.en)}</div>`
    : `<div class="med" style="text-align:center">${escapeHtml(entry.en)}</div>`;
  return { kind:"type", label:"Type the pinyin (numbers or tone marks)",
    html: stimulus + (hasSpeech ? `<div class="listen-stage"><button class="replay" id="rp2" aria-label="Replay">▶</button></div>` : ""),
    mount: () => { if(hasSpeech) $("rp2").onclick = ()=>say(entry.w); },
    check: val => PC.acceptTypeAnswer(val, entry), reveal: rv, onAnswer: ok=>markWord(entry.w, ok) };
}
function missSummary(miss){
  const u = [...new Map(miss.map(m=>[m.reveal, m])).values()];
  return u.length ? `<p class="q">Missed:</p>${u.map(m=>`<div class="stmt">${m.reveal}</div>`).join("")}` : "<p class='q'>Clean.</p>";
}

// Sounds is optional content, not part of the learning path — the strip is just the
// four vocab levels now.
function pathStrip(){
  const stages = [1,2,3,4].map(lv=>({ label:"HSK"+lv, frac: (prog.sets[lv]||0)/nSets(lv) }));
  return `<div class="path">${stages.map(s=>`<div class="seg"><div class="bar"><i style="width:${Math.round(s.frac*100)}%"></i></div>${s.label}</div>`).join("")}</div>`;
}
let todayStepState = null;
function todayRender(){
  setScore(0,0);
  const P = $("panel"); const lw = learnedWords(); const nn = nextNewSet();
  const n = (prog.sessions||0) + 1;
  const steps = [
    ["Review", lw.length ? "15 items, weakest first" : "nothing learned yet — skipped"],
    ["Learn", nn ? `HSK ${nn.lv}, set ${nn.set+1}` : "everything covered"],
    ["Listen", lw.length ? "12 items" : "skipped until something is learned"],
    ["Recall", lw.length ? "8 items" : "skipped until something is learned"]
  ];
  const showSoundsHint = !Object.keys(prog.lessons).length && !prog.dismissedSoundsHint;
  P.innerHTML = `${pathStrip()}
    ${!lw.length ? `<div class="stmt">New here? Take the Placement test in the Test tab so today starts where your knowledge ends.</div>` : ""}
    ${showSoundsHint ? `<div class="stmt" id="soundsHint">New to pinyin? The Sounds tab explains how to read it. <button class="ghost" id="dismissHint" style="margin-top:8px">Got it</button></div>` : ""}
    <p class="q">Session ${n}, about 15 minutes.<br>${lw.length} words learned so far.</p>
    <table class="stats">${steps.map((s,i)=>`<tr><td>${i+1}. ${s[0]}</td><td>${s[1]}</td></tr>`).join("")}</table>
    <div class="actions"><button class="next" id="go">Start today</button></div>`;
  if(showSoundsHint) $("dismissHint").onclick = () => { prog.dismissedSoundsHint = true; store.save(); todayRender(); };
  $("go").onclick = () => { todayStepState = { step:0 }; todayStep(); };
}
function todayStep(){
  const lw = learnedWords(); const nn = nextNewSet();
  const s = todayStepState.step++;
  if(s === 0){ // Review: 15 weakest/provisional, mixed hear/read/recall ~50/25/25
    if(lw.length >= 5){
      const pv = provPick(lw, 5);
      const rest = weakFirst(lw.filter(x=>!pv.includes(x)), 15-pv.length);
      const pool = [...rest, ...pv];
      const items = shuffle(pool.map(w => { const r = Math.random(); return r<0.5?hearItem(w):r<0.75?readItem(w):recallItem(w); }));
      drill(items, todayStep, missSummary); return;
    }
    return todayStep();
  }
  if(s === 1){ // Learn: teach the next set of 10, then drill 10x hear + 10x read
    if(nn){
      const list = levelList(nn.lv).slice(nn.set*10, nn.set*10+10);
      vocabTeach(list, nn.lv, () => {
        const items = [];
        list.forEach(w => items.push(hearItem(w), readItem(w)));
        drill(shuffle(items), () => { prog.sets[nn.lv] = nn.set+1; store.save(); todayStep(); }, missSummary);
      });
      return;
    }
    return todayStep();
  }
  if(s === 2){ // Listen: 12 hear items from learned words
    if(lw.length >= 4){ drill(weakFirst(lw,12).map(w=>hearItem(w)), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 3){ // Recall: 8 recall items from learned words
    if(lw.length >= 4){ drill(weakFirst(lw,8).map(w=>recallItem(w)), todayFinish, missSummary); return; }
    return todayFinish();
  }
  todayFinish();
}
function todayFinish(){
  D = null; drillKeyHandler = null; setScore(0,0);
  prog.sessions = (prog.sessions||0) + 1; store.save();
  const P = $("panel");
  P.innerHTML = `<div class="done"><h2>Session done</h2><p class="q">${learnedWords().length} words learned so far.</p><button class="next" id="again">Back to Today</button></div>`;
  $("again").onclick = todayRender;
}
function vocabTeach(list, lv, onDrill){
  setScore(0,0);
  const P = $("panel");
  P.innerHTML = `<p class="q">HSK ${lv}, new set. Tap a word to hear it.</p>
    <div id="tl"></div><div class="actions"><button class="next" id="dr">Drill this set</button></div>`;
  const tl = $("tl");
  list.forEach(w => {
    const row = document.createElement("div"); row.className = "rowset";
    row.innerHTML = `${charSpan(w,"zh")}<span class="py">${PC.pyHTML(w.n)}</span><span class="en">${escapeHtml(w.en)}</span><span style="color:var(--mute);flex:0 0 auto">▶</span>`;
    row.onclick = () => say(w.w);
    row.style.cursor = "pointer";
    tl.appendChild(row);
  });
  $("dr").onclick = onDrill;
}
// onBack is optional: when given, lessonTeach renders its own back button (as part
// of the same innerHTML write) instead of the caller pre-rendering one, since any
// renderer that overwrites #panel after another element wired its handler destroys
// that element and $(id).onclick throws on the now-null lookup.
function lessonTeach(lesson, onDone, onBack){

    const el = document.createElement("div"); el.className = "card-teach";
    el.innerHTML = `<h3>${escapeHtml(c.h)}</h3><p>${c.body}</p>
      ${c.rows ? `<div>${c.rows.map(r=>`<div class="rowset"><span class="py">${escapeHtml(r[0])}</span><span class="zh">${escapeHtml(r[1])}</span><span class="en">${escapeHtml(r[2])}</span></div>`).join("")}</div>` : ""}
      ${c.say ? `<div class="taplist">${c.say.map((s,i)=>`<button data-s="${i}">▶ ${escapeHtml(s)}</button>`).join("")}</div>` : ""}`;
    if(c.say) el.querySelectorAll("[data-s]").forEach((b,i)=>b.onclick=()=>say(c.say[i]));
    cw.appendChild(el);
  });
  $("dr").onclick = () => drill(shuffle(lesson.items.map(lessonItem)), onDone, missSummary);

let wordsLv = 1, wordsSet = null, wordsQuery = "";
// The shell (search box + characters toggle) is rendered once per tab visit; typing in
// the search box only re-renders #wbody, so the input never loses focus/cursor mid-type.
function wordsRender(){
  setScore(0,0);
  const P = $("panel");
  P.innerHTML = `<div class="row">
      <input type="text" id="wsearch" autocomplete="off" placeholder="Search pinyin or meaning…" style="flex:1;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-family:var(--font);font-size:15px" value="${escapeHtml(wordsQuery)}">
      <button class="chip ${prog.showChars?'on':''}" id="wChars" aria-label="Toggle characters">字</button>
    </div>
    <div id="wbody"></div>`;
  $("wChars").onclick = () => {
    prog.showChars = !prog.showChars; store.save();
    // Only #wbody gets re-rendered here (search input must keep focus), so the chip's
    // own "on" state — outside #wbody — has to be toggled directly, not re-derived
    // from a fresh wordsRender().
    $("wChars").classList.toggle("on", prog.showChars);
    renderWordBody();
  };
  const search = $("wsearch");
  search.oninput = () => { wordsQuery = search.value; renderWordBody(); };
  renderWordBody();
}
function renderWordBody(){
  const body = $("wbody");
  const q = wordsQuery.trim().toLowerCase();
  if(q){
    const matches = VOCAB.filter(v => v.en.toLowerCase().includes(q) || PC.strip(v.py).toLowerCase().includes(q) || v.py.toLowerCase().includes(q));
    if(!matches.length){ body.innerHTML = `<p class="q">No matches.</p>`; return; }
    body.innerHTML = `<div id="wl"></div>`;
    const wl = $("wl");
    matches.slice(0,150).forEach(w => {
      const row = document.createElement("div"); row.className = "wl"; row.style.cursor = "pointer";
      row.innerHTML = `${charSpan(w,"zh")}<span class="info"><span class="py">${PC.pyHTML(w.n)}</span><span class="en">${escapeHtml(w.en)}</span></span>`;
      row.onclick = () => say(w.w);
      wl.appendChild(row);
    });
    return;
  }
  const list = levelList(wordsLv); const total = nSets(wordsLv); const done = prog.sets[wordsLv]||0;
  if(wordsSet == null) wordsSet = Math.min(done, total-1);
  const set = list.slice(wordsSet*10, wordsSet*10+10);
  body.innerHTML = `<div class="row">${[1,2,3,4].map(lv=>`<button data-l="${lv}" class="${lv===wordsLv?'on':''}">HSK ${lv}</button>`).join("")}</div>
    <div class="row"><button id="pv">‹</button><button class="on">Set ${wordsSet+1} / ${total}${wordsSet<done?' ✓':''}</button><button id="nx">›</button><button id="jump">next new</button><button id="rev">review</button></div>
    <div id="wl"></div><div class="actions"><button class="next" id="dr">Drill this set</button></div>`;
  body.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ wordsLv=+b.dataset.l; wordsSet=null; renderWordBody(); });
  $("pv").onclick = () => { wordsSet = Math.max(0, wordsSet-1); renderWordBody(); };
  $("nx").onclick = () => { wordsSet = Math.min(total-1, wordsSet+1); renderWordBody(); };
  $("jump").onclick = () => { wordsSet = Math.min(done, total-1); renderWordBody(); };
  const wl = $("wl");
  set.forEach(w => {
    const row = document.createElement("div"); row.className = "wl"; row.style.cursor = "pointer";
    row.innerHTML = `${charSpan(w,"zh")}<span class="info"><span class="py">${PC.pyHTML(w.n)}</span><span class="en">${escapeHtml(w.en)}</span></span>`;
    row.onclick = () => say(w.w);
    wl.appendChild(row);
  });
  $("dr").onclick = () => {
    const items = []; set.forEach(w => items.push(hearItem(w), readItem(w)));
    // Only advance the level's set pointer when this was exactly the next unlearned
    // set — drilling a set further ahead must not silently mark every skipped set
    // as learned. Otherwise stamp these specific words with the `d` (drilled-ahead)
    // flag so learnedWords() counts just them, not the whole set range.
    // The drill runner replaces the whole #panel, so its callback rebuilds the full
    // Words shell (wordsRender), not just #wbody.
    drill(shuffle(items), () => {
      if(wordsSet === (prog.sets[wordsLv]||0)){ prog.sets[wordsLv] = wordsSet+1; }
      else { set.forEach(w => { if(!prog.w[w.w]) prog.w[w.w] = {r:0,w:0,s:0}; prog.w[w.w].d = 1; }); }
      store.save(); wordsRender();
    }, missSummary);
  };
  $("rev").onclick = () => {
    const lw = learnedWords(); if(lw.length < 5){ alert("Finish a set first."); return; }
    drill(weakFirst(lw, 15).map(w=>{ const r = Math.random(); return r<0.5?hearItem(w):r<0.75?readItem(w):recallItem(w); }), wordsRender, missSummary);
  };
}

// strata() lives in pinyin_core.js (PC.strata) so the app and the node checks share one
// definition. v2 drops the foundations block entirely — placement is 40 vocab-only
// hear/read items, since it's meaning that decides where a learner starts, not sounds.
function placeRender(){
  D = null; drillKeyHandler = null; setScore(0,0);
  const P = $("panel"); const lw = learnedWords();
  P.innerHTML = `<div class="row"><button id="back">‹ test</button></div>
    <p class="q">40 words across HSK 1–4: hear or read the word, pick the meaning. No feedback until the end. Places you inside a level; skipped words stay in review as provisional.</p>
    ${lw.length ? `<p class="q">Current: ${lw.length} words learned. Retaking resets set position and clears any provisional or drilled-ahead words that haven't stuck yet.</p>` : ""}
    <div class="actions"><button class="next" id="go">Start placement</button></div>`;
  $("back").onclick = () => { testSel = null; testRender(); };
  $("go").onclick = () => {
    const st = PC.strata(VOCAB);
    const bucketItems = [];
    st.forEach((b,bi) => { const k = bi%2===0 ? 2 : 3; pick(b.words, k).forEach(w=>bucketItems.push({b:bi, w})); });
    PL = { vocab:{items:shuffle(bucketItems), i:0}, st, res: st.map(()=>({r:0,n:0})) };
    placeVocabNext();
  };
}
function placeVocabNext(){
  const P = $("panel"); const V = PL.vocab;
  if(V.i >= V.items.length){ placeResult(); return; }
  const it = V.items[V.i++]; const w = it.w; setScore(V.i, V.items.length);
  const ds = PC.meaningOpts(w, VOCAB);
  const opts = shuffle([w.en, ...ds.map(d=>d.en)]);
  const asHear = hasSpeech && Math.random() < 0.5;
  P.innerHTML = `<p class="q">Words ${V.i} / ${V.items.length}</p>
    ${asHear ? `<div class="hear-stage"><button class="speaker" id="rp" aria-label="Replay">🔊</button></div>` : `<div class="big">${PC.pyHTML(w.n)}</div>`}
    <div class="opts" id="o"></div>`;
  if(asHear){ const btn = $("rp"); playWithPulse(w.w, btn); btn.onclick = ()=>playWithPulse(w.w, btn); }
  opts.forEach(o => {
    const b = document.createElement("button"); b.textContent = o;
    b.onclick = () => { PL.res[it.b].n++; if(o===w.en) PL.res[it.b].r++; placeVocabNext(); };
    $("o").appendChild(b);
  });
}
function placeResult(){
  setScore(0,0);
  const st = PL.st; const rows = [];
  // Pass rule lives in pinyin_core.js (PC.placementStopIndex): a rolling window of up
  // to 3 buckets must hit >=75% accuracy AND the current bucket needs at least 1 right,
  // since a raw per-bucket cutoff at 2-3 items makes a single lucky/unlucky guess decide
  // the whole bucket.
  const stop = PC.placementStopIndex(PL.res);
  st.forEach((b,i)=>{ const r = PL.res[i]; rows.push([b, r, r.n ? r.r/r.n : 1]); });
  const passed = stop==null ? st.length : stop;
  // Retaking placement re-baselines the review pool: drop anything that was only ever
  // a placement guess that never actually stuck (provisional with no real streak yet)
  // or was drilled ahead of its set from the Words tab (the `d` flag) — otherwise those
  // leftover prog.w entries would resurrect words outside the freshly placed range via
  // learnedWords()'s union, defeating the point of retaking.
  Object.keys(prog.w).forEach(k => {
    const p = prog.w[k];
    if((p.prov && p.s <= 1) || p.d) delete prog.w[k];
  });
  prog.sets = {1:0,2:0,3:0,4:0};
  for(let i=0;i<passed;i++){ const b = st[i]; prog.sets[b.lv] = Math.max(prog.sets[b.lv], b.s1); }
  learnedWords().forEach(w => { if(!prog.w[w.w]) prog.w[w.w] = {r:1,w:0,s:1,prov:1}; });
  store.save();
  const pos = stop==null ? "everything covered — go straight to Words and pick a set" : `HSK ${st[passed].lv}, set ${st[passed].s0+1}`;
  const P = $("panel");
  P.innerHTML = `<div class="done"><h2>Start at ${pos}</h2>
    <table class="stats">${rows.map(([b,r,acc],i)=>`<tr><td>HSK ${b.lv} sets ${b.s0+1}–${b.s1}</td><td style="color:${i<passed?'var(--ok)':'var(--bad)'}">${r.r}/${r.n}</td></tr>`).join("")}</table>
    <p class="q">${learnedWords().length} words freshly marked provisional and kept in review.</p>
    <button class="next" id="ok">Go to Today</button></div>`;
  $("ok").onclick = () => { document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on", x.dataset.t==="today")); tab="today"; testSel=null; render(); };
}

  const P = $("panel");
  const lwAll = learnedWords();
  const rows = [1,2,3,4].map(lv => {
    const list = levelList(lv); const learnedList = lwAll.filter(w=>w.lv===lv);
    const masteredN = learnedList.filter(w=>mastered(w.w)).length;
    return `<tr><td>HSK ${lv}</td><td>${learnedList.length} / ${list.length} learned · ${masteredN} mastered</td></tr>`;
  }).join("");
  const weak = weakFirst(lwAll.filter(w=>weakScore(w.w)>0), 10);
  P.innerHTML = `${hasSpeech ? "" : `<div class="warn">No Chinese text-to-speech voice is available in this browser, so listening and audio-replay features show the word instead of playing sound.</div>`}
    <table class="stats">${rows}
      <tr><td>Sounds</td><td>${Object.keys(prog.lessons).length} / ${LESSONS.length} lessons done</td></tr>
      <tr><td>Sessions</td><td>${prog.sessions||0}</td></tr></table>
    <div class="row" style="margin-top:14px"><button class="chip ${prog.showChars?'on':''}" id="toggleChars">Show characters</button></div>
    <p class="q" style="margin-top:14px">${weak.length ? "Weakest words" : "No weak words yet — nice."}</p>
    ${weak.map(w=>`<div class="rowset">${charSpan(w,"zh")}<span class="py">${PC.pyHTML(w.n)}</span><span class="en">${escapeHtml(w.en)}</span></div>`).join("")}
    <div class="row" style="margin-top:16px">
      <button class="ghost" id="exp" style="flex:1">Export progress</button>
      <button class="ghost" id="imp" style="flex:1">Import progress</button>
    </div>
    <div id="impbox" style="display:none;margin-top:10px">
      <textarea id="imptxt" placeholder="Paste exported JSON here"></textarea>
      <input type="file" id="impfile" accept="application/json" style="margin-top:8px">
      <button class="next" id="doimport">Load</button>
    </div>
    <button class="ghost" id="reset" style="margin-top:16px;color:var(--bad);border-color:var(--bad)">Reset all progress</button>`;
  $("toggleChars").onclick = () => { prog.showChars = !prog.showChars; store.save(); progressRender(); };
  $("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(prog, null, 1)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "hsk_pinyin_progress.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  $("imp").onclick = () => { $("impbox").style.display = $("impbox").style.display==="none" ? "block" : "none"; };
  $("impfile").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { $("imptxt").value = r.result; }; r.readAsText(f); };
  $("doimport").onclick = () => {
    // Validation runs inside the try so a throw from a malformed-but-JSON-parseable
    // shape becomes a rejection message too, instead of an uncaught error and a
    // silent no-op.
    try{
      const data = JSON.parse($("imptxt").value);
      const v = PC.validateProgShape(data);
      if(!v.ok){ alert("That doesn't look like valid exported progress: " + v.reason); return; }
      const prevTheme = prog.theme, prevShowChars = prog.showChars;
      // Both v1 and v2 exports pass validateProgShape; PC.migrateProg (shared with the
      // boot-time migration below) forces v:2 and defaults showChars false.
      prog = PC.migrateProg(v.data);
      if(prog.theme === undefined) prog.theme = prevTheme; // imported progress with no theme keeps the current one
      if(v.data.showChars === undefined) prog.showChars = prevShowChars; // same for showChars
      store.save(); applyTheme(); progressRender();
    }catch(e){
      alert("That doesn't look like valid exported progress: " + (e && e.message ? e.message : "could not be read"));
    }
  };
  $("reset").onclick = () => {
    if(!confirm("Reset all progress? This can't be undone.")) return;
    prog = { v:2, w:{}, sets:{1:0,2:0,3:0,4:0}, lessons:{}, sessions:0, theme:prog.theme, showChars:prog.showChars };
    store.save(); progressRender();
  };
}

// ===================== theme =====================
function applyTheme(){ document.documentElement.setAttribute("data-theme", prog.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); }
$("themebtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  prog.theme = cur === "dark" ? "light" : "dark";
  applyTheme(); store.save();
};

// ===================== boot =====================
(async function(){
  await store.load();
  // Migration v1 -> v2: PC.migrateProg (shared with the import handler above) bumps a
  // stored v1 progress object to v:2 and defaults the new showChars field; only persist
  // if migration actually changed something, to avoid a needless write on every boot.
  if(prog.v !== 2 || prog.showChars === undefined){ prog = PC.migrateProg(prog); store.save(); }
  applyTheme();
  render();
})();
</script>
</body>
</html>
