<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK pinyin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0ED;--ink:#1B2321;--mute:#5C6B67;--line:#D6DAD7;--card:#FFFFFF;
    --ok:#2F7A5B;--ok-bg:#E4F1EB;--bad:#B4483F;--bad-bg:#FBEAE8;
    --t1:#3B6E99;--t2:#3E8B5C;--t3:#9C6B2E;--t4:#B33F3F;--t5:#8A8378;
    --font: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --zh: "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
      --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
      --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
    --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
    --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
  body{padding-bottom:calc(64px + var(--safe-b))}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 24px;min-height:calc(100dvh - 64px - var(--safe-b));display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex:0 0 auto}
  h1{font-size:18px;font-weight:600;margin:0}
  .score{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* Thin progress bar under the header, replacing the "n / seen" accuracy numbers
     during a drill — width tracks answered/total; empty (width 0, transparent
     track) outside a drill. */
  .hdrbar{height:3px;border-radius:2px;background:transparent;margin-bottom:12px;flex:0 0 auto;overflow:hidden}
  .hdrbar i{display:block;height:100%;width:0;background:var(--ink);transition:width 0.2s ease}
  @media (prefers-reduced-motion: reduce){ .hdrbar i{transition:none} }
  .themebtn{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:16px;color:var(--ink);flex:0 0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;flex:1 1 auto;display:flex;flex-direction:column}
  #panel > .done{display:flex;flex-direction:column;flex:1 1 auto}
  .next:last-child, .primary:last-child, .done .next{margin-top:auto}
  /* Explicit pin for screens where the trailing action isn't reliably the DOM
     last-child (e.g. a hidden-until-answered Next button, or a landing screen
     whose action is a button plus a row of secondary options after it). */
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  /* Wraps the prompt+stimulus+options+reveal of a drill item (and Today's plan
     block): grows to fill whatever vertical space .actions' pinned button doesn't
     need, then centers its own content in that space, so a 4-option item sits in
     the middle of the card on a tall phone screen instead of hugging the top. On
     desktop (see the 900px query) .wrap no longer forces the card to fill the
     viewport, so there's no extra space here to center into and this is a no-op. */
  .drill-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .q{color:var(--mute);font-size:15px;margin:0 0 10px}
  /* v2's .big/.med stimuli are pinyin or English, not characters — the Chinese font
     only belongs on elements that actually render a word's `w` field (see charSpan()
     and its "zh" class rules below). */
  .big{font-size:52px;line-height:1.3;text-align:center;margin:6px 0 16px;font-weight:500}
  .med{font-size:22px;line-height:1.5;margin:2px 0 14px}
  .en{color:var(--mute);font-size:15px;text-align:center;margin-top:-8px;margin-bottom:14px}
  .opts{display:grid;gap:8px}
  .opts button{width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:17px;color:var(--ink);line-height:1.35;min-height:48px;font-family:var(--font)}
  .opts button b.num{color:var(--mute);font-weight:500;margin-right:8px;font-size:14px}
  .opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  /* Drill hero: the meaning choices are the main event on every meaning-centred item
     (hear/read/recall), so they get more room and weight than a plain option list. */
  .opts-hero button{font-size:18px;padding:18px 18px;min-height:58px;font-weight:500}
  .hear-stage{display:flex;justify-content:center;margin:14px 0 22px}
  .speaker{width:92px;height:92px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:36px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  @keyframes speakerPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .speaker.speaking{animation:speakerPulse 0.9s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .speaker.speaking{animation:none} }
  .reveal{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:none;font-size:15px}
  .reveal .py{font-size:20px;margin-bottom:4px}
  .next,.primary{margin-top:14px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;min-height:48px;font-family:var(--font)}
  .ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;min-height:44px;font-family:var(--font)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .row button, .chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;color:var(--ink);min-height:44px;font-family:var(--font)}
  .row button.on, .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .replay{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:17px;color:var(--ink);flex:0 0 auto}
  .listen-stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0}
  .contour{display:inline-block}
  /* Phase 3 characters: large character stimulus, character option tiles, the
     Characters-step teach cards, and mixed-script sentence tokens (ruby / bare). */
  .zhbig{font-family:var(--zh);font-size:64px;line-height:1.25;text-align:center;margin:6px 0 16px;font-weight:500}
  .opts-zh button{font-family:var(--zh);font-size:28px;text-align:center;font-weight:500}
  .opts-zh button b.num{font-family:var(--font)}
  .charteach{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .charteach .zh{font-family:var(--zh);font-size:40px;line-height:1.2;flex:0 0 auto;min-width:56px;text-align:center}
  .charteach .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .charteach .en{color:var(--mute);font-size:14px}
  ruby.mx{font-family:var(--zh);ruby-position:over}
  ruby.mx rt{font-family:var(--font);font-size:0.55em;line-height:1}
  .mxzh{font-family:var(--zh)}
  .t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t5{color:var(--t5)}
  input[type=text]{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;font-size:19px;background:var(--card);color:var(--ink);font-family:var(--font)}
  input[type=text]:focus{outline:3px solid #7AA7D9;outline-offset:1px}
  .diff{font-size:15px;margin-top:6px}
  .diff span{display:inline-block;margin-right:6px;padding:2px 6px;border-radius:6px}
  .diff .hit{background:var(--ok-bg);color:var(--ok)}
  .diff .miss{background:var(--bad-bg);color:var(--bad)}
  .wl{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:flex-start;gap:12px}
  .wl .zh{font-size:24px;font-family:var(--zh);flex:0 0 auto;width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wl .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .wl .py{font-size:17px;display:block}
  .wl .en{color:var(--mute);font-size:14px;text-align:left;display:block;margin:0}
  table.stats{width:100%;border-collapse:collapse;font-size:15px}
  table.stats td{padding:8px 0;border-bottom:1px solid var(--line)}
  table.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--ink)}
  .path{display:flex;gap:6px;align-items:center;margin-bottom:14px}
  .path .seg{flex:1;text-align:center;font-size:11px;color:var(--mute)}
  .stmt{font-size:15px;line-height:1.5;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .warn{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .done h2{font-size:22px;margin:0 0 10px;font-weight:600}
  .done ul{padding-left:20px;font-size:15px;margin:8px 0}
  .card-teach{margin-bottom:14px}
  .card-teach h3{font-size:17px;margin:0 0 8px;font-weight:600}
  .card-teach p{font-size:15px;color:var(--mute);margin:0 0 10px}
  .rowset{display:flex;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
  .rowset.ex{flex-wrap:wrap}
  .rowset .zh{font-family:var(--zh);font-size:18px;flex:0 0 auto;width:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowset .py{flex:0 1 auto;min-width:0}
  .rowset .en{color:var(--mute);font-size:14px;text-align:right;flex:1 1 0;min-width:0;overflow-wrap:anywhere;margin:0}
  .taplist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .taplist button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:15px;min-height:48px}
  .plist button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;font-size:16px;color:var(--ink);min-height:48px;align-items:center}
  .plist .tick{color:var(--ok);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--card);color:var(--ink);font-family:var(--font)}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:5}
  .tabs button{flex:1;background:transparent;border:none;padding:10px 4px 8px;font-size:12px;color:var(--mute);min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font)}
  .tabs button .ic{font-size:20px;line-height:1}
  .tabs button.on{color:var(--ink);font-weight:600}
  button{cursor:pointer}
  button:focus-visible, .opts button:focus-visible, [tabindex]:focus-visible{outline:3px solid #7AA7D9;outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .reveal{transition:opacity 0.15s ease}
  @media (prefers-reduced-motion: reduce){ .reveal{transition:none} }
  /* Desktop: keep the same phone-shaped column but stop the tab bar and empty
     grey margins from spanning the whole viewport — center a wider column and
     constrain the tab bar to it, so the app reads as a real desktop layout
     rather than a stretched phone screen. Phone layout above is unchanged. */
  @media (min-width: 900px){
    /* Drop the viewport-height fill: on a wide screen the card should size to its
       content, not stretch to fill the window (that's what left the dead space
       below a short drill item or the Today plan block). */
    .wrap{max-width:640px;min-height:0}
    /* The tab bar no longer pins to the viewport bottom on desktop: a short card
       (a one-line Today plan, a single drill item) left 280–550px of bare
       background between the card and a fixed-position bar. Instead, flow it
       into the column right under the card, same width, so the page's height is
       just its content's height. Phone keeps the fixed bottom bar (nothing here
       touches the base .tabs rule). */
    body{padding-bottom:24px}
    .tabs{position:static;left:auto;right:auto;bottom:auto;transform:none;width:640px;max-width:100vw;margin:12px auto 0;padding-bottom:0;border:1px solid var(--line);border-radius:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="htitle">HSK pinyin</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="score" id="score"></span>
      <button class="themebtn" id="themebtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <div class="hdrbar" id="hdrbar"><i id="hdrbarfill"></i></div>
  <div id="panel" class="card"></div>
  <div id="live" aria-live="polite" class="sr-only"></div>
</div>
<nav class="tabs" id="tabs">
  <button data-t="today" class="on"><span class="ic">◷</span>Today</button>
  <button data-t="words"><span class="ic">字</span>Words</button>
  <button data-t="sounds"><span class="ic">〜</span>Sounds</button>
  <button data-t="test"><span class="ic">✓</span>Test</button>
  <button data-t="progress"><span class="ic">◔</span>Progress</button>
</nav>

<!-- dev-only data includes; build.sh inlines these into hsk_pinyin.html -->
<script src="../data/hsk_vocab.js"></script>
<script src="../data/pinyin_lessons.js"></script>
<script src="../data/hsk_sentences.js"></script>
<script src="pinyin_core.js"></script>
<script>
"use strict";
const PC = window.PinyinCore;
const $ = id => document.getElementById(id);
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a,n) => shuffle(a.slice()).slice(0,n);
const escapeHtml = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// ===================== progress =====================
// c (character progress) and mixChars (Phase 3) are deliberately absent here: the
// boot-time migration below seeds them via PC.migrateProg, the one shared place that
// knows the defaults, for fresh and stored progress alike.
let prog = { v:2, w:{}, s:{}, sets:{1:0,2:0,3:0,4:0}, lessons:{}, sessions:0, theme:null, showChars:false };
const store = {
  async load(){
    try{ if(window.storage){ const r = await window.storage.get("hsk_pinyin"); if(r) prog = Object.assign(prog, JSON.parse(r.value)); return; } }catch(e){}
    try{ const v = localStorage.getItem("hsk_pinyin"); if(v) prog = Object.assign(prog, JSON.parse(v)); }catch(e){}
  },
  async save(){
    const s = JSON.stringify(prog);
    try{ if(window.storage){ await window.storage.set("hsk_pinyin", s); return; } }catch(e){}
    try{ localStorage.setItem("hsk_pinyin", s); }catch(e){}
  }
};

function markWord(w, ok){
  const p = prog.w[w] || {r:0,w:0,s:0};
  if(ok){ p.r++; p.s++; } else { p.w++; p.s=0; }
  if(p.prov && (p.s>=3 || !ok)) delete p.prov;
  prog.w[w] = p; store.save();
}
const mastered = w => (prog.w[w]||{}).s >= 3;
const weakScore = w => { const p = prog.w[w]||{r:0,w:0,s:0}; return p.w*3 - p.s; };
function weakFirst(list, n){
  return list.slice().sort((a,b)=>(weakScore(b.w)-weakScore(a.w)) + (Math.random()-0.5)).slice(0,n);
}
function provPick(list, n){ return shuffle(list.filter(x=>(prog.w[x.w]||{}).prov && !mastered(x.w))).slice(0,n); }
// Characters are hidden unless the learner opted in (Progress / Words toggle). Every
// render site that shows a VOCAB word's `w` (character) field goes through this.
function charSpan(w, cls){ return prog.showChars ? `<span class="${cls}">${escapeHtml(w.w)}</span>` : ""; }

function levelList(lv){ return VOCAB.filter(v=>v.lv===lv); }
function nSets(lv){ return Math.ceil(levelList(lv).length/10); }
function learnedWords(){
  // Words from completed sets, plus any word explicitly flagged `d` (drilled ahead of
  // its set via the Words-tab pager). Only the `d` flag counts here — not just "has a
  // prog.w entry" — so that placement's retake re-baseline (which deletes `d`-flagged
  // and placement-only-provisional entries) actually shrinks the pool instead of every
  // leftover prog.w record resurrecting a word outside the freshly placed range.
  const out = [];
  [1,2,3,4].forEach(lv=>{ out.push(...levelList(lv).slice(0, (prog.sets[lv]||0)*10)); });
  const seen = new Set(out.map(w=>w.w));
  VOCAB.forEach(v=>{ if(!seen.has(v.w) && prog.w[v.w] && prog.w[v.w].d){ out.push(v); seen.add(v.w); } });
  return out;
}
// validateProgShape() and placementStopIndex() live in pinyin_core.js (PC.validateProgShape,
// PC.placementStopIndex) so the app and the node checks share one definition.
function nextNewSet(){
  for(const lv of [1,2,3,4]){ if((prog.sets[lv]||0) < nSets(lv)) return {lv, set: prog.sets[lv]||0}; }
  return null;
}

// ===================== sentences (Phase 2) =====================
function markSentence(zh, ok){
  const p = prog.s[zh] || {r:0,w:0,s:0};
  if(ok){ p.r++; p.s++; } else { p.w++; p.s=0; }
  prog.s[zh] = p; store.save();
}
// Mastered at streak >= 2, not >= 3 like vocab words — a sentence draws on several
// already-learned words at once, so a lower bar for "solid" is appropriate.
const sentenceMastered = zh => (prog.s[zh]||{}).s >= 2;
const sentenceWeakScore = zh => { const p = prog.s[zh]||{r:0,w:0,s:0}; return p.w*3 - p.s; };
function weakFirstSentences(list, n){
  return list.slice().sort((a,b)=>(sentenceWeakScore(b.zh)-sentenceWeakScore(a.zh)) + (Math.random()-0.5)).slice(0,n);
}
// The learner's current active level: the level nextNewSet() would teach from next,
// or one past HSK4 if every set is done. Used for "placed past this sentence's level".
function currentLevel(){ const nn = nextNewSet(); return nn ? nn.lv : 5; }
function sentenceWordsLearned(sentence, lwSet){
  return (sentence.words||[]).every(w=>{
    if(lwSet.has(w)) return true;
    const extra = SENTENCE_EXTRA[w];
    return extra && lwSet.has(extra.base);
  });
}
// Available once every word is learned, OR the learner has already placed/progressed
// past the sentence's level entirely (so a fresh HSK3 arrival isn't blocked from HSK1
// sentences just because HSK1 words were never individually drilled one by one).
function sentenceAvailable(sentence, lwSet, curLv){ return sentenceWordsLearned(sentence, lwSet) || curLv > sentence.lv; }
// learnedWords()/currentLevel() are each an O(VOCAB) scan; computing the learned-word
// Set and current level once here (not per sentence inside a .filter callback) keeps
// this an O(SENTENCES + VOCAB) call instead of O(SENTENCES * VOCAB) (~4M ops on the
// full corpus for what should be a cheap per-render lookup).
function availableSentences(){
  const lwSet = new Set(learnedWords().map(w=>w.w));
  const curLv = currentLevel();
  return SENTENCES.filter(s => sentenceAvailable(s, lwSet, curLv));
}
// Up to n example sentences containing a given VOCAB word exactly (not through a
// SENTENCE_EXTRA compound — those are a different literal string), for the Words
// reveal/teach-card "sentences containing it" list.
function wordExampleSentences(w, n){
  return SENTENCES.filter(s => (s.words||[]).indexOf(w) >= 0).slice(0, n);
}

// ===================== learning path + characters (Phase 3 / 3b) =====================
// The path is a sequence of stages (PC.stagePath): HSK1 -> HSK2 -> HSK3 -> 字 (characters
// of HSK 1-3 words) -> HSK4 -> 字4, or with prog.charsAfterHsk4 HSK1..4 -> 字 (1-4).
// Today's Learn step teaches the next set of the first incomplete stage (nextStage()).
// Character sets are chunks of 10 of the stage's words; a set is taught once every
// word in it has a prog.c record.
function allNSets(){ return {1:nSets(1), 2:nSets(2), 3:nSets(3), 4:nSets(4)}; }
function stagePath(){ return PC.stagePath(prog, allNSets(), VOCAB); }
function nextStage(){ return PC.nextStage(prog, allNSets(), VOCAB); }
// "Characters have started": any prog.c record exists, or the current stage is a
// character stage. Before that nothing character-related renders outside the path
// strip (besides the existing showChars toggle).
function charsUnlocked(){ return PC.charsStarted(prog, allNSets(), VOCAB); }
// HSK 1-3 all taught by sound (same gate PC.showCharChoice/PC.charsUnlocked use) --
// the point the learning-order control becomes available in Progress, independent
// of whether characters have actually started.
function hsk123Done(){ return PC.charsUnlocked(prog.sets, allNSets()); }
// "1–3" / "4" / "1–4" for a character stage's level range.
function levelRange(levels){ return levels.length > 1 ? `${levels[0]}–${levels[levels.length-1]}` : String(levels[0]); }
function markChar(w, ok){
  if(!prog.c) prog.c = {};
  const p = prog.c[w] || {r:0,w:0,s:0};
  if(ok){ p.r++; p.s++; } else { p.w++; p.s=0; }
  prog.c[w] = p; store.save();
}
const charStreak = w => ((prog.c||{})[w]||{}).s || 0;
const charMastered = w => charStreak(w) >= PC.CHAR_MASTERED;
const charWeakScore = w => { const p = (prog.c||{})[w]||{r:0,w:0,s:0}; return p.w*3 - p.s; };
function weakFirstChars(list, n){
  return list.slice().sort((a,b)=>(charWeakScore(b.w)-charWeakScore(a.w)) + (Math.random()-0.5)).slice(0,n);
}
// VOCAB entries with a character record, in VOCAB order.
function charRecordWords(){ const c = prog.c||{}; return VOCAB.filter(v=>c[v.w]); }

// ===================== speech =====================
const SS = window.speechSynthesis || null;
const hasSpeech = !!(SS && window.SpeechSynthesisUtterance);
let zhVoice = null, noticeShown = false;
if(hasSpeech){
  const pv = () => { const v = SS.getVoices(); zhVoice = v.find(x=>/^zh(-|_)?(CN|Hans)?/i.test(x.lang)) || v.find(x=>/zh/i.test(x.lang)) || null; };
  pv(); SS.onvoiceschanged = pv;
}
function say(t){
  if(!hasSpeech) return;
  try{ SS.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang="zh-CN"; if(zhVoice) u.voice=zhVoice; u.rate=0.85; SS.speak(u); }catch(e){}
}
// Like say(), but toggles a "speaking" class on the given button for the duration of
// the utterance, so the big speaker glyph on hear items can pulse while it talks.
function playWithPulse(t, btn){
  if(!hasSpeech) return;
  try{
    SS.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang="zh-CN"; if(zhVoice) u.voice=zhVoice; u.rate=0.85;
    if(btn){
      u.onstart = () => btn.classList.add("speaking");
      u.onend = () => btn.classList.remove("speaking");
      u.onerror = () => btn.classList.remove("speaking");
    }
    SS.speak(u);
  }catch(e){}
}
function speechNotice(){
  if(hasSpeech || noticeShown) return "";
  noticeShown = true;
  return `<div class="warn">This browser has no Chinese text-to-speech voice, so listening items show the word instead of playing audio.</div>`;
}
// Samsung Internet on Android reports a Chinese voice via speechSynthesis but never
// actually plays audio, so speechNotice() (which only checks voice availability)
// misses it. Shown every visit on Today — no dismiss, since the problem persists
// until the learner switches browser — unlike speechNotice() which is a one-time,
// any-page notice.
const isSamsungBrowser = /SamsungBrowser/i.test(navigator.userAgent);
function samsungNotice(){
  if(!isSamsungBrowser) return "";
  return `<div class="warn">Audio doesn't play in Samsung Internet. Open this page in Chrome or Firefox to hear the words.</div>`;
}

// ===================== speaker icon (one system, three sizes) =====================
// SVG (currentColor) instead of an emoji, which renders inconsistently across
// platforms — used for the big hear-item glyph, the small "replay" control, and
// the small tap-to-hear icon on teach-card rows.
function speakerSVG(size){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M4 9v6h3.5l4.9 4V5l-4.9 4H4z" fill="currentColor"/>
    <path d="M16.2 8.8a5 5 0 0 1 0 6.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
    <path d="M18.6 6.3a8.5 8.5 0 0 1 0 11.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/>
  </svg>`;
}
const SPEAKER_SVG = speakerSVG(38);
const REPLAY_SVG = speakerSVG(18);
const TEACH_PLAY_SVG = speakerSVG(14);

// ===================== tone contour glyph =====================
const CONTOUR = {
  1: `<svg class="contour" width="22" height="14" viewBox="0 0 22 14"><path d="M2 4 L20 4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  2: `<svg class="contour" width="22" height="14" viewBox="0 0 22 14"><path d="M2 11 L20 3" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  3: `<svg class="contour" width="22" height="14" viewBox="0 0 22 14"><path d="M2 5 Q9 13 11 13 Q13 13 20 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  4: `<svg class="contour" width="22" height="14" viewBox="0 0 22 14"><path d="M2 2 L20 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`,
  5: `<svg class="contour" width="14" height="14" viewBox="0 0 14 14"><circle cx="7" cy="7" r="2.4" fill="currentColor"/></svg>`
};
function contourFor(n){
  const tt = PC.syll(n).map(c=>+c.slice(-1)||5);
  const last = tt[tt.length-1] || 1;
  return `<span class="t${last}">${CONTOUR[last]}</span>`;
}

// ===================== generic drill runner =====================
// item: {kind:'mc'|'type', label, html, opts?, a?, reveal, onAnswer?, mount?, check?}
let D = null;
function drill(items, onDone, summary){ D = { q: shuffle(items.slice()), right:0, seen:0, miss:[], onDone, summary }; dnext(); }
// answered/total, not right/wrong: the header shows only "k left" (no accuracy
// numbers) plus a thin progress bar tracking answered/total; both go empty/zero
// outside a drill (total falsy).
function setScore(answered, total){
  const left = total ? Math.max(0, total - answered) : 0;
  $("score").textContent = (total && left > 0) ? `${left} left` : "";
  const fill = $("hdrbarfill");
  if(!fill) return;
  // width:0% still left a faint 1px mark visible outside a drill (rounding/
  // subpixel rendering at the bar's rounded corners) -- hide the element outright
  // at 0 total rather than relying on a zero width to be invisible.
  if(!total){ fill.style.display = "none"; fill.style.width = "0%"; return; }
  fill.style.display = "block";
  fill.style.width = `${Math.min(100, Math.max(0, Math.round((answered/total)*100)))}%`;
}
function announce(html){
  const el = $("live"); if(!el) return;
  const tmp = document.createElement("div"); tmp.innerHTML = html || "";
  el.textContent = tmp.textContent || "";
}
function showReveal(html){
  const rv = $("rv"); if(!rv) return;
  rv.innerHTML = html;
  rv.style.display = html ? "block" : "none";
  if(html){ rv.style.opacity = "0"; requestAnimationFrame(()=>{ rv.style.opacity = "1"; }); }
  announce(html);
}

function dnext(){
  if(!D) return;
  const P = $("panel");
  if(!D.q.length){
    const { right, seen, miss, onDone, summary } = D;
    // Done screen isn't a drill item any more (nothing "left", nothing "answered
    // of"): reset the header readout/progress-bar to empty here, same as every
    // non-drill panel render does at its own top, so it doesn't keep showing the
    // drill's final 100% state.
    setScore(0, 0);
    P.innerHTML = `<div class="done"><h2>${right} / ${seen}</h2>${summary ? summary(miss) : ""}<button class="next" id="ok">Continue</button></div>`;
    // The miss summary embeds each missed item's own reveal HTML (sentence items'
    // reveals carry tappable data-sent/data-widx word spans) directly into this
    // screen, not into #rv — wire taps here too, or they'd sit dead on the done
    // screen. Harmless no-op for vocab-only summaries (nothing to match). Wired on
    // the .done element (replaced by the next innerHTML), never on the persistent
    // #panel, where the listener would outlive this screen and double-fire taps.
    wireSayTaps(P.querySelector(".done"));
    // Drill is finished: clear state now, before handing control back, so a stray
    // keystroke or the previous screen's stale handler can't act on an empty queue.
    D = null; drillKeyHandler = null;
    $("ok").onclick = onDone;
    return;
  }
  setScore(D.seen, D.seen + D.q.length);
  const it = D.q.shift();
  if(it.kind === "type"){ renderTypeItem(it); }
  else { renderMcItem(it); }
}

function renderMcItem(it){
  const P = $("panel");
  P.innerHTML = `<div class="drill-body"><p class="q">${escapeHtml(it.label)}</p>${it.html||""}<div class="opts ${it.optsClass||""}" id="o"></div><div class="reveal" id="rv"></div></div><div class="actions"><button class="next" id="nx" style="display:none">Next</button></div>`;
  if(it.mount) it.mount();
  const opts = shuffle(it.opts.slice());
  const container = $("o");
  let answered = false;
  opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.innerHTML = `<b class="num">${i+1}</b>${escapeHtml(o)}`;
    b.onclick = () => {
      if(answered) return; answered = true;
      [...container.children].forEach(x=>{ x.disabled = true; if(x.dataset.v === it.a) x.classList.add("ok"); });
      const ok = o === it.a;
      if(!ok) b.classList.add("bad");
      D.seen++; if(ok) D.right++; else { D.miss.push(it); D.q.push(it); }
      if(it.onAnswer) it.onAnswer(ok);
      showReveal(it.reveal || "");
      if(it.onReveal) it.onReveal();
      $("nx").style.display = "block"; setScore(D.seen, D.seen + D.q.length);
    };
    b.dataset.v = o;
    container.appendChild(b);
  });
  $("nx").onclick = dnext;
  drillKeyHandler = e => {
    if(!D) return;
    const nx = $("nx");
    if(e.key >= "1" && e.key <= String(opts.length) && !answered){ container.children[+e.key-1].click(); }
    else if(e.key === "Enter" && nx && nx.style.display !== "none"){ dnext(); }
    else if(e.key === "Escape"){ quitDrill(); }
  };
}

function renderTypeItem(it){
  const P = $("panel");
  // Check and Next share .actions (only one visible at a time) so the primary
  // button pins to the same place in both the unanswered and answered state.
  P.innerHTML = `<div class="drill-body"><p class="q">${escapeHtml(it.label)}</p>${it.html||""}
    <input type="text" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type pinyin…">
    <div class="reveal" id="rv"></div></div><div class="actions"><button class="next" id="submit">Check</button><button class="next" id="nx" style="display:none">Next</button></div>`;
  if(it.mount) it.mount();
  const input = $("tin"); input.focus();
  let answered = false;
  function submit(){
    if(answered) return; if(!input.value.trim()) return;
    answered = true; input.disabled = true; $("submit").style.display = "none";
    const ok = it.check(input.value);
    D.seen++; if(ok) D.right++; else { D.miss.push(it); D.q.push(it); }
    if(it.onAnswer) it.onAnswer(ok);
    showReveal((ok ? "" : `<div class="diff">you typed: ${escapeHtml(input.value)}</div>`) + (it.reveal||""));
    $("nx").style.display = "block"; setScore(D.seen, D.seen + D.q.length);
  }
  $("submit").onclick = submit;
  $("nx").onclick = dnext;
  drillKeyHandler = e => {
    if(!D) return;
    if(e.key === "Enter"){ answered ? dnext() : submit(); }
    else if(e.key === "Escape"){
      // Escape while the input is focused blurs it first; a second Escape then quits.
      // This stops a learner mid-word-typing from losing the whole drill on one stray key.
      if(document.activeElement === input){ input.blur(); return; }
      quitDrill();
    }
  };
}

let drillKeyHandler = null;
document.addEventListener("keydown", e => { if(drillKeyHandler) drillKeyHandler(e); });
function quitDrill(){ D = null; drillKeyHandler = null; render(); }

// ===================== vocab drill item builders (meaning-centred) =====================
// Reveal block shared by hear/read/recall: tone-coloured pinyin + meaning, characters
// only when the learner has opted in — never the only cue even when shown.
function revealBlock(entry){
  const chars = prog.showChars ? `<div style="font-family:var(--zh);font-size:20px;margin-top:2px">${escapeHtml(entry.w)}</div>` : "";
  return `<div class="py">${PC.pyHTML(entry.n)}</div><div style="color:var(--mute)">${escapeHtml(PC.gloss(entry))}</div>${chars}${exampleSentencesHTML(entry)}`;
}
// hear — TTS plays the word; pick the meaning. No text stimulus (falls back to pinyin,
// never characters, if this browser has no zh voice).
function hearItem(entry){
  const ds = PC.meaningOpts(entry, VOCAB);
  const opts = [PC.gloss(entry), ...ds.map(d=>PC.gloss(d))];
  const rv = `<div class="q">You heard:</div>${revealBlock(entry)}`;
  return { kind:"mc", label:"What does it mean?", optsClass:"opts-hero",
    html: speechNotice() + (hasSpeech
      ? `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`
      : `<div class="big">${PC.pyHTML(entry.n)}</div>`),
    opts, a: PC.gloss(entry), reveal: rv, onAnswer: ok=>markWord(entry.w, ok),
    mount: () => { if(hasSpeech){ const btn = $("sp"); playWithPulse(entry.w, btn); btn.onclick = ()=>playWithPulse(entry.w, btn); } },
    onReveal: wireSayTaps };
}
// read — pinyin shown (tone-coloured); pick the meaning. Audio auto-plays.
function readItem(entry){
  const ds = PC.meaningOpts(entry, VOCAB);
  const opts = [PC.gloss(entry), ...ds.map(d=>PC.gloss(d))];
  const rv = revealBlock(entry);
  return { kind:"mc", label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="big">${PC.pyHTML(entry.n)}</div>`,
    opts, a: PC.gloss(entry), reveal: rv, onAnswer: ok=>markWord(entry.w, ok),
    mount: () => { if(hasSpeech) say(entry.w); },
    onReveal: wireSayTaps };
}
// recall — meaning shown; pick the pinyin. Distractors are other real words with the
// same syllable count (not phonetic near-misses — those confuse rather than teach meaning).
function recallItem(entry){
  const ds = PC.pinyinOpts(entry, VOCAB);
  const opts = [PC.mark(entry.n), ...ds.map(d=>PC.mark(d.n))];
  const rv = revealBlock(entry);
  return { kind:"mc", label:"Which word is this?", optsClass:"opts-hero",
    html: `<div class="med" style="text-align:center">${escapeHtml(PC.gloss(entry))}</div>`,
    opts, a: PC.mark(entry.n), reveal: rv, onAnswer: ok=>markWord(entry.w, ok),
    onReveal: wireSayTaps };
}

// ===================== sentences: rendering (Phase 2) =====================
const VOCAB_BY_W = {}; VOCAB.forEach(v=>{ VOCAB_BY_W[v.w] = v; });
// Looks up a sentence's position in the real SENTENCES array. Tap targets key
// off this index (plus a word index) rather than embedding the sentence's own
// characters in a data-* attribute -- with `showChars` off, the DOM must not
// carry Chinese text anywhere, even invisibly, and a raw data-say="你们" would
// still show up on a DOM grep. Indices are just numbers; the actual character
// string is only ever looked up from the in-memory SENTENCES/words arrays at
// tap time, never written into markup.
function sentenceIndexOf(sentence){ return SENTENCES.indexOf(sentence); }
// Generic: wires a single delegated click listener on `root` (default #rv) that
// speaks the tapped sentence or word. `data-sent` (a SENTENCES index) alone means
// "speak the whole sentence" (exampleSentencesHTML's row); `data-sent` +
// `data-widx` (a words[] index) means "speak just that word" (sentencePyHTML's
// per-word spans). e.target.closest() picks the nearest match, so a tap on a word
// span inside a whole-sentence row resolves to the word, not the row.
function wireSayTaps(root){
  const el = root || $("rv"); if(!el || el.dataset.sayWired) return;
  el.dataset.sayWired = "1";
  el.addEventListener("click", e => {
    // data-vidx (a VOCAB index) = speak that vocab word (Phase 3 character reveals).
    const t = e.target.closest("[data-sent],[data-vidx]");
    if(!t || !el.contains(t)) return;
    if(t.dataset.vidx !== undefined){ const v = VOCAB[+t.dataset.vidx]; if(v) say(v.w); return; }
    const s = SENTENCES[+t.dataset.sent]; if(!s) return;
    const text = t.dataset.widx !== undefined ? (s.words||[])[+t.dataset.widx] : s.zh;
    if(text) say(text);
  });
}
// Tone-coloured, word-spaced pinyin for a sentence, each word wrapped so it can be
// tapped to hear alone. A VOCAB word colours per-syllable via pyHTML(entry.n) (exact,
// since PC.mark(entry.n) is checked to reproduce entry.py exactly); a SENTENCE_EXTRA
// compound (no numbered form to derive per-syllable tones from) colours as one unit
// by its last syllable's tone instead (PC.guessTone) — see the Deviations note.
// blankIndex, if given, renders that word's slot as "____" instead (gapSentence) and
// never tappable (tapping it would say the answer).
//
// Phase 3 mixed script: once characters are unlocked and prog.mixChars is on, each
// token renders by its character streak (PC.sentenceTokenTier): streak 0-2 pinyin
// only, 3-5 characters with the tone-coloured pinyin as ruby above, >=6 characters
// alone. A SENTENCE_EXTRA token uses its `base` VOCAB word's streak but displays its
// own characters. The gap blank never changes (still "____", gap options pinyin).
function sentencePyHTML(sentence, blankIndex){
  const toks = PC.sentenceTokens(sentence);
  if(!toks) return escapeHtml(sentence.py); // alignment guard; shouldn't happen on validated data
  const sIdx = sentenceIndexOf(sentence);
  const unlocked = charsUnlocked(), mix = prog.mixChars !== false;
  return toks.map(t => {
    if(blankIndex === t.index) return `<span class="t5">____</span>${escapeHtml(t.punct)}`;
    const entry = VOCAB_BY_W[t.word];
    let inner = entry ? PC.pyHTML(entry.n) : `<span class="t${PC.guessTone(t.core)}">${escapeHtml(t.core)}</span>`;
    if(t.index === 0) inner = PC.capitalizeFirstSpan(inner);
    const baseW = entry ? entry.w : ((SENTENCE_EXTRA[t.word]||{}).base || t.word);
    const tier = PC.sentenceTokenTier(charStreak(baseW), unlocked, mix);
    if(tier === "ruby") inner = `<ruby class="mx">${escapeHtml(t.word)}<rt>${inner}</rt></ruby>`;
    else if(tier === "bare") inner = `<span class="mxzh">${escapeHtml(t.word)}</span>`;
    return `<span data-sent="${sIdx}" data-widx="${t.index}">${inner}</span>${escapeHtml(t.punct)}`;
  }).join(" ");
}
function sentCharSpanBlock(sentence){
  return prog.showChars ? `<div style="font-family:var(--zh);font-size:20px;margin-top:2px">${escapeHtml(sentence.zh)}</div>` : "";
}
function sentenceRevealBlock(sentence){
  return `<div class="py">${sentencePyHTML(sentence)}</div><div style="color:var(--mute)">${escapeHtml(sentence.en)}</div>${sentCharSpanBlock(sentence)}`;
}
// Up to 2 example sentences for a vocab word's reveal/teach card (Words screen),
// each tappable to hear. Characters gated the same way as everywhere else.
function exampleSentencesHTML(entry){
  const examples = wordExampleSentences(entry.w, 2);
  if(!examples.length) return "";
  const rows = examples.map(s => `<div class="rowset ex" data-sent="${sentenceIndexOf(s)}" style="cursor:pointer"><span class="py" style="flex:1">${sentencePyHTML(s)}</span><div class="en ex-en" style="flex:0 0 100%;text-align:left;margin-top:2px">${escapeHtml(s.en)}${sentCharSpanBlock(s)}</div></div>`).join("");
  return `<p class="q" style="margin-top:12px">Example${examples.length>1?"s":""}:</p>${rows}`;
}

// ===================== sentence drill item builders (Phase 2) =====================
// hearSentence — TTS plays the sentence; pick the meaning. Reveal: tone-coloured
// word-spaced pinyin (each word tappable to hear it alone), English, characters if
// enabled.
function hearSentence(sentence){
  const ds = PC.sentenceOpts(sentence, SENTENCES);
  const opts = [sentence.en, ...ds.map(d=>d.en)];
  const rv = `<div class="q">You heard:</div>${sentenceRevealBlock(sentence)}`;
  return { kind:"mc", label:"What did they say?", optsClass:"opts-hero",
    html: speechNotice() + (hasSpeech
      ? `<div class="hear-stage"><button class="speaker" id="sp" aria-label="Replay">${SPEAKER_SVG}</button></div>`
      : `<div class="med">${sentencePyHTML(sentence)}</div>`),
    opts, a: sentence.en, reveal: rv, onAnswer: ok=>markSentence(sentence.zh, ok),
    mount: () => { if(hasSpeech){ const btn = $("sp"); playWithPulse(sentence.zh, btn); btn.onclick = ()=>playWithPulse(sentence.zh, btn); } },
    onReveal: wireSayTaps };
}
// readSentence — pinyin shown; pick the meaning. Audio auto-plays. Same distractors
// and reveal as hearSentence.
function readSentence(sentence){
  const ds = PC.sentenceOpts(sentence, SENTENCES);
  const opts = [sentence.en, ...ds.map(d=>d.en)];
  const rv = sentenceRevealBlock(sentence);
  return { kind:"mc", label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="med">${sentencePyHTML(sentence)}</div>`,
    opts, a: sentence.en, reveal: rv, onAnswer: ok=>markSentence(sentence.zh, ok),
    mount: () => { if(hasSpeech) say(sentence.zh); },
    onReveal: wireSayTaps };
}
// gapSentence — pinyin shown with one content word blanked; pick the missing word's
// pinyin. Returns null when the sentence has no eligible content word to blank (a
// function-word-only or off-level sentence) — callers fall back to readSentence.
function gapSentence(sentence){
  const idxs = PC.gapCandidateIndices(sentence, VOCAB);
  if(!idxs.length) return null;
  const idx = idxs[Math.floor(Math.random()*idxs.length)];
  const entry = VOCAB_BY_W[sentence.words[idx]];
  const ds = PC.gapOpts(entry, VOCAB);
  const opts = [PC.mark(entry.n), ...ds.map(d=>PC.mark(d.n))];
  const rv = sentenceRevealBlock(sentence);
  return { kind:"mc", label:"What's the missing word?", optsClass:"opts-hero",
    html: `<div class="med">${sentencePyHTML(sentence, idx)}</div>`,
    opts, a: PC.mark(entry.n), reveal: rv, onAnswer: ok=>markSentence(sentence.zh, ok),
    mount: () => { if(hasSpeech) say(sentence.zh); },
    onReveal: wireSayTaps };
}
// Picks hear/read/gap ~= 50/25/25 for one sentence, falling back to readSentence if
// the gap draw lands on a sentence with no eligible blank.
function sentenceItemFor(sentence){
  const r = Math.random();
  if(r < 0.5) return hearSentence(sentence);
  if(r < 0.75) return readSentence(sentence);
  return gapSentence(sentence) || readSentence(sentence);
}

// ===================== character item builders (Phase 3) =====================
// Stimulus never shows pinyin for readChar/charSound (reading the characters is the
// point); every reveal does. Scoring writes prog.c only, never prog.w.
function charRevealBlock(entry){
  const vidx = VOCAB.indexOf(entry);
  return `<div data-vidx="${vidx}" style="cursor:pointer"><div class="zhbig" style="font-size:40px;margin:0 0 4px">${escapeHtml(entry.w)}</div>
    <div class="py" style="text-align:center">${PC.pyHTML(entry.n)} <span style="color:var(--mute);vertical-align:middle">${REPLAY_SVG}</span></div>
    <div style="color:var(--mute);text-align:center">${escapeHtml(PC.gloss(entry))}</div></div>`;
}
const charRevealHook = entry => () => { if(hasSpeech) say(entry.w); wireSayTaps(); };
// readChar — characters shown; pick the meaning.
function readCharItem(entry){
  const ds = PC.meaningOpts(entry, VOCAB);
  return { kind:"mc", label:"What does it mean?", optsClass:"opts-hero",
    html: `<div class="zhbig">${escapeHtml(entry.w)}</div>`,
    opts: [PC.gloss(entry), ...ds.map(d=>PC.gloss(d))], a: PC.gloss(entry),
    reveal: charRevealBlock(entry), onAnswer: ok=>markChar(entry.w, ok), onReveal: charRevealHook(entry) };
}
// charSound — characters shown; pick how it's said.
function charSoundItem(entry){
  const ds = PC.pinyinOpts(entry, VOCAB);
  return { kind:"mc", label:"How is it said?", optsClass:"opts-hero",
    html: `<div class="zhbig">${escapeHtml(entry.w)}</div>`,
    opts: [PC.mark(entry.n), ...ds.map(d=>PC.mark(d.n))], a: PC.mark(entry.n),
    reveal: charRevealBlock(entry), onAnswer: ok=>markChar(entry.w, ok), onReveal: charRevealHook(entry) };
}
// pickChar — audio + pinyin shown; pick the characters from 4 tiles.

function charItemFor(entry){

// ===================== Extras-only pronunciation items (tone pattern / typed pinyin) =====================
// Retired from Today/Review/Placement/Listen/Recall in v2; kept only for Test > Extras.
// Never show characters when showChars is off — fall back to audio + toneless pinyin
// (already the "en" line) instead of the character stimulus.
function toneItem(entry){
  const chunks = PC.syll(entry.n);
  const answer = PC.tones(entry.n);
  const toneless = chunks.map(c=>c.slice(0,-1)).join(" ");
  const opts = new Set([answer]);
  let guard = 0;
  while(opts.size < 4 && guard++ < 40){
    const cand = chunks.map(c => Math.random()<0.6 ? (c.slice(0,-1)+ (1+Math.floor(Math.random()*5))) : c);
    opts.add(cand.map(c=>c.slice(-1)).join("-"));
  }
  const rv = `<div class="py">${PC.pyHTML(entry.n)} ${contourFor(entry.n)}</div><div style="color:var(--mute)">${escapeHtml(PC.gloss(entry))}</div>`;
  const stimulus = prog.showChars ? `<div class="big" style="font-family:var(--zh)">${escapeHtml(entry.w)}</div>` : "";
  return { kind:"mc", label:"Which tone pattern?",
    html: stimulus + `<div class="en">${escapeHtml(toneless)}</div>` + (!prog.showChars && hasSpeech ? `<div class="listen-stage"><button class="replay" id="rpTone" aria-label="Replay">${REPLAY_SVG}</button></div>` : ""),
    mount: () => { if(!prog.showChars && hasSpeech){ say(entry.w); $("rpTone").onclick = ()=>say(entry.w); } },
    opts:[...opts], a: answer, reveal: rv, onAnswer: ok=>markWord(entry.w, ok) };
}
function typeItem(entry){
  const rv = `<div class="py">${PC.pyHTML(entry.n)} ${contourFor(entry.n)}</div>`;
  const stimulus = prog.showChars
    ? `<div class="big" style="font-family:var(--zh)">${escapeHtml(entry.w)}</div><div class="en">${escapeHtml(PC.gloss(entry))}</div>`
    : `<div class="med" style="text-align:center">${escapeHtml(PC.gloss(entry))}</div>`;
  return { kind:"type", label:"Type the pinyin (numbers or tone marks)",
    html: stimulus + (hasSpeech ? `<div class="listen-stage"><button class="replay" id="rp2" aria-label="Replay">${REPLAY_SVG}</button></div>` : ""),
    mount: () => { if(hasSpeech) $("rp2").onclick = ()=>say(entry.w); },
    check: val => PC.acceptTypeAnswer(val, entry), reveal: rv, onAnswer: ok=>markWord(entry.w, ok) };
}
function missSummary(miss){
  const u = [...new Map(miss.map(m=>[m.reveal, m])).values()];

// Word review item: hear/read/recall ~50/25/25.
function wordReviewItem(w){ const r = Math.random(); return r<0.5?hearItem(w):r<0.75?readItem(w):recallItem(w); }
function todayStep(){
  const lw = learnedWords();
  const s = todayStepState.step++;
  if(s === 0){ // Review
    if(lw.length >= 5){
      const pv = provPick(lw, 5);
      let items;
      if(todayStepState.charsStarted){
        // Phase 3b unified review: provisional words first (as before), then the 20
        // weakest across learned words (hear/read/recall) and words with a character
        // record (readChar/charSound 50/50), one shared score w*3 - s over each record.
        const pvSet = new Set(pv.map(v=>v.w));
        const ranked = PC.rankReview(lw.filter(x=>!pvSet.has(x.w)), prog.w, charRecordWords(), prog.c, 20-pv.length);
        items = [...pv.map(wordReviewItem),
          ...ranked.map(x => x.kind === "w" ? wordReviewItem(x.entry) : (Math.random()<0.5 ? readCharItem(x.entry) : charSoundItem(x.entry)))];
      } else {
        // Before characters start: 15 weakest/provisional words, unchanged.
        const rest = weakFirst(lw.filter(x=>!pv.includes(x)), 15-pv.length);
        items = [...rest, ...pv].map(wordReviewItem);
      }
      drill(shuffle(items), todayStep, missSummary); return;
    }
    return todayStep();
  }
  if(s === 1){ // Learn: the snapshotted stage's next set
    const st = todayStepState.stage;
    if(st && st.kind === "words"){ // teach the next set of 10, then drill 10x hear + 10x read
      const nn = { lv: st.lv, set: st.set };
      const list = levelList(nn.lv).slice(nn.set*10, nn.set*10+10);
      vocabTeach(list, nn.lv, () => {
        const items = [];
        list.forEach(w => items.push(hearItem(w), readItem(w)));
        drill(shuffle(items), () => { prog.sets[nn.lv] = nn.set+1; store.save(); todayStep(); }, missSummary);
      });
      return;
    }
    const cs = todayStepState.cset;
    if(st && st.kind === "chars" && cs){ // teach the set's 10 characters, then 10x pickChar + 10x readChar
      charTeach(cs.words, `Characters, HSK ${levelRange(st.levels)} set ${cs.index+1} of ${cs.total}.`, () => {
        const items = [];
        cs.words.forEach(w => items.push(pickCharItem(w), readCharItem(w)));
        drill(shuffle(items), todayStep, missSummary);
      });
      return;
    }
    return todayStep();
  }
  if(s === 2){ // Listen: 12 hear items from learned words
    if(lw.length >= 4){ drill(weakFirst(lw,12).map(w=>hearItem(w)), todayStep, missSummary); return; }
    return todayStep();
  }
  if(s === 3){ // Recall: 8 items
    if(lw.length >= 4){
      if(todayStepState.charsStarted){
        // Phase 3b: random 8 from a combined pool -- one meaning->pinyin item per
        // learned word, plus one meaning->character item per word with a record.
        const pool = [...lw.map(w => () => recallItem(w)), ...charRecordWords().map(w => () => recallCharItem(w))];
        drill(pick(pool, 8).map(f => f()), todayStep, missSummary); return;
      }
      drill(weakFirst(lw,8).map(w=>recallItem(w)), todayStep, missSummary); return;
    }
    return todayStep();
  }
  if(s === 4){ // Sentences: 8 items hear/read/gap ~50/25/25, from available sentences weakest-first
    const availSent = availableSentences();
    if(availSent.length >= 8){ drill(weakFirstSentences(availSent,8).map(sentenceItemFor), todayStep, missSummary); return; }
    return todayStep();
  }
  todayFinish();
}

  body.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{ wordsLv=+b.dataset.l; wordsSet=null; renderWordBody(); });
  $("pv").onclick = () => { wordsSet = Math.max(0, wordsSet-1); renderWordBody(); };
  $("nx").onclick = () => { wordsSet = Math.min(total-1, wordsSet+1); renderWordBody(); };
  $("jump").onclick = () => { wordsSet = Math.min(done, total-1); renderWordBody(); };
  const wl = $("wl");
  set.forEach(w => {
    const row = document.createElement("div"); row.className = "wl"; row.style.cursor = "pointer";
    row.innerHTML = `${charSpan(w,"zh")}<span class="info"><span class="py">${PC.pyHTML(w.n)}</span><span class="en">${escapeHtml(PC.gloss(w))}</span></span>`;
    row.onclick = () => say(w.w);
    wl.appendChild(row);
  });
  $("dr").onclick = () => {
    const items = []; set.forEach(w => items.push(hearItem(w), readItem(w)));
    // Only advance the level's set pointer when this was exactly the next unlearned
    // set — drilling a set further ahead must not silently mark every skipped set
    // as learned. Otherwise stamp these specific words with the `d` (drilled-ahead)
    // flag so learnedWords() counts just them, not the whole set range.
    // The drill runner replaces the whole #panel, so its callback rebuilds the full
    // Words shell (wordsRender), not just #wbody.
    drill(shuffle(items), () => {
      if(wordsSet === (prog.sets[wordsLv]||0)){ prog.sets[wordsLv] = wordsSet+1; }
      else { set.forEach(w => { if(!prog.w[w.w]) prog.w[w.w] = {r:0,w:0,s:0}; prog.w[w.w].d = 1; }); }
      store.save(); wordsRender();
    }, missSummary);
  };
  if(canReview) $("rev").onclick = () => {
    const lw = learnedWords();
    drill(weakFirst(lw, 15).map(w=>{ const r = Math.random(); return r<0.5?hearItem(w):r<0.75?readItem(w):recallItem(w); }), wordsRender, missSummary);
  };
}

// ===================== Test (placement + free tests) =====================
let testSel = null, PL = null;
function testRender(){
  setScore(0,0);
  const P = $("panel");
  if(testSel === "placement"){ placeRender(); return; }
  if(testSel === "extras"){ extrasRender(); return; }
  const lw = learnedWords(); const availSent = availableSentences();
  // "Learn a few words first" used to be a dead-end alert on the Listen/Recall/
  // Sentences buttons; replaced with an inline note + the direct action
  // (placement seeds prog.sets, which is the fastest way past this gate) —
  // same startPlacement() path Today's own hint uses. The gated buttons
  // themselves are simply left out rather than shown disabled, since there's
  // nothing useful to click on them yet.
  const needMore = lw.length < 8 || availSent.length < 8;
  // Buttons already drill fewer than 20 when the pool is smaller (weakFirst just
  // slices to whatever's available) — label them by the actual count so the
  // number on the button is never a promise the drill doesn't keep.
  const listenN = Math.min(20, lw.length), recallN = listenN, sentN = Math.min(20, availSent.length);
  // Phase 3: Characters test, only once unlocked. Pool = words with a character
  // record, weakest first; topped up with learned words (HSK 1 first, frequency
  // order) when fewer than 20 have records.
  const unlocked = charsUnlocked();
  const charPool = unlocked ? charTestPool(lw) : [];
  // When gated, the note's own button IS "take placement" — showing the plain
  // "Take Placement" button too would put two identical CTAs on screen. Only one
  // shows at a time.
  P.innerHTML = `<p class="q">Placement finds where to start. Free tests draw from what's already learned.</p>
    <div class="actions">
      ${needMore ? `<div class="stmt">Learn a few words first — placement finds where to start.<button class="next" id="needPlace" style="margin-top:8px">Take the placement test</button></div>` : `<button class="next" id="pl">Take Placement</button>`}
      ${lw.length >= 8 ? `<div class="row" style="margin-top:8px;margin-bottom:0">
        <button class="ghost" id="tListen" style="flex:1">Listen ${listenN}</button>
        <button class="ghost" id="tRecall" style="flex:1">Recall ${recallN}</button>
      </div>` : ""}
      ${availSent.length >= 8 ? `<button class="ghost" id="tSentences">Sentences ${sentN}</button>` : ""}
      ${charPool.length ? `<button class="ghost" id="tChars">Characters ${charPool.length}</button>` : ""}
      <button class="ghost" id="extras">Extras: tones · typed pinyin</button>
    </div>`;
  $("extras").onclick = () => { testSel = "extras"; testRender(); };
  if(needMore){ $("needPlace").onclick = enterPlacementFromToday; }
  else { $("pl").onclick = () => { testSel = "placement"; testRender(); }; }
  if(lw.length >= 8){
    $("tListen").onclick = () => drill(weakFirst(lw,20).map(w=>hearItem(w)), testRender, missSummary);
    $("tRecall").onclick = () => drill(weakFirst(lw,20).map(w=>recallItem(w)), testRender, missSummary);
  }
  if(availSent.length >= 8){
    $("tSentences").onclick = () => drill(weakFirstSentences(availSent,20).map(s=>hearSentence(s)), testRender, missSummary);
  }
  if(charPool.length){
    $("tChars").onclick = () => drill(charTestPool(learnedWords()).map(charItemFor), testRender, missSummary);
  }
}
function charTestPool(lw){
  const recs = weakFirstChars(charRecordWords(), 20);
  if(recs.length >= 20) return recs;
  const have = new Set(recs.map(v=>v.w));
  return [...recs, ...PC.newCharWords(lw.filter(v=>!have.has(v.w)), prog.c, VOCAB, 20 - recs.length)];
}
// Extras: v1's pronunciation-focused items (tone pattern, typed pinyin), kept as an
// optional secondary test — not part of Today/Review/Placement/Listen/Recall in v2.
function extrasRender(){
  setScore(0,0);
  const P = $("panel");
  const lw = learnedWords();
  const needMore = lw.length < 8;
  const n = Math.min(20, lw.length);
  P.innerHTML = `<div class="row"><button id="back">‹ test</button></div>
    <p class="q">Optional pronunciation drills, from words you've already learned.</p>
    ${needMore ? `<div class="stmt">Learn a few words first — placement finds where to start.<button class="next" id="needPlace" style="margin-top:8px">Take the placement test</button></div>` : `<div class="row">
      <button class="ghost" id="tType" style="flex:1">Type ${n}</button>
      <button class="ghost" id="tTone" style="flex:1">Tones ${n}</button>
    </div>`}`;
  $("back").onclick = () => { testSel = null; testRender(); };
  if(needMore){ $("needPlace").onclick = enterPlacementFromToday; return; }
  $("tType").onclick = () => drill(weakFirst(lw,20).map(w=>typeItem(w)), () => { testSel="extras"; testRender(); }, missSummary);
  $("tTone").onclick = () => drill(weakFirst(lw,20).map(w=>toneItem(w)), () => { testSel="extras"; testRender(); }, missSummary);
}
// strata() lives in pinyin_core.js (PC.strata) so the app and the node checks share one
// definition. v2 drops the foundations block entirely — placement is 40 vocab-only
// hear/read items, since it's meaning that decides where a learner starts, not sounds.
function placeRender(){
  D = null; drillKeyHandler = null; setScore(0,0);
  const P = $("panel"); const lw = learnedWords();
  P.innerHTML = `<div class="row"><button id="back">‹ test</button></div>
    <p class="q">40 words across HSK 1–4: hear or read the word, pick the meaning. No feedback until the end. Places you inside a level; skipped words stay in review as provisional.</p>
    ${lw.length ? `<p class="q">Current: ${lw.length} words learned. Retaking resets set position and clears any provisional or drilled-ahead words that haven't stuck yet.</p>` : ""}
    <div class="actions"><button class="next" id="go">Start placement</button></div>`;
  $("back").onclick = () => { testSel = null; testRender(); };
  $("go").onclick = startPlacement;
}
// Pulled out of placeRender so Today's "New here?" hint can jump straight into
// placement without first landing on the Test tab's placement-intro screen.
function startPlacement(){
  D = null; drillKeyHandler = null; setScore(0,0);
  const st = PC.strata(VOCAB);
  const bucketItems = [];
  st.forEach((b,bi) => { const k = bi%2===0 ? 2 : 3; pick(b.words, k).forEach(w=>bucketItems.push({b:bi, w})); });
  PL = { vocab:{items:shuffle(bucketItems), i:0}, st, res: st.map(()=>({r:0,n:0})) };
  placeVocabNext();
}
function placeVocabNext(){
  const P = $("panel"); const V = PL.vocab;
  if(V.i >= V.items.length){ placeResult(); return; }
  const it = V.items[V.i++]; const w = it.w; setScore(V.i - 1, V.items.length);
  const ds = PC.meaningOpts(w, VOCAB);
  const opts = shuffle([PC.gloss(w), ...ds.map(d=>PC.gloss(d))]);
  const asHear = hasSpeech && Math.random() < 0.5;
  P.innerHTML = `<p class="q">Words ${V.i} / ${V.items.length}</p>
    ${asHear ? `<div class="hear-stage"><button class="speaker" id="rp" aria-label="Replay">${SPEAKER_SVG}</button></div>` : `<div class="big">${PC.pyHTML(w.n)}</div>`}
    <div class="opts" id="o"></div>`;
  if(asHear){ const btn = $("rp"); playWithPulse(w.w, btn); btn.onclick = ()=>playWithPulse(w.w, btn); }
  opts.forEach(o => {
    const b = document.createElement("button"); b.textContent = o;
    b.onclick = () => { PL.res[it.b].n++; if(o===PC.gloss(w)) PL.res[it.b].r++; placeVocabNext(); };
    $("o").appendChild(b);
  });
}
function placeResult(){
  setScore(0,0);
  const st = PL.st; const rows = [];
  // Pass rule lives in pinyin_core.js (PC.placementStopIndex): a rolling window of up
  // to 3 buckets must hit >=75% accuracy AND the current bucket needs at least 1 right,
  // since a raw per-bucket cutoff at 2-3 items makes a single lucky/unlucky guess decide
  // the whole bucket.
  const stop = PC.placementStopIndex(PL.res);
  st.forEach((b,i)=>{ const r = PL.res[i]; rows.push([b, r, r.n ? r.r/r.n : 1]); });
  const passed = stop==null ? st.length : stop;
  // Retaking placement re-baselines the review pool: drop anything that was only ever
  // a placement guess that never actually stuck (provisional with no real streak yet)
  // or was drilled ahead of its set from the Words tab (the `d` flag) — otherwise those
  // leftover prog.w entries would resurrect words outside the freshly placed range via
  // learnedWords()'s union, defeating the point of retaking.
  Object.keys(prog.w).forEach(k => {
    const p = prog.w[k];
    if((p.prov && p.s <= 1) || p.d) delete prog.w[k];
  });
  prog.sets = {1:0,2:0,3:0,4:0};
  for(let i=0;i<passed;i++){ const b = st[i]; prog.sets[b.lv] = Math.max(prog.sets[b.lv], b.s1); }
  learnedWords().forEach(w => { if(!prog.w[w.w]) prog.w[w.w] = {r:1,w:0,s:1,prov:1}; });
  prog.placedOnce = true;
  store.save();
  const pos = stop==null ? "everything covered" : `HSK ${st[passed].lv}, set ${st[passed].s0+1}`;
  const P = $("panel");
  P.innerHTML = `<div class="done"><h2>Start at ${pos}</h2>
    <table class="stats">${rows.map(([b,r,acc],i)=>`<tr><td>HSK ${b.lv} sets ${b.s0+1}–${b.s1}</td><td style="color:${i<passed?'var(--ok)':'var(--bad)'}">${r.r}/${r.n}</td></tr>`).join("")}</table>
    <p class="q">${learnedWords().length} words freshly marked provisional and kept in review.</p>
    <button class="next" id="ok">Go to Today</button></div>`;
  $("ok").onclick = () => { document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on", x.dataset.t==="today")); tab="today"; testSel=null; render(); };
}

// ===================== Progress =====================
function progressRender(){
  setScore(0,0);
  const P = $("panel");
  const lwAll = learnedWords();
  const availSent = availableSentences();
  const unlocked = charsUnlocked();
  const rows = [1,2,3,4].map(lv => {
    const list = levelList(lv); const learnedList = lwAll.filter(w=>w.lv===lv);
    const masteredN = learnedList.filter(w=>mastered(w.w)).length;
    const sentLv = SENTENCES.filter(s=>s.lv===lv); const sentAvailLv = availSent.filter(s=>s.lv===lv);
    const sentMasteredN = sentAvailLv.filter(s=>sentenceMastered(s.zh)).length;
    return `<tr><td>HSK ${lv}</td><td>${learnedList.length} / ${list.length} learned · ${masteredN} mastered</td></tr>
      <tr><td>HSK ${lv} sentences</td><td>${sentAvailLv.length} / ${sentLv.length} available · ${sentMasteredN} mastered</td></tr>`;
  }).join("") + (unlocked ? stagePath().filter(st=>st.kind==="chars").map(st => {
    // Phase 3b: one row per character stage. "learned" = has a prog.c record;
    // mastered = streak >= 3; of all words in the stage's levels.
    const list = PC.charStageWords(st.levels, VOCAB);
    const recN = list.filter(w=>(prog.c||{})[w.w]).length, cmN = list.filter(w=>charMastered(w.w)).length;
    return `<tr><td>Characters HSK ${levelRange(st.levels)}</td><td>learned ${recN} / mastered ${cmN} of ${list.length}</td></tr>`;
  }).join("") : "");
  const weak = weakFirst(lwAll.filter(w=>weakScore(w.w)>0), 10);
  P.innerHTML = `${hasSpeech ? "" : `<div class="warn">No Chinese text-to-speech voice is available in this browser, so listening and audio-replay features show the word instead of playing sound.</div>`}
    <table class="stats">${rows}
      <tr><td>Sounds</td><td>${Object.keys(prog.lessons).length} / ${LESSONS.length} lessons done</td></tr>
      <tr><td>Sessions</td><td>${prog.sessions||0}</td></tr></table>
    <div class="row" style="margin-top:14px"><button class="chip ${prog.showChars?'on':''}" id="toggleChars">Show characters</button>${unlocked ? `<button class="chip ${prog.mixChars!==false?'on':''}" id="toggleMix">Mix known characters into sentences</button>` : ""}</div>
    ${hsk123Done() ? `<div class="row" style="margin-top:14px"><button class="chip ${prog.charsAfterHsk4?'':'on'}" id="ordChars">Characters before HSK 4</button><button class="chip ${prog.charsAfterHsk4?'on':''}" id="ordHsk4">HSK 4 before characters</button></div>
    <p class="q" style="margin-top:6px">Changes what step 2 teaches next. Nothing you've learned is lost.</p>` : ""}
    <p class="q" style="margin-top:14px">${weak.length ? "Weakest words" : "No weak words yet — nice."}</p>
    ${weak.map(w=>`<div class="rowset">${charSpan(w,"zh")}<span class="py">${PC.pyHTML(w.n)}</span><span class="en">${escapeHtml(PC.gloss(w))}</span></div>`).join("")}
    <div class="row" style="margin-top:16px">
      <button class="ghost" id="exp" style="flex:1">Export progress</button>
      <button class="ghost" id="imp" style="flex:1">Import progress</button>
    </div>
    <div id="impbox" style="display:none;margin-top:10px">
      <textarea id="imptxt" placeholder="Paste exported JSON here"></textarea>
      <input type="file" id="impfile" accept="application/json" style="margin-top:8px">
      <button class="next" id="doimport">Load</button>
      <div id="impErr" class="warn" style="display:none;margin-top:8px"></div>
    </div>
    <button class="ghost" id="reset" style="margin-top:16px;color:var(--bad);border-color:var(--bad)">Reset all progress</button>`;
  $("toggleChars").onclick = () => { prog.showChars = !prog.showChars; store.save(); progressRender(); };
  if(unlocked) $("toggleMix").onclick = () => { prog.mixChars = prog.mixChars === false; store.save(); progressRender(); };
  // Reversible learning-order switch (Phase 3c): flips prog.charsAfterHsk4 only --
  // stagePath()/nextStage() recompute the path from the flag, touching neither
  // prog.c/prog.w nor prog.sets, so nothing learned is lost either direction.
  if(hsk123Done()){
    $("ordChars").onclick = () => { prog.charsAfterHsk4 = false; store.save(); progressRender(); };
    $("ordHsk4").onclick = () => { prog.charsAfterHsk4 = true; store.save(); progressRender(); };
  }
  $("exp").onclick = () => {
    const blob = new Blob([JSON.stringify(prog, null, 1)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "hsk_pinyin_progress.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  };
  $("imp").onclick = () => { $("impbox").style.display = $("impbox").style.display==="none" ? "block" : "none"; };
  $("impfile").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => { $("imptxt").value = r.result; }; r.readAsText(f); };
  const showImportError = msg => { const el = $("impErr"); el.textContent = msg; el.style.display = "block"; };
  $("doimport").onclick = () => {
    // Validation runs inside the try so a throw from a malformed-but-JSON-parseable
    // shape becomes a rejection message too, instead of an uncaught error and a
    // silent no-op. Errors render inline in the import box (not alert()) so the
    // message sits right next to the thing that needs fixing.
    try{
      const data = JSON.parse($("imptxt").value);
      const v = PC.validateProgShape(data);
      if(!v.ok){ showImportError("That doesn't look like valid exported progress: " + v.reason); return; }
      const prevTheme = prog.theme, prevShowChars = prog.showChars, prevMixChars = prog.mixChars;
      // Both v1 and v2 exports pass validateProgShape; PC.migrateProg (shared with the
      // boot-time migration below) forces v:2 and defaults showChars false.
      prog = PC.migrateProg(v.data);
      if(prog.theme === undefined) prog.theme = prevTheme; // imported progress with no theme keeps the current one
      if(v.data.showChars === undefined) prog.showChars = prevShowChars; // same for showChars
      if(v.data.mixChars === undefined) prog.mixChars = prevMixChars !== false; // and mixChars
      store.save(); applyTheme(); progressRender();
    }catch(e){
      showImportError("That doesn't look like valid exported progress: " + (e && e.message ? e.message : "could not be read"));
    }
  };
  $("reset").onclick = () => {
    if(!confirm("Reset all progress? This can't be undone.")) return;
    prog = { v:2, w:{}, s:{}, c:{}, sets:{1:0,2:0,3:0,4:0}, lessons:{}, sessions:0, theme:prog.theme, showChars:prog.showChars, mixChars:true, charsAfterHsk4:false, charsChoiceSeen:false };
    store.save(); progressRender();
  };
}

// ===================== theme =====================
function applyTheme(){ document.documentElement.setAttribute("data-theme", prog.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")); }
$("themebtn").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  prog.theme = cur === "dark" ? "light" : "dark";
  applyTheme(); store.save();
};

// ===================== boot =====================
(async function(){
  await store.load();
  // Migration v1 -> v2: PC.migrateProg (shared with the import handler above) bumps a
  // stored v1 progress object to v:2 and defaults the new showChars field; only persist
  // if migration actually changed something, to avoid a needless write on every boot.
  // Phase 3 adds prog.c (character progress) and prog.mixChars, Phase 3b the path flags
  // charsAfterHsk4 / charsChoiceSeen -- same shared migration.
  if(prog.v !== 2 || prog.showChars === undefined || prog.s === undefined || prog.c === undefined || prog.mixChars === undefined
    || prog.charsAfterHsk4 === undefined || prog.charsChoiceSeen === undefined){ prog = PC.migrateProg(prog); store.save(); }
  applyTheme();
  render();
})();
</script>
</body>
</html>
