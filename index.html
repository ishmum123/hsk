<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSK pinyin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0ED;--ink:#1B2321;--mute:#5C6B67;--line:#D6DAD7;--card:#FFFFFF;
    --ok:#2F7A5B;--ok-bg:#E4F1EB;--bad:#B4483F;--bad-bg:#FBEAE8;
    --t1:#3B6E99;--t2:#3E8B5C;--t3:#9C6B2E;--t4:#B33F3F;--t5:#8A8378;
    --font: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
    --zh: "PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
      --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
      --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
    }
  }
  :root[data-theme="dark"]{
    --bg:#161A18;--ink:#E7EAE7;--mute:#98A29C;--line:#2B322E;--card:#1E2320;
    --ok:#4FAE86;--ok-bg:#193028;--bad:#E08579;--bad-bg:#361F1D;
    --t1:#6FA8D8;--t2:#6FC08C;--t3:#D0A059;--t4:#E07A6E;--t5:#A39C8E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 var(--font)}
  body{padding-bottom:calc(64px + var(--safe-b))}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 24px;min-height:calc(100dvh - 64px - var(--safe-b));display:flex;flex-direction:column}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex:0 0 auto}
  h1{font-size:18px;font-weight:600;margin:0}
  .score{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
  /* Thin progress bar under the header, replacing the "n / seen" accuracy numbers
     during a drill — width tracks answered/total; empty (width 0, transparent
     track) outside a drill. */
  .hdrbar{height:3px;border-radius:2px;background:transparent;margin-bottom:12px;flex:0 0 auto;overflow:hidden}
  .hdrbar i{display:block;height:100%;width:0;background:var(--ink);transition:width 0.2s ease}
  @media (prefers-reduced-motion: reduce){ .hdrbar i{transition:none} }
  .themebtn{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:16px;color:var(--ink);flex:0 0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;flex:1 1 auto;display:flex;flex-direction:column}
  #panel > .done{display:flex;flex-direction:column;flex:1 1 auto}
  .next:last-child, .primary:last-child, .done .next{margin-top:auto}
  /* Explicit pin for screens where the trailing action isn't reliably the DOM
     last-child (e.g. a hidden-until-answered Next button, or a landing screen
     whose action is a button plus a row of secondary options after it). */
  .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
  /* Wraps the prompt+stimulus+options+reveal of a drill item (and Today's plan
     block): grows to fill whatever vertical space .actions' pinned button doesn't
     need, then centers its own content in that space, so a 4-option item sits in
     the middle of the card on a tall phone screen instead of hugging the top. On
     desktop (see the 900px query) .wrap no longer forces the card to fill the
     viewport, so there's no extra space here to center into and this is a no-op. */
  .drill-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}
  .q{color:var(--mute);font-size:15px;margin:0 0 10px}
  /* v2's .big/.med stimuli are pinyin or English, not characters — the Chinese font
     only belongs on elements that actually render a word's `w` field (see charSpan()
     and its "zh" class rules below). */
  .big{font-size:52px;line-height:1.3;text-align:center;margin:6px 0 16px;font-weight:500}
  .med{font-size:22px;line-height:1.5;margin:2px 0 14px}
  .en{color:var(--mute);font-size:15px;text-align:center;margin-top:-8px;margin-bottom:14px}
  .opts{display:grid;gap:8px}
  .opts button{width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;font-size:17px;color:var(--ink);line-height:1.35;min-height:48px;font-family:var(--font)}
  .opts button b.num{color:var(--mute);font-weight:500;margin-right:8px;font-size:14px}
  .opts button.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
  .opts button.bad{border-color:var(--bad);background:var(--bad-bg);color:var(--bad)}
  /* Drill hero: the meaning choices are the main event on every meaning-centred item
     (hear/read/recall), so they get more room and weight than a plain option list. */
  .opts-hero button{font-size:18px;padding:18px 18px;min-height:58px;font-weight:500}
  .hear-stage{display:flex;justify-content:center;margin:14px 0 22px}
  .speaker{width:92px;height:92px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:36px;line-height:1;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  @keyframes speakerPulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
  .speaker.speaking{animation:speakerPulse 0.9s ease-in-out infinite}
  @media (prefers-reduced-motion: reduce){ .speaker.speaking{animation:none} }
  .reveal{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:none;font-size:15px}
  .reveal .py{font-size:20px;margin-bottom:4px}
  .next,.primary{margin-top:14px;width:100%;padding:14px;border:none;border-radius:12px;background:var(--ink);color:var(--bg);font-size:16px;min-height:48px;font-family:var(--font)}
  .ghost{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font-size:15px;min-height:44px;font-family:var(--font)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
  .row button, .chip{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:transparent;font-size:14px;color:var(--ink);min-height:44px;font-family:var(--font)}
  .row button.on, .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .replay{border:1px solid var(--line);background:transparent;border-radius:999px;width:44px;height:44px;font-size:17px;color:var(--ink);flex:0 0 auto}
  .listen-stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin:18px 0}
  .contour{display:inline-block}
  /* Phase 3 characters: large character stimulus, character option tiles, the
     Characters-step teach cards, and mixed-script sentence tokens (ruby / bare). */
  .zhbig{font-family:var(--zh);font-size:64px;line-height:1.25;text-align:center;margin:6px 0 16px;font-weight:500}
  .opts-zh button{font-family:var(--zh);font-size:28px;text-align:center;font-weight:500}
  .opts-zh button b.num{font-family:var(--font)}
  .charteach{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .charteach .zh{font-family:var(--zh);font-size:40px;line-height:1.2;flex:0 0 auto;min-width:56px;text-align:center}
  .charteach .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .charteach .en{color:var(--mute);font-size:14px}
  ruby.mx{font-family:var(--zh);ruby-position:over}
  ruby.mx rt{font-family:var(--font);font-size:0.55em;line-height:1}
  .mxzh{font-family:var(--zh)}
  .t1{color:var(--t1)} .t2{color:var(--t2)} .t3{color:var(--t3)} .t4{color:var(--t4)} .t5{color:var(--t5)}
  input[type=text]{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;font-size:19px;background:var(--card);color:var(--ink);font-family:var(--font)}
  input[type=text]:focus{outline:3px solid #7AA7D9;outline-offset:1px}
  .diff{font-size:15px;margin-top:6px}
  .diff span{display:inline-block;margin-right:6px;padding:2px 6px;border-radius:6px}
  .diff .hit{background:var(--ok-bg);color:var(--ok)}
  .diff .miss{background:var(--bad-bg);color:var(--bad)}
  .wl{border-bottom:1px solid var(--line);padding:12px 0;display:flex;align-items:flex-start;gap:12px}
  .wl .zh{font-size:24px;font-family:var(--zh);flex:0 0 auto;width:64px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wl .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .wl .py{font-size:17px;display:block}
  .wl .en{color:var(--mute);font-size:14px;text-align:left;display:block;margin:0}
  table.stats{width:100%;border-collapse:collapse;font-size:15px}
  table.stats td{padding:8px 0;border-bottom:1px solid var(--line)}
  table.stats td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1}
  .bar i{display:block;height:100%;background:var(--ink)}
  .path{display:flex;gap:6px;align-items:center;margin-bottom:14px}
  .path .seg{flex:1;text-align:center;font-size:11px;color:var(--mute)}
  .stmt{font-size:15px;line-height:1.5;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px}
  .warn{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
  .done h2{font-size:22px;margin:0 0 10px;font-weight:600}
  .done ul{padding-left:20px;font-size:15px;margin:8px 0}
  .card-teach{margin-bottom:14px}
  .card-teach h3{font-size:17px;margin:0 0 8px;font-weight:600}
  .card-teach p{font-size:15px;color:var(--mute);margin:0 0 10px}
  .rowset{display:flex;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);gap:10px}
  .rowset.ex{flex-wrap:wrap}
  .rowset .zh{font-family:var(--zh);font-size:18px;flex:0 0 auto;width:52px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowset .py{flex:0 1 auto;min-width:0}
  .rowset .en{color:var(--mute);font-size:14px;text-align:right;flex:1 1 0;min-width:0;overflow-wrap:anywhere;margin:0}
  .taplist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px}
  .taplist button{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);font-size:15px;min-height:48px}
  .plist button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px 4px;border:none;border-bottom:1px solid var(--line);background:transparent;font-size:16px;color:var(--ink);min-height:48px;align-items:center}
  .plist .tick{color:var(--ok);font-size:14px}
  textarea{width:100%;min-height:90px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:var(--card);color:var(--ink);font-family:var(--font)}
  .tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:5}
  .tabs button{flex:1;background:transparent;border:none;padding:10px 4px 8px;font-size:12px;color:var(--mute);min-height:56px;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--font)}
  .tabs button .ic{font-size:20px;line-height:1}
  .tabs button.on{color:var(--ink);font-weight:600}
  button{cursor:pointer}
  button:focus-visible, .opts button:focus-visible, [tabindex]:focus-visible{outline:3px solid #7AA7D9;outline-offset:2px}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .reveal{transition:opacity 0.15s ease}
  @media (prefers-reduced-motion: reduce){ .reveal{transition:none} }
  /* Desktop: keep the same phone-shaped column but stop the tab bar and empty
     grey margins from spanning the whole viewport — center a wider column and
     constrain the tab bar to it, so the app reads as a real desktop layout
     rather than a stretched phone screen. Phone layout above is unchanged. */
  @media (min-width: 900px){
    /* Drop the viewport-height fill: on a wide screen the card should size to its
       content, not stretch to fill the window (that's what left the dead space
       below a short drill item or the Today plan block). */
    .wrap{max-width:640px;min-height:0}
    /* The tab bar no longer pins to the viewport bottom on desktop: a short card
       (a one-line Today plan, a single drill item) left 280–550px of bare
       background between the card and a fixed-position bar. Instead, flow it
       into the column right under the card, same width, so the page's height is
       just its content's height. Phone keeps the fixed bottom bar (nothing here
       touches the base .tabs rule). */
    body{padding-bottom:24px}
    .tabs{position:static;left:auto;right:auto;bottom:auto;transform:none;width:640px;max-width:100vw;margin:12px auto 0;padding-bottom:0;border:1px solid var(--line);border-radius:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="htitle">HSK pinyin</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="score" id="score"></span>
      <button class="themebtn" id="themebtn" aria-label="Toggle theme">◐</button>
    </div>
  </header>
  <div class="hdrbar" id="hdrbar"><i id="hdrbarfill"></i></div>
  <div id="panel" class="card"></div>
  <div id="live" aria-live="polite" class="sr-only"></div>
</div>
<nav class="tabs" id="tabs">
  <button data-t="today" class="on"><span class="ic">◷</span>Today</button>
  <button data-t="words"><span class="ic">字</span>Words</button>
  <button data-t="sounds"><span class="ic">〜</span>Sounds</button>
  <button data-t="test"><span class="ic">✓</span>Test</button>
  <button data-t="progress"><span class="ic">◔</span>Progress</button>
</nav>

retty well.", "lv": 2, "words": ["我", "的", "考试", "很", "不", "错"]}, {"zh": "你的手机在哪？", "py": "Nǐ de shǒujī zài nǎ?", "en": "Where's your phone?", "lv": 2, "words": ["你", "的", "手机", "在", "哪"]}, {"zh": "我的手机没有了。", "py": "Wǒ de shǒujī méi yǒu le.", "en": "My phone is gone.", "lv": 2, "words": ["我", "的", "手机", "没", "有", "了"]}, {"zh": "你的手表很漂亮。", "py": "Nǐ de shǒubiǎo hěn piàoliang.", "en": "Your watch is very pretty.", "lv": 2, "words": ["你", "的", "手表", "很", "漂亮"]}, {"zh": "我在看报纸。", "py": "Wǒ zài kàn bàozhǐ.", "en": "I'm reading the newspaper.", "lv": 2, "words": ["我", "在", "看", "报纸"]}, {"zh": "教室里有很多学生。", "py": "Jiàoshì lǐ yǒu hěn duō xuésheng.", "en": "There are many students in the classroom.", "lv": 2, "words": ["教室", "里", "有", "很", "多", "学生"]}, {"zh": "教室旁边是我的房间。", "py": "Jiàoshì pángbiān shì wǒ de fángjiān.", "en": "My room is next to the classroom.", "lv": 2, "words": ["教室", "旁边", "是", "我", "的", "房间"]}, {"zh": "房间里很大。", "py": "Fángjiān lǐ hěn dà.", "en": "The room is very big.", "lv": 2, "words": ["房间", "里", "很", "大"]}, {"zh": "你的房间在哪？", "py": "Nǐ de fángjiān zài nǎ?", "en": "Where's your room?", "lv": 2, "words": ["你", "的", "房间", "在", "哪"]}, {"zh": "我的房间在左边。", "py": "Wǒ de fángjiān zài zuǒbian.", "en": "My room is on the left.", "lv": 2, "words": ["我", "的", "房间", "在", "左边"]}, {"zh": "教室在右边。", "py": "Jiàoshì zài yòubian.", "en": "The classroom is on the right.", "lv": 2, "words": ["教室", "在", "右边"]}, {"zh": "机场离这很远。", "py": "Jīchǎng lí zhè hěn yuǎn.", "en": "The airport is far from here.", "lv": 2, "words": ["机场", "离", "这", "很", "远"]}, {"zh": "火车站离这很近。", "py": "Huǒchēzhàn lí zhè hěn jìn.", "en": "The train station is close to here.", "lv": 2, "words": ["火车站", "离", "这", "很", "近"]}, {"zh": "你怎么去机场？", "py": "Nǐ zěnme qù jīchǎng?", "en": "How do you get to the airport?", "lv": 2, "words": ["你", "怎么", "去", "机场"]}, {"zh": "我坐公共汽车去机场。", "py": "Wǒ zuò gōnggòngqìchē qù jīchǎng.", "en": "I take the bus to the airport.", "lv": 2, "words": ["我", "坐", "公共汽车", "去", "机场"]}, {"zh": What are you busy with?", "lv": 2, "words": ["你", "为", "什么", "事情", "忙"]}, {"zh": "我为考试的事情忙。", "py": "Wǒ wèi kǎoshì de shìqing máng.", "en": "I'm busy with things related to the exam.", "lv": 2, "words": ["我", "为", "考试", "的", "事情", "忙"]}, {"zh": "你可以帮助我吗？", "py": "Nǐ kěyǐ bāngzhù wǒ ma?", "en": "Can you help me?", "lv": 2, "words": ["你", "可以", "帮助", "我", "吗"]}, {"zh": "可以，我来帮助你。", "py": "Kěyǐ, wǒ lái bāngzhù nǐ.", "en": "Sure, I'll help you.", "lv": 2, "words": ["可以", "我", "来", "帮助", "你"]}, {"zh": "谢谢你的帮助。", "py": "Xièxie nǐ de bāngzhù.", "en": "Thanks for your help.", "lv": 2, "words": ["谢谢", "你", "的", "帮助"]}, {"zh": "你希望做什么工作？", "py": "Nǐ xīwàng zuò shénme gōngzuò?", "en": "What job do you hope to do?", "lv": 2, "words": ["你", "希望", "做", "什么", "工作"]}, {"zh": "我希望做医生。", "py": "Wǒ xīwàng zuò yīshēng.", "en": "I hope to become a doctor.", "lv": 2, "words": ["我", "希望", "做", "医生"]}, {"zh": "我希望你身体很好。", "py": "Wǒ xīwàng nǐ shēntǐ hěn hǎo.", "en": "I hope you're in good health.", "lv": 2, "words": ["我", "希望", "你", "身体", "很", "好"]}, {"zh": "我比你高兴。", "py": "Wǒ bǐ nǐ gāoxìng.", "en": "I'm happier than you.", "lv": 2, "words": ["我", "比", "你", "高兴"]}, {"zh": "你觉得哪个颜色漂亮？", "py": "Nǐ juéde nǎge yánsè piàoliang?", "en": "Which color do you think is pretty?", "lv": 2, "words": ["你", "觉得", "哪个", "颜色", "漂亮"]}, {"zh": "我觉得白颜色很漂亮。", "py": "Wǒ juéde bái yánsè hěn piàoliang.", "en": "I think white is very pretty.", "lv": 2, "words": ["我", "觉得", "白", "颜色", "很", "漂亮"]}, {"zh": "我喜欢红颜色，不喜欢黑颜色。", "py": "Wǒ xǐhuan hóng yánsè, bù xǐhuan hēi yánsè.", "en": "I like red, not black.", "lv": 2, "words": ["我", "喜欢", "红", "颜色", "不", "喜欢", "黑", "颜色"]}, {"zh": "她的眼睛很漂亮。", "py": "Tā de yǎnjing hěn piàoliang.", "en": "Her eyes are very pretty.", "lv": 2, "words": ["她", "的", "眼睛", "很", "漂亮"]}, {"zh": "她笑得很漂亮。", "py": "Tā xiào de hěn piàoliang.", "en": "She smiles beautifully.", "lv": 2, "words": ["她", "笑", "得", "很", "漂亮"]}, {"zh": "你笑什么？", "py": "Nǐ xiào shénme?", "en": "What are you laughing at?", "lv": 2, "words": ["你", "笑", "什么"]}, {"zh": "这个问题很好。", "py": "Zhège wèntí hěn hǎo.", "en": "This question is very good.", "lv": 2, "words": ["这个", "问题", "很", "好"]}, {"zh": "我不懂这个问题。", "py": "Wǒ bù dǒng zhège wèntí.", "en": "I don't understand this question.", "lv": 2, "words": ["我", "不", "懂", "这个", "问题"]}, {"zh": "你懂我的意思吗？", "py": "Nǐ dǒng wǒ de yìsi ma?", "en": "Do you understand what I mean?", "lv": 2, "words": ["你", "懂", "我", "的", "意思", "吗"]}, {"zh": "我懂你的意思。", "py": "Wǒ dǒng nǐ de yìsi.", "en": "I understand what you mean.", "lv": 2, "words": ["我", "懂", "你", "的", "意思"]}, {"zh": "请你再说话。", "py": "Qǐng nǐ zài shuōhuà.", "en": "Please speak again.", "lv": 2, "words": ["请", "你", "再", "说话"]}, {"zh": "我们再说话吧。", "py": "Wǒmen zài shuōhuà ba.", "en": "Let's talk again.", "lv": 2, "words": ["我们", "再", "说话", "吧"]}, {"zh": "服务员，请给我牛奶。", "py": "Fúwùyuán, qǐng gěi wǒ niúnǎi.", "en": "Waiter, please give me some milk.", "lv": 2, "words": ["服务员", "请", "给", "我", "牛奶"]}, {"zh": "欢迎你来我家。", "py": "Huānyíng nǐ lái wǒ jiā.", "en": "Welcome to my home.", "lv": 2, "words": ["欢迎", "你", "来", "我", "家"]}, {"zh": "欢迎大家来这个公司。", "py": "Huānyíng dàjiā lái zhège gōngsī.", "en": "Welcome everyone to this company.", "lv": 2, "words": ["欢迎", "大家", "来", "这个", "公司"]}, {"zh": "大家好，我是新老师。", "py": "Dàjiā hǎo, wǒ shì xīn lǎoshī.", "en": "Hello everyone, I'm the new teacher.", "lv": 2, "words": ["大家", "好", "我", "是", "新", "老师"]}, {"zh": "大家都喜欢这个老师。", "py": "Dàjiā dōu xǐhuan zhège lǎoshī.", "en": "Everyone likes this teacher.", "lv": 2, "words": ["大家", "都", "喜欢", "这个", "老师"]}, {"zh": "我觉得这本书不错。", "py": "Wǒ juéde zhè běn shū bù cuò.", "en": "I think this book isn't bad.", "lv": 2, "words": ["我", "觉得", "这", "本", "书", "不", "错"]}, {"zh": "你的课是几点？", "py": "Nǐ de kè shì jǐ diǎn?", "en": "What time is your class?", "lv": 2, "words": ["你", "的", "课", "是", "几", "点"]}, {"zh": "我的课是下午两点。", "py": "Wǒ de kè shì xiàwǔ liǎng diǎn.", "en": "My class is at two in the afternoon.", "lv": 2, "words": ["我", "的", "课", "是", "下午", "两",  "空调"]}, {"zh": "现在是冬天，天气很冷，我不太喜欢。", "py": "Xiànzài shì dōngtiān, tiānqì hěn lěng, wǒ bù tài xǐhuan.", "en": "It's winter now, the weather is cold, I don't like it much.", "lv": 3, "words": ["现在", "是", "冬天", "天气", "很", "冷", "我", "不", "太", "喜欢"]}, {"zh": "现在是春天，花很漂亮。", "py": "Xiànzài shì chūntiān, huā hěn piàoliang.", "en": "It's spring now, the flowers are very pretty.", "lv": 3, "words": ["现在", "是", "春天", "花", "很", "漂亮"]}, {"zh": "现在是秋天，天气很好。", "py": "Xiànzài shì qiūtiān, tiānqì hěn hǎo.", "en": "It's autumn now, the weather is nice.", "lv": 3, "words": ["现在", "是", "秋天", "天气", "很", "好"]}, {"zh": "这个季节很舒服。", "py": "Zhège jìjié hěn shūfu.", "en": "This season is very comfortable.", "lv": 3, "words": ["这个", "季节", "很", "舒服"]}, {"zh": "你最喜欢哪个季节？", "py": "Nǐ zuì xǐhuan nǎge jìjié?", "en": "Which season do you like best?", "lv": 3, "words": ["你", "最", "喜欢", "哪个", "季节"]}, {"zh": "我最喜欢春天，因为天气不冷也不热。", "py": "Wǒ zuì xǐhuan chūntiān, yīnwèi tiānqì bù lěng yě bù rè.", "en": "I like spring best because it's not cold or hot.", "lv": 3, "words": ["我", "最", "喜欢", "春天", "因为", "天气", "不", "冷", "也", "不", "热"]}, {"zh": "太阳出来了，天气真好。", "py": "Tàiyang chū lái le, tiānqì zhēn hǎo.", "en": "The sun is out, the weather is really nice.", "lv": 3, "words": ["太阳", "出", "来", "了", "天气", "真", "好"]}, {"zh": "月亮今天晚上很漂亮。", "py": "Yuèliang jīntiān wǎnshang hěn piàoliang.", "en": "The moon is very pretty tonight.", "lv": 3, "words": ["月亮", "今天", "晚上", "很", "漂亮"]}, {"zh": "今天很冷，一定要下雪了。", "py": "Jīntiān hěn lěng, yīdìng yào xià xuě le.", "en": "It's very cold today, it's definitely going to snow.", "lv": 3, "words": ["今天", "很", "冷", "一定", "要", "下", "雪", "了"]}, {"zh": "今天阴了，一定要下雨了。", "py": "Jīntiān yīn le, yīdìng yào xiàyǔ le.", "en": "It has turned cloudy today, it's definitely going to rain.", "lv": 3, "words": ["今天", "阴", "了", "一定", "要", "下雨", "了"]}, {"zh": "我对音乐很有兴趣。", "py": "Wǒ duì yīnyuè hěn yǒu xìngqù.", "en": "I'm very interested in music.", "lv": 4, "words": ["我", "对", "音乐", "很", "有", "兴趣"]}, {"zh": "我对历史很有兴趣。", "py": "Wǒ duì lìshǐ hěn yǒu xìngqù.", "en": "I'm very interested in history.", "lv": 4, "words": ["我", "对", "历史", "很", "有", "兴趣"]}, {"zh": "他对这件事情不太有兴趣。", "py": "Tā duì zhè jiàn shìqing bù tài yǒu xìngqù.", "en": "He's not too interested in this matter.", "lv": 4, "words": ["他", "对", "这", "件", "事情", "不", "太", "有", "兴趣"]}, {"zh": "我们应该保护环境。", "py": "Wǒmen yīnggāi bǎohù huánjìng.", "en": "We should protect the environment.", "lv": 4, "words": ["我们", "应该", "保护", "环境"]}, {"zh": "这个计划很重要，我们必须准时完成。", "py": "Zhège jìhuà hěn zhòngyào, wǒmen bìxū zhǔnshí wánchéng.", "en": "This plan is important, we must finish it on time.", "lv": 4, "words": ["这个", "计划", "很", "重要", "我们", "必须", "准时", "完成"]}, {"zh": "飞机马上就要起飞了，请坐好。", "py": "Fēijī mǎshàng jiù yào qǐfēi le, qǐng zuò hǎo.", "en": "The plane is about to take off, please sit down.", "lv": 4, "words": ["飞机", "马上", "就", "要", "起飞", "了", "请", "坐", "好"]}, {"zh": "我们这次参加了比赛，很成功。", "py": "Wǒmen zhè cì cānjiā le bǐsài, hěn chénggōng.", "en": "We took part in the competition this time, quite successfully.", "lv": 4, "words": ["我们", "这", "次", "参加", "了", "比赛", "很", "成功"]}, {"zh": "虽然下雨，我们却还去爬山了。", "py": "Suīrán xiàyǔ, wǒmen què hái qù páshān le.", "en": "Although it rained, we still went to climb the mountain.", "lv": 4, "words": ["虽然", "下雨", "我们", "却", "还", "去", "爬山", "了"]}, {"zh": "尽管很累，他还是坚持工作。", "py": "Jǐnguǎn hěn lèi, tā hái shì jiānchí gōngzuò.", "en": "Although he was tired, he still kept working.", "lv": 4, "words": ["尽管", "很", "累", "他", "还", "是", "坚持", "工作"]}, {"zh": "即使下雨，我们也要去。", "py": "Jíshǐ xiàyǔ, wǒmen yě yào qù.", "en": "Even if it rains, we still have to go.", "lv": 4, "words": ["即使", "下雨", "我们", "也", "要", "去"]}, {"zh": "无论天气怎么样，我们都要出发。", "py": "Wúlùn tiānqì zěnmeyàng, wǒmen dōu yào chūfā.", "en": "No matter the weather, we have to set out.", "lv": 4, "words": ["无论", "天气", "怎么样", "我们", "都", "要", "出发"]}, {"zh": "只要你努力，就一定能成功。", "py": "Zhǐyào nǐ nǔlì, jiù yīdìng néng chénggōng.", "en": "As long as you work hard, you'll definitely succeed.", "lv": 4, "words": ["只要", "你", "努力", "就", "一定", "能", "成功"]}, {"zh": "不但他会说话，而且他很会唱歌。", "py": "Bùdàn tā huì shuōhuà, érqiě tā hěn huì chànggē.", "en": "Not only can he talk well, he can also sing well.", "lv": 4, "words": ["不但", "他", "会", "说话", "而且", "他", "很", "会", "唱歌"]}, {"zh": "不仅我喜欢，而且我的朋友也喜欢。", "py": "Bùjǐn wǒ xǐhuan, érqiě wǒ de péngyou yě xǐhuan.", "en": "Not only do I like it, my friend does too.", "lv": 4, "words": ["不仅", "我", "喜欢", "而且", "我", "的", "朋友", "也", "喜欢"]}, {"zh": "由于堵车，我迟到了。", "py": "Yóuyú dǔchē, wǒ chídào le.", "en": "Because of the traffic jam, I was late.", "lv": 4, "words": ["由于", "堵车", "我", "迟到", "了"]}, {"zh": "随着时间过去，我们越来越了解。", "py": "Suízhe shíjiān guòqù, wǒmen yuè lái yuè liǎojiě.", "en": "As time passes, we understand each other more and more.", "lv": 4, "words": ["随着", "时间", "过去", "我们", "越", "来", "越", "了解"]}, {"zh": "随着时间过去，天气越来越冷了。", "py": "Suízhe shíjiān guòqù, tiānqì yuè lái yuè lěng le.", "en": "As time passes, the weather is getting colder and colder.", "lv": 4, "words": ["随着", "时间", "过去", "天气", "越", "来", "越", "冷", "了"]}, {"zh": "他的汉语越来越流利了。", "py": "Tā de Hànyǔ yuè lái yuè liúlì le.", "en": "His Chinese is getting more and more fluent.", "lv": 4, "words": ["他", "的", "汉语", "越", "来", "越", "流利", "了"]}, {"zh": "其实我不太了解这个情况。", "py": "Qíshí wǒ bù tài liǎojiě zhège qíngkuàng.", "en": "Actually I don't understand this situation very well.", "lv": 4, "words": ["其实", "我", "不", "太", "了解", "这个", "情况"]}, {"zh": "其他人都同意这个看法。", "py": "Qítā rén dōu tóngyì zhège kànfǎ.", "en": "Everyone else agrees with this view.", "lv": 4, "words": ["其他", "人", "都", "同意", "这个", "看法"]}, {"zh": "你的看法跟我的不一样。", "py": "Nǐ de kànfǎ gēn wǒ de bù yīyàng.", "en": "Your view is different from mine.", "lv": 4, "words": ["你", "的", "看法", "跟", "我", "的", "不", "一样"]}, {"zh": "我对这件事情的看法跟你一样。", "py": "Wǒ duì zhè jiàn shìqing de kànfǎ gēn nǐ yīyàng.", "en": "My view on this matter is the same as yours.", "lv": 4, "words": ["我", "对", "这", "件", "事情", "的", "看法", "跟", "你", "一样"]}, {"zh": "我不知道原因是什么。", "py": "Wǒ bù zhīdào yuányīn shì shénme.", "en": "I don't know what the reason is.", "lv": 4, "words": ["我", "不", "知道", "原因", "是", "什么"]}, {"zh": "请你告诉我原因。", "py": "Qǐng nǐ gàosu wǒ yuányīn.", "en": "Please tell me the reason.", "lv": 4, "words": ["请", "你", "告诉", "我", "原因"]}, {"zh": "原谅我，我不是故意的。", "py": "Yuánliàng wǒ, wǒ bù shì gùyì de.", "en": "Forgive me, I didn't do it on purpose.", "lv": 4, "words": ["原谅", "我", "我", "不", "是", "故意", "的"]}, {"zh": "对不起，请原谅我的误会。", "py": "Duìbuqǐ, qǐng yuánliàng wǒ de wùhuì.", "en": "Sorry, please forgive my misunderstanding.", "lv": 4, "words": ["对不起", "请", "原谅", "我", "的", "误会"]}, {"zh": "我估计他不会来了。", "py": "Wǒ gūjì tā bù huì lái le.", "en": "I guess he won't come.", "lv": 4, "words": ["我", "估计", "他", "不", "会", "来", "了"]}, {"zh": "我估计明天会下雨。", "py": "Wǒ gūjì míngtiān huì xiàyǔ.", "en": "I estimate it will rain tomorrow.", "lv": 4, "words": ["我", "估计", "明天", "会", "下雨"]}, {"zh": "你的态度应该更积极一些。", "py": "Nǐ de tàidu yīnggāi gèng jījí yī xiē.", "en": "Your attitude should be more positive.", "lv": 4, "words": ["你", "的", "态度", "应该", "更", "积极", "一", "些"]}, {"zh": "他做事情很积极，大家都很尊重他。", "py": "Tā zuò shìqing hěn jījí, dàjiā dōu hěn zūnzhòng tā.", "en": "He does things very proactively, everyone respects him.", "lv": 4, "words": ["他", "做", "事情", "很", "积极", "大家", "都", "很", "尊重", "他"]}, {"zh": "我放弃了这个机会，有点后悔。", "py": "Wǒ fàngqì le zhège jīhuì, yǒu diǎn hòuhuǐ.", "en": "I gave up this opportunity, I regret it a little.", "lv": 4, "words": ["我", "放弃", "了", "这个", "机会", "有", "点", "后悔"]}, {"zh": "你别放弃，再试一次。", "py": "Nǐ bié fàngqì, zài shì yī cì.", "en": "Don't give up, try once more.", "lv": 4, "words": ["你", "别", "放弃", "再", "试", "一", "次"]}, {"zh": "你放心，我保证会照顾好孩子。", "py": "Nǐ fàngxīn, wǒ bǎozhèng huì zhàogu hǎo háizi.", "en": "Don't worry, I promise I'll take good care of the child.", "lv": 4, "words": ["你", "放心", "我", "保证", "会", "照顾", "好", "孩子"]}, {"zh": "你放心吧，一切都会顺利的。", "py": "Nǐ fàngxīn ba, yīqiè dōu huì shùnlì de.", "en": "Don't worry, everything will go smoothly.", "lv": 4, "words": ["你", "放心", "吧", "一切", "都", "会", "顺利", "的"]}, {"zh": "放暑假的时候，我打算去旅游。", "py": "Fàngshǔjià de shíhou, wǒ dǎsuàn qù lǚyóu.", "en": "During summer vacation, I plan to travel.", "lv": 4, "words": ["放暑假", "的", "时候", "我", "打算", "去", "旅游"]}, {"zh": "老师，我想请假，我有点咳嗽。", "py": "Lǎoshī, wǒ xiǎng qǐngjià, wǒ yǒu diǎn késou.", "en": "Teacher, I want to ask for leave, I have a bit of a cough.", "lv": 4, "words": ["老师", "我", "想", "请假", "我", "有", "点", "咳嗽"]}, {"zh": "他感冒了，还一直咳嗽。", "py": "Tā gǎnmào le, hái yīzhí késou.", "en": "He has a cold and keeps coughing.", "lv": 4, "words": ["他", "感冒", "了", "还", "一直", "咳嗽"]}, {"zh": "今天是我的生日，我想请客。", "py": "Jīntiān shì wǒ de shēngrì, wǒ xiǎng qǐngkè.", "en": "Today's my birthday, I want to treat everyone.", "lv": 4, "words": ["今天", "是", "我", "的", "生日", "我", "想", "请客"]}, {"zh": "这次我请客。", "py": "Zhè cì wǒ qǐngkè.", "en": "This time it's my treat.", "lv": 4, "words": ["这", "次", "我", "请客"]}, {"zh": "这本书很值得一读。", "py": "Zhè běn shū hěn zhíde yī dú.", "en": "This book is worth reading.", "lv": 4, "words": ["这", "本", "书", "很", "值得", "一", "读"]}, {"zh": "这个经验很值得学习。", "py": "Zhège jīngyàn hěn zhíde xuéxí.", "en": "This experience is worth learning from.", "lv": 4, "words": ["这个", "经验", "很", "值得", "学习"]}, {"zh": "原来你住在这里啊。", "py": "Yuánlái nǐ zhù zài zhèlǐ a.", "en": "Oh, so you live here.", "lv": 4, "words": ["原来", "你", "住", "在", "这里", "啊"]}, {"zh": "原来是你啊！", "py": "Yuánlái shì nǐ a!", "en": "Oh, so it's you!", "lv": 4, "words": ["原来", "是", "你", "啊"]}, {"zh": "这个人的能力很厉害。", "py": "Zhège rén de nénglì hěn lìhai.", "en": "This person's ability is impressive.", "lv": 4, "words": ["这个", "人", "的", "能力", "很", "厉害"]}, {"zh": "他的汉语水平真厉害。", "py": "Tā de Hànyǔ shuǐpíng zhēn lìhai.", "en": "His Chinese level is really impressive.", "lv": 4, "words": ["他", "的", "汉语", "水平", "真", "厉害"]}, {"zh": "我们应该互相帮助，互相关心。", "py": "Wǒmen yīnggāi hùxiāng bāngzhù, hùxiāng guānxīn.", "en": "We should help and na's most important holiday.", "lv": 3, "words": ["这", "是", "中国", "最", "重要", "的", "节日"]}, {"zh": "这个节目很有意思。", "py": "Zhège jiémù hěn yǒu yìsi.", "en": "This show is very interesting.", "lv": 3, "words": ["这个", "节目", "很", "有", "意思"]}, {"zh": "公园里有很多草和花。", "py": "Gōngyuán lǐ yǒu hěn duō cǎo hé huā.", "en": "There's a lot of grass and flowers in the park.", "lv": 3, "words": ["公园", "里", "有", "很", "多", "草", "和", "花"]}, {"zh": "这个颜色很蓝，很漂亮。", "py": "Zhège yánsè hěn lán, hěn piàoliang.", "en": "This color is very blue, very pretty.", "lv": 3, "words": ["这个", "颜色", "很", "蓝", "很", "漂亮"]}, {"zh": "我的行李箱很大。", "py": "Wǒ de xínglixiāng hěn dà.", "en": "My suitcase is very big.", "lv": 3, "words": ["我", "的", "行李箱", "很", "大"]}, {"zh": "她没说话，只是笑了一下，表示同意。", "py": "Tā méi shuōhuà, zhǐ shì xiào le yī xià, biǎoshì tóngyì.", "en": "She didn't speak, just smiled a bit, showing agreement.", "lv": 3, "words": ["她", "没", "说话", "只", "是", "笑", "了", "一", "下", "表示", "同意"]}, {"zh": "他穿着一件白衬衫。", "py": "Tā chuān zhe yī jiàn bái chènshān.", "en": "He's wearing a white shirt.", "lv": 3, "words": ["他", "穿", "着", "一", "件", "白", "衬衫"]}, {"zh": "她穿着一条裙子。", "py": "Tā chuān zhe yī tiáo qúnzi.", "en": "She's wearing a skirt.", "lv": 3, "words": ["她", "穿", "着", "一", "条", "裙子"]}, {"zh": "我的裤子有点小了。", "py": "Wǒ de kùzi yǒu diǎn xiǎo le.", "en": "My pants are a bit small.", "lv": 3, "words": ["我", "的", "裤子", "有", "点", "小", "了"]}, {"zh": "你要去哪个方向？", "py": "Nǐ yào qù nǎge fāngxiàng?", "en": "Which direction do you want to go?", "lv": 4, "words": ["你", "要", "去", "哪个", "方向"]}, {"zh": "我们明天八点见面。", "py": "Wǒmen míngtiān bā diǎn jiànmiàn.", "en": "We're meeting tomorrow at eight.", "lv": 3, "words": ["我们", "明天", "八", "点", "见面"]}, {"zh": "这个问题有两个部分。", "py": "Zhège wèntí yǒu liǎng gè bùfen.", "en": "This problem has two parts.", "lv": 4, "words": ["这个", "问题", "有", "两", "个", "部分"]}, {"zh": "我认为这个办法不错。", "py": "Wǒ rènwéi zhège bànfǎ bù cuò.", "en": "I think this method isn't bad.", "lv": 3, "words": ["我", "认为", "这个", "办法", "不", "错"]}, {"zh": "请你讲一个故事。", "py": "Qǐng nǐ jiǎng yī gè gùshi.", "en": "Please tell a story.", "lv": 3, "words": ["请", "你", "讲", "一", "个", "故事"]}, {"zh": "这辆自行车是新的。", "py": "Zhè liàng zìxíngchē shì xīn de.", "en": "This bicycle is new.", "lv": 3, "words": ["这", "辆", "自行车", "是", "新", "的"]}, {"zh": "你去还是不去？", "py": "Nǐ qù háishi bù qù?", "en": "Are you going or not?", "lv": 3, "words": ["你", "去", "还是", "不", "去"]}, {"zh": "请给我铅笔。", "py": "Qǐng gěi wǒ qiānbǐ.", "en": "Please give me a pencil.", "lv": 3, "words": ["请", "给", "我", "铅笔"]}, {"zh": "除了他，大家都来了。", "py": "Chúle tā, dàjiā dōu lái le.", "en": "Except for him, everyone came.", "lv": 3, "words": ["除了", "他", "大家", "都", "来", "了"]}, {"zh": "这双鞋很漂亮。", "py": "Zhè shuāng xié hěn piàoliang.", "en": "These shoes are very pretty.", "lv": 3, "words": ["这", "双", "鞋", "很", "漂亮"]}, {"zh": "他喜欢骑自行车上班。", "py": "Tā xǐhuan qí zìxíngchē shàngbān.", "en": "He likes riding a bicycle to work.", "lv": 3, "words": ["他", "喜欢", "骑", "自行车", "上班"]}, {"zh": "我不得不接受这个结果。", "py": "Wǒ bù de bù jiēshòu zhège jiéguǒ.", "en": "I have no choice but to accept this result.", "lv": 4, "words": ["我", "不", "得", "不", "接受", "这个", "结果"]}, {"zh": "不管天气怎么样，我们都要出发。", "py": "Bùguǎn tiānqì zěnmeyàng, wǒmen dōu yào chūfā.", "en": "No matter the weather, we have to set out.", "lv": 4, "words": ["不管", "天气", "怎么样", "我们", "都", "要", "出发"]}, {"zh": "这个字不过是一个小问题。", "py": "Zhège zì bùguò shì yī gè xiǎo wèntí.", "en": "This character is just a small issue.", "lv": 4, "words": ["这个", "字", "不过", "是", "一", "个", "小", "问题"]}, {"zh": "我与他是好朋友。", "py": "Wǒ yǔ tā shì hǎo péngyou.", "en": "I am good friends with him.", "lv": 4, "words": ["我", "与", "他", "是", "好", "朋友"]}, {"zh": "她是一位专业的医生。", "py": "Tā shì yī wèi zhuānyè de yīshēng.", "en": "She's a professional doctor.", "lv": 4, "words": ["她", "是", "一", "位", "专业", "的", "医生"]}, {"zh": "这是我专门为你准备的礼物。", "py": "Zhè shì wǒ zhuānmén wèi nǐ zhǔnbèi de lǐwù.", "en": "This gift is specially prepared for you.", "lv": 4, "words": ["这", "是", "我", "专门", "为", "你", "准备", "的", "礼物"]}, {"zh": "这是一个新的世纪。", "py": "Zhè shì yī gè xīn de shìjì.", "en": "This is a new century.", "lv": 4, "words": ["这", "是", "一", "个", "新", "的", "世纪"]}, {"zh": "他把钥匙丢了。", "py": "Tā bǎ yàoshi diū le.", "en": "He lost his key.", "lv": 4, "words": ["他", "把", "钥匙", "丢", "了"]}, {"zh": "这个问题很严重。", "py": "Zhège wèntí hěn yánzhòng.", "en": "This problem is very serious.", "lv": 4, "words": ["这个", "问题", "很", "严重"]}, {"zh": "他的个子很高。", "py": "Tā de gèzi hěn gāo.", "en": "He's quite tall.", "lv": 4, "words": ["他", "的", "个子", "很", "高"]}, {"zh": "我在学习中文。", "py": "Wǒ zài xuéxí Zhōngwén.", "en": "I'm studying Chinese.", "lv": 4, "words": ["我", "在", "学习", "中文"]}, {"zh": "他很主动地帮助我们。", "py": "Tā hěn zhǔdòng de bāngzhù wǒmen.", "en": "He proactively helped us.", "lv": 4, "words": ["他", "很", "主动", "地", "帮助", "我们"]}, {"zh": "这是我的主意。", "py": "Zhè shì wǒ de zhǔyi.", "en": "This was my idea.", "lv": 4, "words": ["这", "是", "我", "的", "主意"]}, {"zh": "学校举办了一次比赛。", "py": "Xuéxiào jǔbàn le yī cì bǐsài.", "en": "The school held a competition.", "lv": 4, "words": ["学校", "举办", "了", "一", "次", "比赛"]}, {"zh": "他喜欢羽毛球。", "py": "Tā xǐhuan yǔmáoqiú.", "en": "He likes badminton.", "lv": 4, "words": ["他", "喜欢", "羽毛球"]}, {"zh": "我们乘坐飞机去北京。", "py": "Wǒmen chéngzuò fēijī qù Běijīng.", "en": "We take a plane to Beijing.", "lv": 4, "words": ["我们", "乘坐", "飞机", "去", "北京"]}, {"zh": "也许他明天会来。", "py": "Yěxǔ tā míngtiān huì lái.", "en": "Maybe he'll come tomorrow.", "lv": 4, "words": ["也许", "他", "明天", "会", "来"]}, {"zh": "于是我们就出发了。", "py": "Yúshì wǒmen jiù chūfā le.", "en": "So we set out.", "lv": 4, "words": ["于是", "我们", "就", "出发", "了"]}, {"zh": "他去过亚洲很多国家。", "py": "Tā qù guò Yàzhōu hěn duō guójiā.", "en": "He's been to many countries in Asia.", "lv": 4, "words": ["他", "去", "过", "亚洲", "很", "多", "国家"]}, {"zh": "她喜欢看京剧。", "py": "Tā xǐhuan kàn Jīngjù.", "en": "She likes watching Peking opera.", "lv": 4, "words": ["她", "喜欢", "看", "京剧"]}, {"zh": "月亮今天很亮。", "py": "Yuèliang jīntiān hěn lià   const arr = TONE_CHARS[baseLetter];
  if(!arr) return baseLetter;
  if(!tone || tone===0 || tone===5) return baseLetter;
  return arr[tone] || baseLetter;
}

// Standard placement rule: a > e > o > last of i/u/ü.
function markVowelIndex(letters){
  const lower = letters.toLowerCase();
  let idx = lower.indexOf("a"); if(idx>=0) return idx;
  idx = lower.indexOf("e"); if(idx>=0) return idx;
  idx = lower.indexOf("o"); if(idx>=0) return idx;
  for(let i=lower.length-1;i>=0;i--){ if("iuü".indexOf(lower[i])>=0) return i; }
  return -1;
}

function markSyllable(letters, tone){
  const idx = markVowelIndex(letters);
  if(idx<0) return letters;
  const ch = letters[idx];
  const base = BASE_OF[ch.toLowerCase()] || ch.toLowerCase();
  const marked = toneMarkChar(base, +tone);
  const isUpper = ch === ch.toUpperCase() && ch !== ch.toLowerCase();
  const out = isUpper ? marked.toUpperCase() : marked;
  return letters.slice(0,idx) + out + letters.slice(idx+1);
}

// ------------------------------------------------------------- syllable split
const SYLL_RE = /[a-zA-Zü]+[0-5]/g;
function syll(n){ return String(n).match(SYLL_RE) || []; }
function tones(n){ return syll(n).map(s=>s.slice(-1)).join("-"); }
function startsAOE(chunk){ return /^[aeoüAEOÜ]/.test(chunk); }

function markOne(chunk){ return markSyllable(chunk.slice(0,-1), chunk.slice(-1)); }

// numbered -> marked, with the a/o/e syllable-boundary apostrophe rule (Xi'an, nǚ'ér)
function mark(n){
  const chunks = syll(n);
  let out = "";
  chunks.forEach((c,i)=>{
    if(i>0 && startsAOE(c)) out += "'";
    out += markOne(c);
  });
  return out;
}

function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

// Render-time guard: an `en` gloss should never contain a Chinese character (the
// data pipeline's sanitize_gloss in tools/build_vocab.py handles this at the
// source), but every render site that shows a word's meaning goes through this one
// function, so a future data regression can't leak a character past the "show
// characters" toggle the way a handful of un-sanitized glosses did before.
const CJK_TEST_RE = /[一-鿿㐀-䶿]/;
function gloss(entry){
  const en = String((entry && entry.en) || "");
  if(!CJK_TEST_RE.test(en)) return en;
  return en.replace(/[一-鿿㐀-䶿]+/g, "").replace(/\s+/g, " ").replace(/\(\s*\)/g, "").trim();
}

// tone-coloured pinyin renderer: each syllable in <span class="t1".."t5">
function pyHTML(n){
  const chunks = syll(n);
  let out = "";
  chunks.forEach((c,i)=>{
    const tone = +c.slice(-1) || 5;
    if(i>0 && startsAOE(c)) out += "'";
    out += `<span class="t${tone}">${escapeHtml(markOne(c))}</span>`;
  });
  return out;
}

// marked pinyin -> toneless (keeps apostrophes/case/ü, only strips tone diacritics)
function strip(py){
  let out = "";
  for(const ch of String(py)){
    const lower = ch.toLowerCase();
    if(BASE_OF[lower] !== undefined){
      const base = BASE_OF[lower];
      const isUpper = ch === ch.toUpperCase() && ch !== ch.toLowerCase();
      out += isUpper ? base.toUpperCase() : base;
    } else out += ch;
  }
  return out;
}

// ------------------------------------------------------- valid syllable table
// Standard Mandarin initial x final grid, spelled as actually written
// (zero-initial uses y/w forms; j/q/x drop the ü dots).
const INITIAL_FINALS = {
  "b": ["a","ai","an","ang","ao","o","ei","en","eng","i","ie","iao","ian","in","iang","ing","u"],
  "p": ["a","ai","an","ang","ao","o","ei","en","eng","ou","i","ie","iao","ian","in","iang","ing","u"],
  "m": ["a","ai","an","ang","ao","o","ei","en","eng","ou","i","ie","iao","iu","ian","in","iang","ing","u"],
  "f": ["a","an","ang","ei","en","eng","ou","u","o"],
  "d": ["a","ai","an","ang","ao","e","ei","en","eng","ong","i","ia","ie","iao","iu","ian","ing","ou","u","uo","ui","uan","un"],
  "t": ["a","ai","an","ang","ao","e","eng","ong","i","ian","iao","ie","ing","ou","u","uo","ui","uan","un"],
  "n": ["a","ai","an","ang","ao","e","ei","en","eng","i","ian","iang","iao","ie","in","ing","iu","ong","ou","u","uan","uo","ü","üe"],
  "l": ["a","ai","an","ang","ao","e","ei","eng","i","ia","ian","iang","iao","ie","in","ing","iu","ong","ou","u","uan","un","uo","ü","üe","o"],
  "g": ["a","ai","an","ang","ao","e","ei","en","eng","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "k": ["a","ai","an","ang","ao","e","ei","en","eng","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "h": ["a","ai","an","ang","ao","e","ei","en","eng","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "j": ["i","ia","ian","iang","iao","ie","in","ing","iong","iu","u","uan","ue","un"],
  "q": ["i","ia","ian","iang","iao","ie","in","ing","iong","iu","u","uan","ue","un"],
  "x": ["i","ia","ian","iang","iao","ie","in","ing","iong","iu","u","uan","ue","un"],
  "zh":["a","ai","an","ang","ao","e","ei","en","eng","i","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "ch":["a","ai","an","ang","ao","e","en","eng","i","ong","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "sh":["a","ai","an","ang","ao","e","ei","en","eng","i","ou","u","ua","uai","uan","uang","ui","un","uo"],
  "r": ["an","ang","ao","e","en","eng","i","ong","ou","u","ua","uan","ui","un","uo"],
  "z": ["a","ai","an","ang","ao","e","ei","en","eng","i","ong","ou","u","uan","ui","un","uo"],
  "c": ["a","ai","an","ang","ao","e","en","eng","i","ong","ou","u","uan","ui","un","uo"],
  "s": ["a","ai","an","ang","ao","e","en","eng","i","ong","ou","u","uan","ui","un","uo"],
  "": ["a","o","e","ai","ei","ao","ou","an","en","ang","eng","er",
       "yi","ya","ye","yao","you","yan","yin","yang","ying","yong",
       "wu","wa","wo","wai","wei","wan","wen","wang","weng",
       "yu","yue","yuan","yun","yo"]
};
const INITIALS_BY_LEN = Object.keys(INITIAL_FINALS).filter(k=>k).sort((a,b)=>b.length-a.length);

const VALID_SYLLABLES = new Set();
Object.keys(INITIAL_FINALS).forEach(init=>{
  INITIAL_FINALS[init].forEach(fin=>VALID_SYLLABLES.add(init+fin));
});

function splitSyllable(toneless){
  const s = toneless.toLowerCase();
  for(const init of INITIALS_BY_LEN){
    if(s.indexOf(init)===0){
      const rest = s.slice(init.length);
      if(INITIAL_FINALS[init].indexOf(rest)>=0) return {initial:init, final:rest};
    }
  }
  if(INITIAL_FINALS[""].indexOf(s)>=0) return {initial:"", final:s};
  return null;
}

// ------------------------------------------------------------- type checking
function pipeline(s){
  return String(s).toLowerCase()
    .replace(/u:/g,"v")
    .replace(/ü/g,"v")
    .replace(/['\-\s]/g,"");
}

// all numbered forms a learner might legitimately type: the exact number
// string, plus neutral tone (digit "5") written as "0" or omitted per syllable.
function numberedCandidates(n){
  const chunks = syll(n);
  const perChunk = chunks.map(c=>{
    const letters = c.slice(0,-1), digit = c.slice(-1);
    return digit==="5" ? [letters+"5", letters+"0", letters] : [c];
  });
  let combos = [""];
  perChunk.forEach(opts=>{
    const next = [];
    combos.forEach(prefix=>opts.forEach(o=>next.push(prefix+o)));
    combos = next;
  });
  return combos.map(pipeline);
}

function normType(input){ return pipeline(input); }

function acceptTypeAnswer(input, entry){
  const target = new Set(numberedCandidates(entry.n));
  target.add(pipeline(entry.py));
  return target.has(normType(input));
}

// ------------------------------------------------------------- distractors
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const INITIAL_PAIRS = [["b","p"],["d","t"],["g","k"],["j","q"],["zh","ch"],["z","c"],["zh","z"],["ch","c"],["sh","s"],["j","zh"],["q","ch"],["x","sh"],["n","l"],["r","l"],["f","h"]];
const FINAL_PAIRS = [["an","ang"],["en","eng"],["in","ing"],["ian","iang"],["uan","uang"],["ao","ou"],["ai","ei"],["e","o"]];

function confusablesFor(list, item){
  const out = [];
  list.forEach(p=>{ if(p[0]===item) out.push(p[1]); if(p[1]===item) out.push(p[0]); });
  return out;
}

// entry: {n,...}; pool: VOCAB array (for the same-syllable-count fallback).
function distractors(entry, pool){
  const chunks = syll(entry.n);
  const results = [];
  const seen = new Set([pipeline(entry.n)]);

  function tryAdd(candChunks){
    if(results.length>=3) return;
    const candN = candChunks.join("");
    const key = pipeline(candN);
    if(seen.has(key)) return;
    const ok = candChunks.every(c=>{
      const letters = c.slice(0,-1).toLowerCase();
      // A chunk whose letters are exactly "r" (e.g. the last syllable of yi4hui4r5,
      // 一会儿) is the retroflex erhua suffix on the preceding syllable, not a
      // standalone syllable — it will never appear in VALID_SYLLABLES, so it's
      // exempted from that check here rather than always sitting at the end.
      return letters==="r" || VALID_SYLLABLES.has(letters);
    });
    if(!ok) return;
    seen.add(key);
    results.push({n:candN, py:mark(candN)});
  }

  // 1. same syllables, one tone changed
  for(let i=0;i<chunks.length && results.length<3;i++){
    const letters = chunks[i].slice(0,-1), origTone = chunks[i].slice(-1);
    // neutral tone (5) never occurs on the first syllable of a word in real Mandarin,
    // so it's a trivially-eliminable distractor there — exclude it.
    const toneChoices = ["1","2","3","4","5"].filter(t=>t!==origTone && !(i===0 && t==="5"));
    shuffle(toneChoices).forEach(t=>{
      if(results.length<3) tryAdd(chunks.map((c,j)=>j===i?letters+t:c));
    });
  }
  // 2. confusable initial swap
  for(let i=0;i<chunks.length && results.length<3;i++){
    const letters = chunks[i].slice(0,-1), tone = chunks[i].slice(-1);
    const sp = splitSyllable(letters);
    if(!sp || !sp.initial) continue;
    shuffle(confusablesFor(INITIAL_PAIRS, sp.initial)).forEach(alt=>{
      if(results.length>=3) return;
      if(INITIAL_FINALS[alt] && INITIAL_FINALS[alt].indexOf(sp.final)>=0){
        tryAdd(chunks.map((c,j)=>j===i?(alt+sp.final+tone):c));
      }
    });
  }
  // 3. confusable final swap
  for(let i=0;i<chunks.length && results.length<3;i++){
    const letters = chunks[i].slice(0,-1), tone = chunks[i].slice(-1);
    const sp = splitSyllable(letters);
    if(!sp) continue;
    const alts = confusablesFor(FINAL_PAIRS, sp.final);
    if(sp.final==="u" && (sp.initial==="n"||sp.initial==="l")) alts.push("ü");
    if(sp.final==="ü" && (sp.initial==="n"||sp.initial==="l")) alts.push("u");
    shuffle(alts).forEach(alt=>{
      if(results.length>=3) return;
      if(INITIAL_FINALS[sp.initial] && INITIAL_FINALS[sp.initial].indexOf(alt)>=0){
        tryAdd(chunks.map((c,j)=>j===i?(sp.initial+alt+tone):c));
      }
    });
  }
  // 4. another vocab word, same syllable count
  if(results.length<3 && pool && pool.length){
    shuffle(pool.filter(v=>v.n!==entry.n && syll(v.n).length===chunks.length)).forEach(v=>{
      if(results.length<3) tryAdd(syll(v.n));
    });
  }
  return results.slice(0,3);
}

// ------------------------------------------------- meaning-centred distractors
// first two whitespace-separated words of a gloss, lowercased and stripped of
// punctuation — used to reject near-synonym distractors (two "to eat"-ish glosses).
function firstTwoWords(en){
  return String(en).toLowerCase().replace(/[^a-z\s]/g,"").trim().split(/\s+/).slice(0,2).join(" ");
}

// entry: {en,lv,w,...}; pool: VOCAB array. Returns up to 3 other VOCAB entries whose
// gloss is a plausible wrong answer: never the same gloss, never sharing the first two
// gloss words with the answer or with each other, same level preferred over other levels.
function meaningOpts(entry, pool){
  const ansKey = String(entry.en).trim().toLowerCase();
  const ansFirst2 = firstTwoWords(entry.en);
  const candidates = (pool||[]).filter(v=>v.w!==entry.w && String(v.en).trim().toLowerCase()!==ansKey);
  const bySame = shuffle(candidates.filter(v=>v.lv===entry.lv));
  const byOther = shuffle(candidates.filter(v=>v.lv!==entry.lv));
  const ordered = [...bySame, ...byOther];

  function pass(strict){
    const chosen = []; const usedFirst2 = new Set([ansFirst2]);
    ordered.forEach(v=>{
      if(chosen.length>=3) return;
      const f2 = firstTwoWords(v.en);
      if(strict && usedFirst2.has(f2)) return;
      chosen.push(v); usedFirst2.add(f2);
    });
    return chosen;
  }
  let chosen = pass(true);
  if(chosen.length<3) chosen = pass(false); // small-pool fallback: keep "not the answer" only
  return chosen.slice(0,3);
}

// entry: {n,lv,...}; pool: VOCAB array. Returns up to 3 other VOCAB entries with the
// same syllable count as entry, same level preferred. Not phonetic near-misses (that
// generator is `distractors()` above, kept only for the Extras tone/type items) —
// meaning-recall distractors should be plausible words, not confusable spellings.
function pinyinOpts(entry, pool){
  const n = syll(entry.n).length;
  const ansKey = String(entry.en).trim().toLowerCase();
  const seen = new Set([pipeline(entry.n)]);
  const rank = v => Math.abs(syll(v.n).length - n);
  // Exclude gloss-twins (e.g. 经历/经验, both "experience; to experience") — with the
  // meaning shown and two pinyin options for words that mean the same thing, either
  // would be a "correct" answer, so the item would be ambiguous rather than hard.
  const candidates = (pool||[]).filter(v=>pipeline(v.n)!==pipeline(entry.n) && String(v.en).trim().toLowerCase()!==ansKey);
  const exact = candidates.filter(v=>rank(v)===0);
  const bySame = shuffle(exact.filter(v=>v.lv===entry.lv));
  const byOther = shuffle(exact.filter(v=>v.lv!==entry.lv));
  const chosen = [];
  function addFrom(list){
    list.forEach(v=>{
      if(chosen.length>=3) return;
      const key = pipeline(v.n);
      if(seen.has(key)) return;
      seen.add(key); chosen.push(v);
    });
  }
  addFrom(bySame); addFrom(byOther);
  if(chosen.length<3){
    // Extremely rare (a syllable count with fewer than 3 other words in the whole
    // corpus — e.g. "公共汽车" is the only 4-syllable HSK 1-4 word) — widen to the
    // closest syllable counts rather than leaving the drill item short of 4 options.
    const rest = shuffle(candidates.filter(v=>rank(v)>0)).sort((a,b)=>rank(a)-rank(b));
    addFrom(rest);
  }
  return chosen.slice(0,3);
}

// --------------------------------------------------------------- placement
// Splits a vocab pool into placement buckets: bucketSpec = [[level, bucketCount], ...].
// Default matches the spec: HSK1x3, HSK2x3, HSK3x4, HSK4x6 (16 buckets).
function strata(pool, bucketSpec){
  const spec = bucketSpec || [[1,3],[2,3],[3,4],[4,6]];
  const out = [];
  spec.forEach(([lv,nb])=>{
    const list = pool.filter(v=>v.lv===lv);
    const nsets = Math.ceil(list.length/10);
    const per = nsets/nb;
    for(let b=0;b<nb;b++){
      const s0 = Math.floor(b*per), s1 = Math.max(s0+1, Math.floor((b+1)*per));
      out.push({lv, s0, s1, words: list.slice(s0*10, s1*10)});
    }
  });
  return out;
}

// Decides where placement stops, given per-bucket results res=[{r,n},...] in bucket order.
// A single bucket's raw accuracy is noisy at 2-3 items (1 miss = 50-67%), so passing is
// judged on a rolling window of up to 3 buckets (the current one plus its two predecessors):
// bucket i passes if that window's combined accuracy is >=75% AND bucket i itself has
// at least 1 right answer (so an all-wrong bucket can never pass on a good window alone).
// Returns the index of the first failing bucket, or null if every bucket passed.
function placementStopIndex(res){
  for(let i=0;i<res.length;i++){
    const lo = Math.max(0, i-2);
    let wr = 0, wn = 0;
    for(let j=lo;j<=i;j++){ wr += res[j].r; wn += res[j].n; }
    const windowAcc = wn ? wr/wn : 1;
    const bucketOk = res[i].r >= 1;
    if(!(windowAcc >= 0.75 && bucketOk)) return i;
  }
  return null;
}

// Validates the shape of imported progress JSON before it replaces the live prog object.
// Returns {ok:true, data} or {ok:false, reason}.
function validateProgShape(data){
  if(!data || typeof data !== "object" || Array.isArray(data)) return {ok:false, reason:"not a JSON object"};
  if(data.v !== undefined && data.v !== 1 && data.v !== 2) return {ok:false, reason:`unknown progress version ${data.v}`};
  if(data.w !== undefined){
    if(!data.w || typeof data.w !== "object" || Array.isArray(data.w)) return {ok:false, reason:"w must be an object"};
    for(const k of Object.keys(data.w)){
      const p = data.w[k];
      if(!p || typeof p !== "object" || Array.isArray(p)) return {ok:false, reason:`w.${k} must be an object`};
      for(const f of ["r","w","s"]) if(p[f] !== undefined && typeof p[f] !== "number") return {ok:false, reason:`w.${k}.${f} must be a number`};
      if(p.prov !== undefined && typeof p.prov !== "number" && typeof p.prov !== "boolean") return {ok:false, reason:`w.${k}.prov must be a number or boolean`};
      if(p.d !== undefined && typeof p.d !== "number" && typeof p.d !== "boolean") return {ok:false, reason:`w.${k}.d must be a number or boolean`};
    }
  }
  if(data.sets !== undefined){
    if(!data.sets || typeof data.sets !== "object" || Array.isArray(data.sets)) return {ok:false, reason:"sets must be an object"};
    for(const k of Object.keys(data.sets)){
      if(!["1","2","3","4"].includes(k)) return {ok:false, reason:`sets has unknown level "${k}"`};
      if(typeof data.sets[k] !== "number") return {ok:false, reason:`sets.${k} must be a number`};
    }
  }
  if(data.lessons !== undefined && (!data.lessons || typeof data.lessons !== "object" || Array.isArray(data.lessons))) return {ok:false, reason:"lessons must be an object"};
  if(data.sessions !== undefined && typeof data.sessions !== "number") return {ok:false, reason:"sessions must be a number"};
  if(data.showChars !== undefined && typeof data.showChars !== "boolean") return {ok:false, reason:"showChars must be a boolean"};
  // dismissedSoundsHint is no longer written (the Today hints now hide by real state --
  // placement taken / a lesson opened -- rather than a dismiss button), but an old
  // export may still carry it, so it's accepted and simply ignored on import.
  if(data.dismissedSoundsHint !== undefined && typeof data.dismissedSoundsHint !== "boolean" && typeof data.dismissedSoundsHint !== "number") return {ok:false, reason:"dismissedSoundsHint must be a boolean or number"};
  if(data.placedOnce !== undefined && typeof data.placedOnce !== "boolean" && typeof data.placedOnce !== "number") return {ok:false, reason:"placedOnce must be a boolean or number"};
  if(data.soundsOpened !== undefined && typeof data.soundsOpened !== "boolean" && typeof data.soundsOpened !== "number") return {ok:false, reason:"soundsOpened must be a boolean or number"};
  // s (sentence progress, Phase 2) and c (character progress, Phase 3) share one
  // record shape: {r,w,s} numbers, keyed by sentence zh / VOCAB w respectively.
  for(const bucket of ["s","c"]){
    const m = data[bucket];
    if(m === undefined) continue;
    if(!m || typeof m !== "object" || Array.isArray(m)) return {ok:false, reason:`${bucket} must be an object`};
    for(const k of Object.keys(m)){
      const p = m[k];
      if(!p || typeof p !== "object" || Array.isArray(p)) return {ok:false, reason:`${bucket}.${k} must be an object`};
      for(const f of ["r","w","s"]) if(p[f] !== undefined && typeof p[f] !== "number") return {ok:false, reason:`${bucket}.${k}.${f} must be a number`};
    }
  }
  if(data.mixChars !== undefined && typeof data.mixChars !== "boolean") return {ok:false, reason:"mixChars must be a boolean"};
  // Phase 3b path flags: characters-after-HSK-4 ordering, and whether the one-time
  // "characters next / skip to HSK 4" choice card has been answered.
  for(const f of ["charsAfterHsk4","charsChoiceSeen"]){
    if(data[f] !== undefined && typeof data[f] !== "boolean") return {ok:false, reason:`${f} must be a boolean`};
  }
  return {ok:true, data};
}

// Merges any validated progress data (v1 or v2 shaped) onto full v2 defaults and forces
// v:2, so a v1 export (or a v1 localStorage record at boot) migrates to a well-formed v2
// progress object. Word/set/lesson data is unchanged between versions — only `v` and the
// new `showChars` field (default false) differ. Shared by the app's import handler and
// its boot-time migration so there is exactly one place that knows the v1->v2 shape.
// Phase 3 adds two more defaulted fields, still under v:2 (the change is purely
// additive): `c` (character progress, {}) and `mixChars` (mix known characters into
// sentence rendering, true). Every field already present in `data` is carried over
// untouched -- only missing fields are filled.
// Phase 3b adds `charsAfterHsk4` / `charsChoiceSeen` (both default false), same rules.
function migrateProg(data){
  const base = { v:2, w:{}, sets:{1:0,2:0,3:0,4:0}, lessons:{}, sessions:0, theme:null, showChars:false, s:{}, c:{}, mixChars:true, charsAfterHsk4:false, charsChoiceSeen:false };
  const merged = Object.assign({}, base, data||{}, {v:2});
  if(merged.showChars === undefined) merged.showChars = false;
  if(merged.s === undefined) merged.s = {};
  if(merged.c === undefined) merged.c = {};
  if(merged.mixChars === undefined) merged.mixChars = true;
  if(merged.charsAfterHsk4 === undefined) merged.charsAfterHsk4 = false;
  if(merged.charsChoiceSeen === undefined) merged.charsChoiceSeen = false;
  return merged;
}

// ------------------------------------------------------------- sentences (Phase 2)
// A sentence's `words` may be a VOCAB word directly, or a SENTENCE_EXTRA compound
// (a transparent whitelisted compound like 你们/这个 that isn't its own VOCAB entry --
// see data/hsk_sentences.js's header comment). Function words never get blanked in a
// gapSentence item: they're too easy (context alone gives them away) and too central
// to the sentence's grammar to work as a fair "guess the content word" test.
const SENTENCE_FUNCTION_WORDS = ["的","了","吗","呢","是","我","你","他","她","我们","你们","他们","和","在","不","很","也","都"];

// Reverse lookup: guesses a single tone (1-4, or 5 if none found) for a chunk of
// already-marked pinyin text by scanning for a toned vowel, right to left, so a
// word with a neutral-tone suffix (e.g. "nǐmen") still colours by its meaningful
// syllable. Used only for SENTENCE_EXTRA tokens, which have no numbered form to
// render through pyHTML (their pinyin isn't derivable by joining VOCAB entries) --
// VOCAB words in a sentence are coloured per-syllable via pyHTML(entry.n) instead,
// same as everywhere else.
function guessTone(markedText){
  const s = String(markedText);
  for(let i=s.length-1;i>=0;i--){
    const lower = s[i].toLowerCase();
    const base = BASE_OF[lower];
    if(base !== undefined){
      for(let t=1;t<=4;t++){ if(TONE_CHARS[base][t] === lower) return t; }
    }
  }
  return 5;
}

// Uppercases the first visible character of a "<span ...>text</span>" HTML
// fragment (as pyHTML/guessTone-based rendering produces), regardless of whether
// that character carries a tone diacritic (ā, ǚ, etc. are their own Unicode code
// points and don't match a plain [a-z] class -- a bug this replaced matched the
// wrong character, e.g. 阿姨's "āyí" rendering as "āYí" because a regex scanning
// for the first [a-z] letter anywhere in the string, not anchored to the very
// start, found the second syllable's "y" instead). Anchored to the string's
// start, so it only ever touches the one character right after the opening tag.
function capitalizeFirstSpan(html){
  return String(html).replace(/^(<[^>]+>)([^<])/, (m, tag, c) => tag + c.toUpperCase());
}

// Splits a sentence's word-spaced `py` into per-word tokens aligned 1:1 with its
// `words` array (guaranteed by tools/check_sentences.py's pinyin cross-check --
// every word's own pinyin, space-joined, equals `py` exactly modulo case and
// tone-sandhi). Returns null if the alignment doesn't hold (defensive: callers
// should degrade to plain, uncoloured text rather than mis-render). Each token's
// trailing sentence punctuation (, . ? !) is split off into `punct` so it can be
// re-attached after the word's pinyin is coloured.
function sentenceTokens(sentence){
  const toks = String(sentence.py).split(" ");
  const words = sentence.words || [];
  if(toks.length !== words.length) return null;
  return toks.map((tok, i) => {
    const m = /^(.*?)([,.?!]*)$/.exec(tok);
    return { word: words[i], core: m[1], punct: m[2], index: i };
  });
}

// entry: {en,lv,words,...} (a SENTENCES entry); pool: SENTENCES array. Returns up
// to 3 other sentences of the same level with a different English gloss, preferring
// ones that share at least one word with the answer (a shared-word distractor is a
// plausible near-miss; an unrelated sentence at the same level is the fallback).
function sentenceOpts(sentence, pool){
  const ansKey = String(sentence.en).trim().toLowerCase();
  const wordSet = new Set(sentence.words || []);
  const candidates = (pool || []).filter(s => s.zh !== sentence.zh && s.lv === sentence.lv && String(s.en).trim().toLowerCase() !== ansKey);
  const sharing = shuffle(candidates.filter(s => (s.words||[]).some(w=>wordSet.has(w))));
  const other = shuffle(candidates.filter(s => !(s.words||[]).some(w=>wordSet.has(w))));
  const chosen = []; const seenEn = new Set([ansKey]);
  function addFrom(list){
    list.forEach(s=>{
      if(chosen.length>=3) return;
      const key = String(s.en).trim().toLowerCase();
      if(seenEn.has(key)) return;
      seenEn.add(key); chosen.push(s);
    });
  }
  addFrom(sharing); addFrom(other);
  if(chosen.length<3){
    // Small-pool fallback (a level with very few sentences): widen past the
    // same-level restriction rather than shipping fewer than 3 options.
    addFrom(shuffle((pool||[]).filter(s=>s.zh!==sentence.zh && !seenEn.has(String(s.en).trim().toLowerCase()))));
  }
  return chosen.slice(0,3);
}

// sentence: a SENTENCES entry; vocabPool: VOCAB array. Returns the indices into
// sentence.words that are legal gapSentence blanks: a VOCAB word (not a
// SENTENCE_EXTRA compound -- those have no numbered pinyin for gapOpts to match
// against), at the sentence's own level (testing content actually at that
// difficulty, not an easier word incidentally present), not a function word, and
// not a word that recurs elsewhere in the same sentence -- blanking one
// occurrence of a repeated word would still leave the answer sitting in plain
// sight at its other occurrence(s).
function gapCandidateIndices(sentence, vocabPool){
  const byW = {}; (vocabPool||[]).forEach(v=>{ byW[v.w] = v; });
  const words = sentence.words || [];
  const counts = {}; words.forEach(w=>{ counts[w] = (counts[w]||0) + 1; });
  const out = [];
  words.forEach((w,i)=>{
    if(SENTENCE_FUNCTION_WORDS.indexOf(w) >= 0) return;
    if(counts[w] > 1) return;
    const entry = byW[w];
    if(entry && entry.lv === sentence.lv) out.push(i);
  });
  return out;
}

// entry: a VOCAB entry (the blanked word); pool: VOCAB array. Returns up to 3 other
// VOCAB words at the SAME level and syllable count as entry -- a strict same-level
// match (not "prefer", unlike pinyinOpts elsewhere), since a gapSentence item is
// testing content pitched at exactly the sentence's own difficulty.
function gapOpts(entry, pool){
  const n = syll(entry.n).length;
  const seen = new Set([pipeline(entry.n)]);
  const chosen = [];
  function addFrom(list){
    list.forEach(v=>{
      if(chosen.length>=3) return;
      const key = pipeline(v.n);
      if(seen.has(key)) return;
      seen.add(key); chosen.push(v);
    });
  }
  addFrom(shuffle((pool||[]).filter(v=>v.w!==entry.w && v.lv===entry.lv && syll(v.n).length===n)));
  if(chosen.length<3){
    // Fallback for a sparse (level, syllable-count) pool: same syllable count at
    // any level, then same level at any syllable count.
    addFrom(shuffle((pool||[]).filter(v=>v.w!==entry.w && syll(v.n).length===n)));
  }
  if(chosen.length<3){
    addFrom(shuffle((pool||[]).filter(v=>v.w!==entry.w && v.lv===entry.lv)));
  }
  return chosen.slice(0,3);
}

// ------------------------------------------------------------- characters (Phase 3)
// Character recognition of words already known by sound. Progress lives in
// prog.c[w] = {r,w,s} (same shape as prog.s). Thresholds on the streak `s`:
const CHAR_MASTERED = 3; // "mastered" for Progress / path strip; ruby tier in sentences
const CHAR_BARE = 6;     // characters alone (no pinyin) in mixed sentences

// All of HSK 1-3 taught by sound (the point the 字 1-3 stage becomes reachable).
// The app's gate for character surfaces is charsStarted() below (Phase 3b). sets = prog.sets; nsets = {1:n1, 2:n2, 3:n3} (total
// set counts per level, passed in so core stays data-free).
function charsUnlocked(sets, nsets){
  sets = sets || {};
  return [1,2,3].every(lv => (sets[lv]||0) >= nsets[lv]);
}

// Streak -> sentence-token rendering tier: "py" (pinyin only), "ruby" (characters
// with small pinyin above), "bare" (characters alone).
function charTier(streak){
  const s = +streak || 0;
  if(s >= CHAR_BARE) return "bare";
  if(s >= CHAR_MASTERED) return "ruby";
  return "py";
}
// The full per-token decision used by the app's sentence renderer: mixing only
// happens once characters are unlocked AND the learner hasn't switched it off.
function sentenceTokenTier(streak, unlocked, mixChars){
  if(!unlocked || !mixChars) return "py";
  return charTier(streak);
}

// learned: VOCAB entries the learner knows by sound; cprog: prog.c; vocab: VOCAB (for
// frequency order). Returns up to n learned words with no character record yet,
// HSK 1 first, VOCAB (frequency) order within a level.
function newCharWords(learned, cprog, vocab, n){
  const idx = new Map(); (vocab||[]).forEach((v,i)=>idx.set(v.w, i));
  const c = cprog || {};
  return (learned||[]).filter(v => !c[v.w])
    .sort((a,b) => (a.lv - b.lv) || ((idx.get(a.w)||0) - (idx.get(b.w)||0)))
    .slice(0, n);
}

// entry: VOCAB entry; pool: VOCAB. Returns 3 other VOCAB entries as character-tile
// distractors for pickChar: prefer same level + same character count, then same
// level any length, then any. Never the same `w`, never the same gloss (`en`), and
// never a homophone (same numbered pinyin -- pickChar shows the pinyin and plays the
// audio, so 他/她/它-style twins would make the item ambiguous). Distractors are
// also pairwise distinct in `w` and gloss.
function charOpts(entry, pool){
  const ansEn = String(entry.en).trim().toLowerCase();
  const ansN = pipeline(entry.n);
  const len = [...String(entry.w)].length;
  const candidates = (pool||[]).filter(v => v.w !== entry.w
    && String(v.en).trim().toLowerCase() !== ansEn && pipeline(v.n) !== ansN);
  const chosen = []; const seenW = new Set([entry.w]); const seenEn = new Set([ansEn]);
  function addFrom(list){
    list.forEach(v => {
      if(chosen.length >= 3) return;
      const en = String(v.en).trim().toLowerCase();
      if(seenW.has(v.w) || seenEn.has(en)) return;
      seenW.add(v.w); seenEn.add(en); chosen.push(v);
    });
  }
  addFrom(shuffle(candidates.filter(v => v.lv === entry.lv && [...String(v.w)].length === len)));
  addFrom(shuffle(candidates.filter(v => v.lv === entry.lv)));
  addFrom(shuffle(candidates.slice()));
  return chosen.slice(0, 3);
}

// ------------------------------------------------------ learning path (Phase 3b)
// The path is a sequence of stages. Word stages teach sets of 10 by sound (progress =
// prog.sets[lv]); character stages teach recognition of the characters of words
// already known by sound, in sets of 10 taken from the stage's levels (HSK 1 first,
// VOCAB/frequency order within a level). A character set counts as taught once every
// word in it has a prog.c record -- there is no separate counter.
// Default order: HSK1 -> HSK2 -> HSK3 -> 字(1-3) -> HSK4 -> 字(4).
// With p.charsAfterHsk4: HSK1 -> HSK2 -> HSK3 -> HSK4 -> 字(1-4).
const CHAR_SET_SIZE = 10;
function charStageWords(levels, vocab){
  const idx = new Map(); (vocab||[]).forEach((v,i)=>idx.set(v.w, i));
  return (vocab||[]).filter(v => levels.indexOf(v.lv) >= 0)
    .sort((a,b) => (a.lv - b.lv) || (idx.get(a.w) - idx.get(b.w)));
}
function charSets(levels, vocab){
  const words = charStageWords(levels, vocab); const out = [];
  for(let i=0; i<words.length; i+=CHAR_SET_SIZE) out.push(words.slice(i, i+CHAR_SET_SIZE));
  return out;
}
function charSetTaught(set, cprog){ const c = cprog || {}; return set.every(v => !!c[v.w]); }
// First character set in `levels` not yet fully recorded: {index, words, total} or null.
function nextCharSet(levels, cprog, vocab){
  const sets = charSets(levels, vocab);
  for(let i=0; i<sets.length; i++) if(!charSetTaught(sets[i], cprog)) return {index:i, words:sets[i], total:sets.length};
  return null;
}
// p: {sets, c, charsAfterHsk4}; nsets: {1..4: total set counts}; vocab: VOCAB.
// Returns every stage in path order with {kind, label, frac, done} plus
// kind "words": lv, set (next set index); kind "chars": levels, key ("13"/"4"/"1234").
function stagePath(p, nsets, vocab){
  p = p || {}; const sets = p.sets || {}; const c = p.c || {};
  const wordStage = lv => {
    const n = nsets[lv] || 0, k = Math.min(sets[lv] || 0, n);
    return { kind:"words", lv, label:"HSK"+lv, set:k, frac: n ? k/n : 1, done: k >= n };
  };
  const charStage = (levels, label) => {
    const words = charStageWords(levels, vocab);
    const rec = words.filter(v => !!c[v.w]).length;
    return { kind:"chars", levels, key: levels.join(""), label,
      frac: words.length ? rec/words.length : 1, done: rec >= words.length };
  };
  return p.charsAfterHsk4
    ? [wordStage(1), wordStage(2), wordStage(3), wordStage(4), charStage([1,2,3,4], "字")]
    : [wordStage(1), wordStage(2), wordStage(3), charStage([1,2,3], "字"), wordStage(4), charStage([4], "字4")];
}
function nextStage(p, nsets, vocab){
  return stagePath(p, nsets, vocab).find(s => !s.done) || null;
}
// "Characters have started": any character record exists, or the current stage is a
// character stage. Gates every character-related surface outside the path strip.
function charsStarted(p, nsets, vocab){
  const c = (p && p.c) || {};
  for(const k in c) if(Object.prototype.hasOwnProperty.call(c, k)) return true;
  const st = nextStage(p, nsets, vocab);
  return !!(st && st.kind === "chars");
}
// One-time "characters next / skip to HSK 4" choice: shown iff it hasn't been answered,
// the order hasn't already been switched, HSK 1-3 are all taught, HSK 4 isn't, and the
// 字 1-3 stage is still incomplete (so the current stage is 字 1-3) -- regardless of
// whether some character records exist (Test/Review can create records before the
// card is answered, and v2.2 learners already have some).
function showCharChoice(p, nsets, vocab){
  p = p || {}; const sets = p.sets || {}; const c = p.c || {};
  return !p.charsChoiceSeen && !p.charsAfterHsk4
    && [1,2,3].every(lv => (sets[lv]||0) >= nsets[lv]) && (sets[4]||0) < nsets[4]
    && (vocab||[]).some(v => v.lv <= 3 && !c[v.w]);
}
// Shared weakness score for word (prog.w) and character (prog.c) records.
function weakScoreOf(rec){ const p = rec || {}; return (p.w||0)*3 - (p.s||0); }
// Character records in the unified review: an unmastered character (s < 3) scores at
// least 0, tying with never-drilled learned words (which score 0), so fresh characters
// aren't starved by a large pool of unrecorded words; mastered ones keep w*3 - s.
function charReviewScore(rec){
  const p = rec || {}; const sc = weakScoreOf(p);
  return (p.s||0) < CHAR_MASTERED ? Math.max(sc, 0) : sc;
}
// Unified Review ranking: words = learned VOCAB entries (weakScoreOf on wprog), chars =
// entries with a character record (charReviewScore on cprog). Returns the n weakest as
// [{kind:"w"|"c", entry, score}], random tie-break within equal scores.
function rankReview(words, wprog, chars, cprog, n){
  const pool = [
    ...(words||[]).map(e => ({kind:"w", entry:e, score: weakScoreOf((wprog||{})[e.w])})),
    ...(chars||[]).map(e => ({kind:"c", entry:e, score: charReviewScore((cprog||{})[e.w])}))
  ];
  pool.forEach(x => { x.key = x.score + Math.random()*0.9; });
  return pool.sort((a,b) => b.key - a.key).slice(0, n).map(({kind, entry, score}) => ({kind, entry, score}));
}
// recallChar options: the answer's characters + 3 charOpts distractors (4 strings).
function recallCharOpts(entry, pool){ return [entry.w, ...charOpts(entry, pool).map(d => d.w)]; }

// ------------------------------------------------------------------- export
const API = { syll, mark, tones, strip, pyHTML, normType, acceptTypeAnswer, distractors, strata,
  placementStopIndex, validateProgShape, migrateProg, meaningOpts, pinyinOpts, firstTwoWords, gloss, escapeHtml,
  SENTENCE_FUNCTION_WORDS, guessTone, sentenceTokens, sentenceOpts, gapCandidateIndices, gapOpts, capitalizeFirstSpan,
  CHAR_MASTERED, CHAR_BARE, charsUnlocked, charTier, sentenceTokenTier, newCharWords, charOpts,
  CHAR_SET_SIZE, charStageWords, charSets, charSetTaught, nextCharSet, stagePath, nextStage, charsStarted,
  weakScoreOf, charReviewScore, showCharChoice, rankReview, recallCharOpts,
  VALID_SYLLABLES, INITIAL_FINALS, splitSyllable, pipeline, numberedCandidates, markSyllable };
if(typeof module!=="undefined" && module.exports) module.exports = API;
if(root) root.PinyinCore = API;
})(typeof window!=="undefined" ? window : (typeof globalThis!=="undefined" ? globalThis : null));
